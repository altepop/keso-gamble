<body>
  <div id="app"></div>
  <script>/** KESO EXCHANGE v0.1 - local prototype engine (NOT authoritative for real multiplayer). */
const SCHEMA_VERSION = 1;
const MARKET = [
  { id: 'keso', ticker: 'KESO', name: 'KESOホールディングス', category: '総合', initialPrice: 1200, volatility: 0.036, drift: 0.002, icon: '◆' },
  { id: 'riso', ticker: 'RISO', name: 'リソ寿司', category: '飲食', initialPrice: 780, volatility: 0.054, drift: 0.001, icon: '寿' },
  { id: 'yuya', ticker: 'YUYA', name: 'ゆーやエンタメ', category: '娯楽', initialPrice: 420, volatility: 0.082, drift: 0.002, icon: '★' },
  { id: 'yano', ticker: 'YANO', name: '矢野ファイナンス', category: '金融', initialPrice: 1860, volatility: 0.031, drift: 0.001, icon: '¥' },
];
const SHOP = [
  { id: 'gold', icon: '✦', name: 'ゴールド称号', detail: 'Activity内で黄金の称号を表示', price: 2200, tier: '装飾' },
  { id: 'fanfar', icon: '♫', name: '大当たりSE', detail: 'Activity内で購入記念SEを再生', price: 1100, tier: '演出' },
  { id: 'firework', icon: '✺', name: '黄金の祝砲', detail: 'Activity内にきらめく祝賀演出', price: 3500, tier: '演出' },
  { id: 'vc', icon: '⌘', name: '専用VC開設権', detail: '本番ではBotによる専用VC作成を申請', price: 6500, tier: 'Discord連携予定' },
  { id: 'color', icon: '◉', name: '金色ロール', detail: '本番ではBotによるロール付与を申請', price: 4800, tier: 'Discord連携予定' },
  { id: 'monument', icon: '♛', name: '殿堂入り', detail: '本番では記念メッセージを投稿', price: 16000, tier: 'Discord連携予定' },
];
function createInitialState(now = Date.now()) {
  return {
    version: SCHEMA_VERSION,
    cash: 10000,
    holdings: Object.fromEntries(MARKET.map((stock) => [stock.id, 0])),
    prices: Object.fromEntries(MARKET.map((stock) => [stock.id, stock.initialPrice])),
    history: Object.fromEntries(MARKET.map((stock) => [stock.id, Array.from({ length: 13 }, (_, i) => Math.round(stock.initialPrice * (0.96 + (i / 12) * .04)))])),
    owned: [], trades: [], spins: [], salaryClaims: 0, lastSalaryAt: 0,
    ticks: 0, lastMarketAt: now, seed: 7331,
  };
}
function hydrateState(raw, now = Date.now()) {
  if (!raw || raw.version !== SCHEMA_VERSION || !Number.isSafeInteger(raw.cash) || raw.cash < 0 || !raw.prices || !raw.holdings || !Array.isArray(raw.owned)) return createInitialState(now);
  for (const s of MARKET) {
    if (!Number.isInteger(raw.prices[s.id]) || raw.prices[s.id] < 1 || !Number.isInteger(raw.holdings[s.id]) || raw.holdings[s.id] < 0 || !Array.isArray(raw.history?.[s.id])) return createInitialState(now);
  }
  return { ...createInitialState(now), ...raw, trades: Array.isArray(raw.trades) ? raw.trades.slice(0,50) : [], spins: Array.isArray(raw.spins) ? raw.spins.slice(0,30) : [], owned: raw.owned.filter(id=>SHOP.some(item=>item.id===id)) };
}
function money(n) { return Math.floor(n).toLocaleString('ja-JP') + ' KC'; }
function portfolioValue(state) { return MARKET.reduce((sum,s) => sum + state.holdings[s.id]*state.prices[s.id],0); }
function assets(state) { return state.cash + portfolioValue(state); }
function nextRandom(state) { state.seed = (Math.imul(state.seed, 1664525) + 1013904223) >>> 0; return state.seed / 4294967296; }
function advanceMarket(state, now = Date.now()) {
  const elapsed = Math.max(0, Math.floor((now - state.lastMarketAt)/60000));
  const steps = Math.min(elapsed, 30); // Demo never performs unbounded offline work.
  if (!steps) return 0;
  for (let i=0;i<steps;i++) for(const s of MARKET) {
    const direction = (nextRandom(state)*2-1)*s.volatility + s.drift;
    const newPrice = Math.max(20, Math.round(state.prices[s.id]*(1+direction)));
    state.prices[s.id] = newPrice;
    state.history[s.id].push(newPrice);
    state.history[s.id] = state.history[s.id].slice(-26);
  }
  state.ticks += steps;
  state.lastMarketAt = now;
  return steps;
}
function trade(state, symbol, side, quantity, now = Date.now()) {
  const stock= MARKET.find(s=>s.id===symbol);
  if(!stock) throw new Error('存在しない銘柄だ');
  if(!Number.isSafeInteger(quantity)||quantity<1||quantity>100000) throw new Error('株数は1以上の整数で指定');
  if(side!=='buy'&&side!=='sell') throw new Error('無効な取引だ');
  const gross=stock && state.prices[symbol]*quantity;
  if(!Number.isSafeInteger(gross)) throw new Error('取引額が大きすぎる');
  const fee=Math.ceil(gross*0.01);
  if(side==='buy') {
    if(state.cash < gross+fee) throw new Error('現金が不足している');
    state.cash -= gross+fee;state.holdings[symbol]+=quantity;
  }else{
    if(state.holdings[symbol]<quantity) throw new Error('保有株数が不足している');
    if(gross-fee<0) throw new Error('取引できない');
    state.cash += gross-fee;state.holdings[symbol]-=quantity;
  }
  state.trades.unshift({id:`${now}-${state.trades.length}`,side,symbol,quantity,price:state.prices[symbol],fee,time:now});
  state.trades=state.trades.slice(0,50);
  return {gross,fee};
}
function roulettePayout(type,choice,number,bet) {
  if(!Number.isInteger(number)||number<0||number>36) throw new Error('出目が不正だ');
  const redNumbers=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  if(type==='red') return redNumbers.has(number)? bet*2 : 0;
  if(type==='black') return number!==0&&!redNumbers.has(number)?bet*2:0;
  if(type==='even') return number!==0&&number%2===0?bet*2:0;
  if(type==='odd') return number%2===1?bet*2:0;
  if(type==='number')return number===choice?bet*36:0;
  throw new Error('無効な賭け方だ');
}
function spin(state, type, amount, choice=0, outcome, now=Date.now()) {
  if(!Number.isSafeInteger(amount)||amount<100||amount>20000) throw new Error('賭け額は100〜20,000 KC');
  if(state.cash<amount)throw new Error('所持KCが不足している');
  if(type==='number'&&(!Number.isInteger(choice)||choice<0||choice>36))throw new Error('数字は0〜36だ');
  if(!['red','black','even','odd','number'].includes(type))throw new Error('無効な賭け方だ');
  // Demo: browser crypto must supply outcome; engine never uses predictable PRNG for casino.
  if(!Number.isInteger(outcome)||outcome<0||outcome>36)throw new Error('抽選結果が必要だ');
  const payout=roulettePayout(type,choice,outcome,amount);
  state.cash = state.cash-amount+payout;
  const record={type,choice,outcome,amount,payout,time:now};
  state.spins.unshift(record); state.spins=state.spins.slice(0,30);
  return record;
}
function buyReward(state, itemId) {
  const item=SHOP.find(s=>s.id===itemId);
  if(!item)throw new Error('存在しない商品だ');
  if(state.owned.includes(itemId))throw new Error('購入済みだ');
  if(state.cash<item.price)throw new Error('所持KCが不足している');
  state.cash-=item.price;state.owned.push(itemId);
  return item;
}
function grantDemoSalary(state, now=Date.now()) {
  if(now - state.lastSalaryAt < 30000)throw new Error('デモ給与は30秒ごとに受け取れる');
  state.cash+=600;state.lastSalaryAt=now;state.salaryClaims++;
  return 600;
}
function cryptoRouletteNumber() {
  if(!globalThis.crypto?.getRandomValues) throw new Error('この環境では暗号学的乱数を利用できない');
  const v=new Uint32Array(1), max=Math.floor(4294967296/37)*37;
  do { globalThis.crypto.getRandomValues(v); } while(v[0]>=max);
  return v[0]%37;
}

function linePath(points,w,h,pad=10){

}

function genCandles(base,id){
  const out=[];let close=base*0.98;let seed=id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)+77;
  const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  for(let i=0;i<46;i++){
    const open=close + (rand()-.5)*base*0.035;
    close=Math.max(base*0.78,Math.min(base*1.18, open + (rand()-.5)*base*0.07));
    const high=Math.max(open,close)+rand()*base*0.03;
    const low=Math.min(open,close)-rand()*base*0.03;
    const vol=150000+Math.floor(rand()*130000);
    const date=new Date(Date.now()-(45-i)*86400000);const label=`${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`;
    out.push({open,high,low,close,vol,date:label});
  }
  out[out.length-1].close=base;
  out[out.length-1].high=Math.max(out[out.length-1].high,base+base*0.012);
  out[out.length-1].low=Math.min(out[out.length-1].low,base-base*0.012);
  return out;
}

function movingAverage(data,n,idx){
  return data.map((_,i)=>{
    const start=Math.max(0,i-n+1); const slice=data.slice(start,i+1).map(v=>v.close);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
}

function svgCandles(data,w=660,h=560){
  const pad={t:22,r:70,b:36,l:18};
  const plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.high));
  const min=Math.min(...data.map(d=>d.low));
  const range=max-min||1;
  const y=v=>pad.t + (max-v)/range*plotH;
  const step=plotW/data.length;
  const body=Math.max(6,step*.56);
  const ma5=movingAverage(data,5), ma10=movingAverage(data,10), ma25=movingAverage(data,25);
  const maPath=(arr)=>arr.map((v,i)=>`${i?'L':'M'} ${pad.l+step*i+step/2} ${y(v)}`).join(' ');
  const gridY=[0,.25,.5,.75,1].map(r=>min+(range*(1-r)));
  const labelsY=gridY.map(v=>Math.round(v/10)*10);
  const lowIdx=data.reduce((m,v,i)=>v.low<data[m].low?i:m,0);
  const highIdx=data.reduce((m,v,i)=>v.high>data[m].high?i:m,0);
  return `
  <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="デモ相場のローソク足チャート">
    <rect x="0" y="0" width="${w}" height="${h}" fill="#02091f"/>
    ${labelsY.map(v=>`<g><line x1="${pad.l}" x2="${pad.l+plotW}" y1="${y(v)}" y2="${y(v)}" stroke="#263759" stroke-width="1"/><text x="${w-8}" y="${y(v)+5}" text-anchor="end" fill="#eef3ff" font-size="14">${fmt0(v)}</text></g>`).join('')}
    ${[0,15,30,45].map(i=>`<g><line x1="${pad.l+step*i+step/2}" x2="${pad.l+step*i+step/2}" y1="${pad.t}" y2="${pad.t+plotH}" stroke="#263759" stroke-width="1"/><text x="${pad.l+step*i+step/2}" y="${h-8}" text-anchor="middle" fill="#eef3ff" font-size="14">${data[i].date}</text></g>`).join('')}
    <path d="${maPath(ma5)}" fill="none" stroke="#f0db33" stroke-width="2.5"/>
    <path d="${maPath(ma10)}" fill="none" stroke="#ff7a32" stroke-width="2.5"/>
    <path d="${maPath(ma25)}" fill="none" stroke="#59d3ff" stroke-width="2.5"/>
    ${data.map((c,i)=>{
      const x=pad.l+step*i+step/2;const color=c.close>=c.open?'#15d13f':'#ff5b52';
      const yOpen=y(c.open), yClose=y(c.close), yHigh=y(c.high), yLow=y(c.low);
      const top=Math.min(yOpen,yClose), bottom=Math.max(yOpen,yClose), height=Math.max(3,bottom-top);
      return `<g><line x1="${x}" x2="${x}" y1="${yHigh}" y2="${yLow}" stroke="${color}" stroke-width="2"/><rect x="${x-body/2}" y="${top}" width="${body}" height="${height}" fill="${color}" rx="1.5"/></g>`;
    }).join('')}
    <line x1="${pad.l}" x2="${pad.l+plotW}" y1="${y(data.at(-1).close)}" y2="${y(data.at(-1).close)}" stroke="#d7bb22" stroke-width="2" stroke-dasharray="10 8"/>
    <rect x="${w-85}" y="${y(data.at(-1).close)-14}" width="78" height="28" rx="8" fill="#d3a800"/>
    <text x="${w-46}" y="${y(data.at(-1).close)+6}" text-anchor="middle" fill="#111" font-size="18" font-weight="700">${fmt(data.at(-1).close)}</text>
    <text x="${pad.l+step*highIdx+10}" y="${y(data[highIdx].high)-10}" fill="#fff" font-size="16">${fmt(data[highIdx].high)}</text>
    <text x="${pad.l+step*lowIdx+10}" y="${y(data[lowIdx].low)-8}" fill="#fff" font-size="16">${fmt(data[lowIdx].low)}</text>
  </svg>`;
}

    : (()=>{const x=INDEXES.find(v=>v.id===detail.id);return {name:x.name,value:x.value,change:x.change,pct:x.pct,time:'サンプル',data:genCandles(x.value,x.id)}})();
  const c=item.data.at(-1), ma5=movingAverage(item.data,5).at(-1), ma10=movingAverage(item.data,10).at(-1), ma25=movingAverage(item.data,25).at(-1);
  return `<div class="modal" id="modal"><div class="sheet"><div class="sheet-header"><h2 class="sheet-title">${item.name}</h2><button class="icon-btn" data-close="1">◌</button></div><div class="chart-toolbar"><select class="dropdown"><option>日足</option></select><button class="toolbar-chip">価格帯別出来高</button><div style="margin-left:auto;display:flex;gap:10px"><button class="toolbar-chip">▦</button><button class="toolbar-chip">✎</button></div></div><div class="chart-stats"><div class="stat">高値 <strong>${fmt(c.high)}</strong><br>安値 <strong>${fmt(c.low)}</strong></div><div class="stat">始値 <strong>${fmt(c.open)}</strong><br>終値 <strong>${fmt(c.close)}</strong></div><div class="stat">出来高 <strong>${fmt0(c.vol)}</strong><br>日時 <strong>${item.time}</strong></div></div><div class="chart-legend"><span class="legend-short">短期:${fmt(ma5)}</span><span class="legend-mid">中期:${fmt(ma10)}</span><span class="legend-long">長期:${fmt(ma25)}</span></div><div class="chart-note">表示価格・日足・移動平均線はデモ用の疑似データ</div><div class="candle-wrap"><div class="chart-panel">${svgCandles(item.data)}</div></div>${detail.kind==='stock' ? `<div class="depth-section"><div class="depth-head"><strong>板情報</strong><small>参考気配・疑似注文</small></div><div class="depth-label"><span>売数量</span><span>気配（KC）</span><span>買数量</span></div>${Array.from({length:7},(_,i)=>{const level=3-i;const price=Math.max(1,Math.round(item.value+level));const ask=level>0;const bid=level<0;const aVol=(31+i*13)%79+8,bVol=(43+i*17)%83+9;return `<div class="depth-row"><span class="ask">${ask?fmt0(aVol*10):''}</span><strong>${fmt0(price)}</strong><span class="bid">${bid?fmt0(bVol*10):''}</span></div>`}).join('')}</div><div class="action-row"><button class="action-btn primary" data-order-symbol="${detail.id}">この銘柄を注文</button></div>`:''}<div class="close-row"><button class="close-btn" data-close="1">閉じる</button></div></div></div>`;
}

function render(){
  advanceMarket(state); save();
  const html = screen==='market'?screenMarket():screen==='casino'?screenCasino():screen==='shop'?screenShop():screenAssets();
  app.innerHTML = html + detailSheet();
}

function doTrade(){
  const symbol=$('#trade-symbol')?.value || activeSymbol; const qty=Number($('#trade-qty')?.value||1);
  activeSymbol=symbol; trade(state,symbol,tradeSide,qty); save(); render(); toast(`${MARKET.find(v=>v.id===symbol).name}を${tradeSide==='buy'?'買付':'売却'}した`);
}
function doSpin(){
  if(spinLock) return;
  const amount=Number($('#bet-amount')?.value);
  const choice=betType==='number'?Number($('#bet-number')?.value):0;
  if(!Number.isSafeInteger(amount) || amount<100 || amount>20000 || amount>state.cash) throw new Error('賭け額は100〜20,000 KC（所持金以内）');
  if(betType==='number' && (!Number.isInteger(choice)||choice<0||choice>36)) throw new Error('数字は0〜36で指定');
  const lockedType=betType;
  const outcome=cryptoRouletteNumber(); spinLock=true;
  const wheel=$('#wheel');
  const button=$('[data-action="spin"]'); if(button) button.disabled=true;
  rotation += 1440 + Math.floor(Math.random()*360);
  if(wheel) {wheel.style.transition='transform 1.8s cubic-bezier(.15,.82,.14,1)';wheel.style.transform=`rotate(${rotation}deg)`;}
  setTimeout(()=>{try{
      const r=spin(state,lockedType,amount,choice,outcome);
      spinLock=false; save(); render(); toast(r.payout>0?`的中 ${moneyCompact(r.payout)}`:`出目 ${r.outcome}`);
    }catch(err){spinLock=false;render();toast(err.message)}
  },1800);
}

addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open]'); if(!t) return;
  try{
    if(t.dataset.screen){if(spinLock){toast('抽選中は画面を切り替えられません');return;}detail=null;screen=t.dataset.screen;render();return;}
    if(t.dataset.marketTab){marketTab=t.dataset.marketTab;render();return;}
    if(t.dataset.marketMode){marketMode=t.dataset.marketMode;render();return;}
    if(t.dataset.open){openDetail(t.dataset.kind,t.dataset.open);return;}
    if(t.dataset.orderSymbol){activeSymbol=t.dataset.orderSymbol;detail=null;screen='assets';render();return;}
    if(t.dataset.close){closeDetail();return;}
    if(t.dataset.tradeSide){tradeSide=t.dataset.tradeSide;render();return;}
    if(t.dataset.bet){betType=t.dataset.bet;render();return;}
    if(t.dataset.action==='salary'){grantDemoSalary(state);save();render();toast('デモ給与 +600 KC');return;}
    if(t.dataset.action==='trade'){doTrade();return;}
    if(t.dataset.action==='spin'){doSpin();return;}
    if(t.dataset.action==='reset'){if(confirm('データを初期化しますか？')){localStorage.removeItem(KEY);state=createInitialState();render();toast('初期化した')}return;}
    if(t.dataset.buy){const item=buyReward(state,t.dataset.buy);save();render();toast(`${item.name}を交換した`);return;}
  }catch(err){toast(err.message||'操作に失敗した');}
});

addEventListener('change',e=>{if(e.target.id==='trade-symbol'){activeSymbol=e.target.value; render();}})
setInterval(()=>{if(!spinLock && advanceMarket(state)){save();if(!detail)render();}},15000);
render();</script>
</body>
</html>
