name: P12 duel deployment health (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/duel-deployment-watch.yml'
      - 'scripts/duel-deployment-watch.mjs'
      - 'services/valorant-results/test/duel-deployment-watch.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-deployment-watch.yml'
      - 'scripts/duel-deployment-watch.mjs'
      - 'services/valorant-results/test/duel-deployment-watch.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: duel-deployment-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate no-write monitor decisions
        run: node --test services/valorant-results/test/duel-deployment-watch.test.mjs
      - name: Check recent production deployment statuses without D1 calls
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-deployment-watch.mjs
