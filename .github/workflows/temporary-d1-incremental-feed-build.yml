name: Temporary build versioned Activity for D1 incremental feed
on:
  push:
    branches: [perf/d1-incremental-feed-20261031]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/d1-incremental-feed-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Build cache-safe Activity and verify
        run: |
          npm run build:activity
          npm run check:activity
          npm test
      - name: Commit versioned browser imports
        run: |
          if git diff --quiet -- js css index.html; then
            echo "Versioned assets already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: publish cache-safe D1 incremental feed browser version"
          git push origin HEAD:refs/heads/perf/d1-incremental-feed-20261031
