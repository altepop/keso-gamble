name: One-time relic UI cache rebuild
on:
  push:
    branches:
      - feat/relic-catalog-filters-rebased-20261104
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relic-catalog-filters-rebased-20261104
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:activity
      - name: Commit generated browser cache references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js css index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): refresh content-derived browser cache version"
            git push origin HEAD:refs/heads/feat/relic-catalog-filters-rebased-20261104
          fi
