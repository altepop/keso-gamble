name: Temporary relic Activity cache sync
on:
  push:
    branches:
      - feat/relic-catalog-filters-rebased-20261104
    paths:
      - '.github/workflows/relic-cache-sync-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relic-catalog-filters-rebased-20261104
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate content-derived Activity release
        run: npm run build:activity
      - name: Commit only versioned browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore(activity): sync content-derived browser cache version"
            git push origin HEAD:feat/relic-catalog-filters-rebased-20261104
          fi
