name: Regenerate Activity dependency versions (duel final)
on:
  push:
    branches:
      - feat/duel-pvp-skill-loot-20261118
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-activity.mjs
      - run: |
          git add js css index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(activity): update duel UI asset version"
          git push origin HEAD:feat/duel-pvp-skill-loot-20261118
