name: One-time directive refund audit
on:
  push:
    branches: [feat/directive-refund-transfer-20261125]
    paths:
      - '.github/workflows/directive-refund-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'altepop/keso-gamble' && github.event.head_commit.message == 'chore: run one-time directive refund audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/directive-refund-audit-once.test.mjs
      - name: Inspect directives and refund receipts once (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/directive-refund-audit-once.mjs
