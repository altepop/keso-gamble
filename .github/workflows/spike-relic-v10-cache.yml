name: Spike relic V10 one-time Activity version refresh
on:
  push:
    branches:
      - fix/spike-relic-credit-early-game-boost
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/spike-relic-v10-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Refresh versioned CSS and JS in Discord embedded browser
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): refresh Spike V10 boosted relic dashboard"
            git push origin HEAD:fix/spike-relic-credit-early-game-boost
          fi
