name: VDK bankruptcy shareholder announcement (one time)
on:
  push:
    branches: [ops/vdk-bankruptcy-everyone-20261121]
    paths:
      - '.github/workflows/vdk-bankruptcy-discord-notice.yml'
permissions:
  contents: read
concurrency:
  group: vdk-bankruptcy-everyone-20261121
  cancel-in-progress: false
jobs:
  announce:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Announce only if terminal production quote is verified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/announcements/announce-vdk-bankruptcy-20261121.mjs
