name: Temporary verify Discord companion links
on:
  push:
    branches:
      - fix/discord-companion-external-links-20261030
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discord-companion-external-links-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate cache and test link handling
        run: |
          npm ci
          npm run build:activity
          npm run check:activity
          npm test
      - name: Save browser release metadata
        run: |
          if git diff --quiet -- js css index.html; then
            echo "Version already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: sync browser module versions for companion links"
          git push origin HEAD:refs/heads/fix/discord-companion-external-links-20261030
