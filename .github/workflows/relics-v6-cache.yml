name: Relics V6 one-time browser cache regeneration
on:
  push:
    branches:
      - feat/relics-v6-unlimited-risk-reveal
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/relics-v6-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Write new release hashes for imported JS and CSS
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): refresh stable V6 browser release"
            git push origin HEAD:feat/relics-v6-unlimited-risk-reveal
          fi
