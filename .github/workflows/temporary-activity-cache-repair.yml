name: Temporary Activity cache repair
on:
  push:
    branches:
      - fix/horse-names-activity-cache-20261030
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horse-names-activity-cache-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild and validate cache versions
        run: |
          npm ci
          npm run build:activity
          npm run check:activity
      - name: Commit browser version synchronization
        run: |
          if git diff --quiet -- js css index.html; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: synchronize browser cache versions after horse names"
          git push origin HEAD:refs/heads/fix/horse-names-activity-cache-20261030
