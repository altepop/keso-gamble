name: P12 duel critical manual operations evidence
on:
  pull_request:
    paths:
      - '.github/workflows/duel-manual-operations-audit.yml'
      - 'scripts/duel-manual-operations-audit.mjs'
      - 'services/valorant-results/test/duel-manual-operations-audit.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-manual-operations-audit.yml'
      - 'scripts/duel-manual-operations-audit.mjs'
      - 'services/valorant-results/test/duel-manual-operations-audit.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '41 22 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: duel-manual-operations-audit
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify sanitization and bounded GitHub Actions metadata queries
        run: node --test services/valorant-results/test/duel-manual-operations-audit.test.mjs
      - name: Read only critical manually dispatched Actions metadata
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_MANUAL_AUDIT_FILE: ${{ runner.temp }}/duel-manual-actions.json
        run: node scripts/duel-manual-operations-audit.mjs
      - name: Preserve sanitized actor/SHA evidence for 30 days
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        uses: actions/upload-artifact@v7
        with:
          name: duel-critical-manual-actions-${{ github.run_id }}
          path: ${{ runner.temp }}/duel-manual-actions.json
          if-no-files-found: error
          retention-days: 30
