name: Relics V4 one-shot Activity cache refresh
on:
  push:
    branches:
      - feat/relics-v4-complete-overhaul
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/relics-v4-cache.yml'
permissions:
  contents: write
jobs:
  rebuild-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Commit fresh Activity release hash to this PR only
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): regenerate stable V4 cache signatures"
            git push origin HEAD:feat/relics-v4-complete-overhaul
          fi
