# One-shot feature-branch-only cache regeneration and unit safety check.
name: Connect Four premium cache synchronization
on:
  push:
    branches:
      - feat/connect4-premium-drop-win-20261119
    paths:
      - .github/workflows/connect4-premium-hash-sync.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify connect4 animation pure tests before generating imports
        run: node --test tests/duel-connect4-motion.test.js
      - name: Regenerate and verify Activity imports
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit content-addressed imports only
        run: |
          git add js index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): sync connect4 premium view imports'
          git push origin HEAD:refs/heads/feat/connect4-premium-drop-win-20261119
