name: CPU practice temporary Activity cache sync
on:
  push:
    branches:
      - feat/duel-cpu-practice-20261107
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:activity && npm run check:activity
      - name: Commit generated cache references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add js css index.html
            git commit -m 'build: sync CPU practice Activity cache references'
            git pull --rebase origin feat/duel-cpu-practice-20261107
            git push origin HEAD:feat/duel-cpu-practice-20261107
          fi
