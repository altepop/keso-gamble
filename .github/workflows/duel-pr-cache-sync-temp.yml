# Temporary, narrowly scoped cache rebuild; removed before the PR is ready.
name: Duel PR cache sync
on:
  push:
    branches:
      - feat/duel-ux-reliability-d1-safe-20261107
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate content-derived module cache and entrypoint versions
        run: npm run build:activity
      - name: Commit only generated cache reference changes
        run: |
          if ! git diff --quiet -- js css index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- js css index.html
            git commit -m "Synchronize content-derived Activity cache identifiers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
