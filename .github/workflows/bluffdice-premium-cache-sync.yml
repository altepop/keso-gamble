# One-shot branch-only test and cache synchronization, removed after success.
name: Bluff Dice premium cache sync
on:
  push:
    branches: [feat/bluffdice-premium-reveal-20261119]
    paths: [.github/workflows/bluffdice-premium-cache-sync.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test private-hand safety, probability and trusted round reveal
        run: node --test tests/duel-bluff-quality.test.js
      - name: Build and verify activity content-addressed import URLs
        run: |
          npm run build:activity
          npm run check:activity
      - name: Update only generated browser import revisions
        run: |
          git add js index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): update Bluff Dice visual import hashes'
          git push origin HEAD:refs/heads/feat/bluffdice-premium-reveal-20261119
