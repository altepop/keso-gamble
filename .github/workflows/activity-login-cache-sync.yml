# Temporary isolated cache generation. Removed from the branch after running.
name: Activity login recovery cache synchronization
on:
  push:
    branches:
      - fix/activity-login-sdk-recovery-20261118
    paths:
      - .github/workflows/activity-login-cache-sync.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate and verify content-addressed Activity versions
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit generated cache versions to the isolated feature branch
        run: |
          git add js index.html
          if git diff --cached --quiet; then
            echo "Activity versions already consistent"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): sync login recovery versioned imports'
          git push origin HEAD:refs/heads/fix/activity-login-sdk-recovery-20261118
