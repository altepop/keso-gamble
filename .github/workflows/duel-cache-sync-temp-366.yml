name: Duel PR 366 temporary activity cache sync
on:
  push:
    branches:
      - feat/duel-recovery-audit-finish-20261107
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate content-derived cache versions
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit generated browser version references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add js css index.html
            git commit -m "build: sync duel reliability activity cache versions"
            git push
          fi
