name: P12 duel deployment monitor heartbeat
on:
  pull_request:
    paths:
      - '.github/workflows/duel-monitor-heartbeat.yml'
      - 'scripts/duel-monitor-heartbeat.mjs'
      - 'scripts/duel-monitor-heartbeat-alert.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat-alert.test.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat.test.mjs'
      - 'scripts/duel-d1-schedule-watch.mjs'
      - 'services/valorant-results/test/duel-d1-schedule-watch.test.mjs'
      - 'scripts/duel-fallback-job-watch.mjs'
      - 'services/valorant-results/test/duel-fallback-job-watch.test.mjs'
      - 'scripts/duel-operations-cron-watch.mjs'
      - 'services/valorant-results/test/duel-operations-cron-watch.test.mjs'
      - 'scripts/duel-admin-evidence-cron-watch.mjs'
      - 'services/valorant-results/test/duel-admin-evidence-cron-watch.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-monitor-heartbeat.yml'
      - 'scripts/duel-monitor-heartbeat.mjs'
      - 'scripts/duel-monitor-heartbeat-alert.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat-alert.test.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat.test.mjs'
      - 'scripts/duel-d1-schedule-watch.mjs'
      - 'services/valorant-results/test/duel-d1-schedule-watch.test.mjs'
      - 'scripts/duel-fallback-job-watch.mjs'
      - 'services/valorant-results/test/duel-fallback-job-watch.test.mjs'
      - 'scripts/duel-operations-cron-watch.mjs'
      - 'services/valorant-results/test/duel-operations-cron-watch.test.mjs'
      - 'scripts/duel-admin-evidence-cron-watch.mjs'
      - 'services/valorant-results/test/duel-admin-evidence-cron-watch.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '27 */3 * * *'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: duel-monitor-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate heartbeat states without production access
        run: node --test services/valorant-results/test/duel-monitor-heartbeat.test.mjs services/valorant-results/test/duel-monitor-heartbeat-alert.test.mjs services/valorant-results/test/duel-d1-schedule-watch.test.mjs services/valorant-results/test/duel-fallback-job-watch.test.mjs services/valorant-results/test/duel-operations-cron-watch.test.mjs services/valorant-results/test/duel-admin-evidence-cron-watch.test.mjs
      - name: Verify hourly monitor scheduled-run heartbeat
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_HEARTBEAT_REPORT: ${{ runner.temp }}/duel-heartbeat-report.json
        run: node scripts/duel-monitor-heartbeat.mjs
      - name: Open at most one GitHub Issue for confirmed heartbeat outage
        if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_HEARTBEAT_REPORT: ${{ runner.temp }}/duel-heartbeat-report.json
        run: node scripts/duel-monitor-heartbeat-alert.mjs
      - name: Detect D1 scheduled audit gaps and notify in a separate GitHub Issue
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-d1-schedule-watch.mjs
      - name: Verify scheduled D1 deployment fallback job independently
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-fallback-job-watch.mjs
      - name: Independently detect missing scheduled operations audit
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-operations-cron-watch.mjs
      - name: Independently detect missing administrator evidence schedule
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-admin-evidence-cron-watch.mjs
