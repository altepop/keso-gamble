name: P12 duel deployment monitor heartbeat
on:
  pull_request:
    paths:
      - '.github/workflows/duel-monitor-heartbeat.yml'
      - 'scripts/duel-monitor-heartbeat.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-monitor-heartbeat.yml'
      - 'scripts/duel-monitor-heartbeat.mjs'
      - 'services/valorant-results/test/duel-monitor-heartbeat.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '27 */3 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: duel-monitor-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate heartbeat states without production access
        run: node --test services/valorant-results/test/duel-monitor-heartbeat.test.mjs
      - name: Verify hourly monitor scheduled-run heartbeat
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/duel-monitor-heartbeat.mjs
