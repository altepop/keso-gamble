name: KESO COACH member collection audit (read-only)
on:
  pull_request:
    paths: ['scripts/coach-member-collection-audit*', '.github/workflows/coach-member-collection-audit.yml']
  push:
    branches: [main]
    paths: ['scripts/coach-member-collection-audit*', '.github/workflows/coach-member-collection-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: node --test scripts/coach-member-collection-audit.test.mjs
      - run: node --experimental-strip-types --test scripts/coach-kobe-production-audit.test.mjs
  audit:
    needs: test
    if: github.repository == 'altepop/keso-gamble' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Inspect consent, discovery progress and Cron health (no writes, no Henrik requests)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-member-collection-audit.mjs
      - name: Kobe two-account read-only verified match and MMR evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/coach-kobe-production-audit.mjs
