name: One-time Activity cache refresh for duel owner preview
on:
  push:
    branches:
      - feat/duel-owner-hitblow-peek-20261115
    paths:
      - .github/workflows/duel-peek-cache-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh content-derived Activity cache versions
        run: node scripts/build-activity.mjs
      - name: Commit generated assets on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: rebuild Activity cache versions [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
