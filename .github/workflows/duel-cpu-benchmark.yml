name: Duel CPU six-mode comparative benchmark
on:
  push:
    branches:
      - test/duel-cpu-six-mode-benchmark-20261107
    paths:
      - 'scripts/duel-cpu-benchmark.mjs'
      - '.github/workflows/duel-cpu-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duel-cpu-benchmark:
    name: Benchmark ${{ matrix.game }} strong vs normal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - game: othello
            pairs: 35
          - game: gomoku
            pairs: 80
          - game: connect4
            pairs: 60
          - game: hitblow
            pairs: 600
          - game: bluffdice
            pairs: 1500
          - game: poker
            pairs: 1200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run paired first/second side matches with production CPU and rules
        run: node scripts/duel-cpu-benchmark.mjs ${{ matrix.game }} ${{ matrix.pairs }} | tee cpu-benchmark-${{ matrix.game }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-cpu-${{ matrix.game }}-results
          path: cpu-benchmark-${{ matrix.game }}.log
          if-no-files-found: warn
          retention-days: 21
