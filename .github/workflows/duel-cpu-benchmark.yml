name: Duel CPU six-mode comparative benchmark
on:
  push:
    branches: [feat/duel-cpu-rigorous-endgame-20261107]
    paths:
      - 'duel-preview/cpu-*.js'
      - 'scripts/duel-cpu-hitblow-ab.mjs'
      - '.github/workflows/duel-cpu-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duel-cpu-benchmark:
    name: Benchmark ${{ matrix.game }} strong vs normal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - game: hitblow
            pairs: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run paired first/second side matches with production CPU and rules
        run: |
          set -euo pipefail
          node scripts/duel-cpu-benchmark.mjs ${{ matrix.game }} ${{ matrix.pairs }} | tee cpu-benchmark-${{ matrix.game }}.log
          grep -q '^BENCH_RESULT ' cpu-benchmark-${{ matrix.game }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-cpu-${{ matrix.game }}-results
          path: cpu-benchmark-${{ matrix.game }}.log
          if-no-files-found: warn
          retention-days: 21
  hitblow-paired-ab:
    name: Paired old/new Hit and Blow reasoning benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve untouched original production policy
        run: |
          git fetch --depth=1 origin main
          git show origin/main:duel-preview/cpu-hidden-games.js > duel-preview/cpu-hidden-games-prior.js
      - name: Compare solving turns for identical hidden codes
        run: |
          set -euo pipefail
          node scripts/duel-cpu-hitblow-ab.mjs 750 | tee cpu-hitblow-ab-results.log
          grep -q '^HITBLOW_AB_RESULT ' cpu-hitblow-ab-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-cpu-hitblow-paired-results
          path: cpu-hitblow-ab-results.log
          if-no-files-found: warn
          retention-days: 14
