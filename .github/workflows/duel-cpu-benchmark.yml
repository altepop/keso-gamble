name: Duel CPU six-mode comparative benchmark
on:
  push:
    branches: [feat/duel-cpu-rigorous-endgame-20261107]
    paths:
      - 'duel-preview/cpu-*.js'
      - 'scripts/duel-cpu-gomoku-ab.mjs'
      - '.github/workflows/duel-cpu-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duel-cpu-benchmark:
    name: Benchmark ${{ matrix.game }} strong vs normal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - game: gomoku
            pairs: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run paired first/second side matches with production CPU and rules
        run: |
          set -euo pipefail
          node scripts/duel-cpu-benchmark.mjs ${{ matrix.game }} ${{ matrix.pairs }} | tee cpu-benchmark-${{ matrix.game }}.log
          grep -q '^BENCH_RESULT ' cpu-benchmark-${{ matrix.game }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-cpu-${{ matrix.game }}-results
          path: cpu-benchmark-${{ matrix.game }}.log
          if-no-files-found: warn
          retention-days: 21
  gomoku-paired-ab:
    name: Paired old/new Gomoku tactical benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve untouched prior Gomoku strategy
        run: |
          git fetch --depth=1 origin main
          git show origin/main:duel-preview/cpu-board-search.js > duel-preview/cpu-board-search-prior.js
      - name: Compare old/new on identical seeded game openings
        run: |
          set -euo pipefail
          node scripts/duel-cpu-gomoku-ab.mjs 90 | tee cpu-gomoku-ab-results.log
          grep -q '^GOMOKU_AB_RESULT ' cpu-gomoku-ab-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-cpu-gomoku-paired-results
          path: cpu-gomoku-ab-results.log
          if-no-files-found: warn
          retention-days: 14
