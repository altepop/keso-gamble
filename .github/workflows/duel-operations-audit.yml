name: P12 duel scheduled operations audit (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/duel-operations-audit.yml'
      - 'scripts/duel-scheduled-operations-audit.mjs'
      - 'services/valorant-results/test/duel-scheduled-operations-audit.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-operations-audit.yml'
      - 'scripts/duel-scheduled-operations-audit.mjs'
      - 'services/valorant-results/test/duel-scheduled-operations-audit.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '31 21 * * *'
permissions:
  contents: read
concurrency:
  group: duel-operations-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify fixed queries, boundaries and fail-closed behavior
        run: node --test services/valorant-results/test/duel-scheduled-operations-audit.test.mjs
      - name: Read aggregate counts from production duel D1 (no writes)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/duel-scheduled-operations-audit.mjs
