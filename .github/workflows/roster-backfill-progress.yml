name: VDK roster restoration progress (read-only)
on:
  push:
    branches: [audit/kobayashi-live-20261116]
    paths: ['.github/workflows/roster-backfill-progress.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Count verified rosters, Abema appearances and unavailable match details
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/d1/database/bf23ab40-814f-4626-9e0b-36739ac41750/query';
          async function q(sql,params=[]){
           if(!/^(SELECT|WITH)\s/i.test(sql.trim()))throw Error('Read-only only');
           const response=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(20000)});
           if(!response.ok)throw Error('D1 HTTP '+response.status);
           const data=await response.json();if(!data.success||!data.result?.[0]?.success)throw Error('D1 read failed');
           return data.result[0].results;
          }
          const n=async(s,p=[])=>Number((await q(s,p))[0]?.n??0);
          const [scope,saved,abema,known,unavailable,deferred,flag,last]=await Promise.all([
           n("SELECT COUNT(DISTINCT match_id) AS n FROM notifications WHERE riot_id='Dolly#SDGs' AND mode='competitive'"),
           n('SELECT COUNT(*) AS n FROM valorant_match_rosters'),
           n("SELECT COUNT(DISTINCT r.match_id) AS n FROM valorant_match_rosters r,json_each(r.players_json) p WHERE lower(json_extract(p.value,'$.name'))='abema' AND lower(json_extract(p.value,'$.tag'))='ttv'"),
           n("SELECT COUNT(*) AS n FROM valorant_match_rosters WHERE match_id='88e69e18-6b40-4572-84fb-4f09fe4f463b'"),
           n("SELECT COUNT(*) AS n FROM monitor_state WHERE key LIKE 'roster_backfill:unavailable:%'"),
           n("SELECT COUNT(*) AS n FROM monitor_state WHERE key LIKE 'roster_backfill:defer:%' AND CAST(value AS INTEGER)>?",[Date.now()]),
           q("SELECT value FROM monitor_state WHERE key='roster_backfill:enabled'"),
           q("SELECT value FROM monitor_state WHERE key='roster_backfill:last_saved'")
          ]);
          const workerState=await q("SELECT key,substr(value,1,100) AS value FROM monitor_state WHERE key IN ('monitor_started','monitor_finished','api_after','roster_backfill:enabled','roster_backfill:last_saved') OR key LIKE 'roster_backfill:defer:%' OR key LIKE 'roster_backfill:unavailable:%' ORDER BY key LIMIT 80");
          const savedCase=await q("SELECT players_json FROM valorant_match_rosters WHERE match_id='88e69e18-6b40-4572-84fb-4f09fe4f463b'");
          if(savedCase.length){
            const players=JSON.parse(savedCase[0].players_json);
            const wanted=['dolly#sdgs','abema#ttv','h1d3g1g4s#1037'];
            const known=players.filter(p=>wanted.includes((p.name+'#'+p.tag).toLowerCase()));
            console.log('FIRST_ARCHIVED_KNOWN_TEAM '+JSON.stringify({
              matched:known.map(p=>({riotId:p.name+'#'+p.tag,agent:p.agent,k:p.k,d:p.d,a:p.a})),
              allThreeFound:known.length===3,
              allThreeSameTeam:known.length===3&&known.every(p=>p.team_id===known[0].team_id),
              allThreeSameParty:known.length===3&&known[0].party_id!==null&&known.every(p=>p.party_id===known[0].party_id),
              caution:'Party IDs absent/null do not prove not queued together'
            }));
          }
          const joined=await q("SELECT n.match_id,n.ended_at,n.outcome,r.map,r.players_json FROM notifications n JOIN valorant_match_rosters r ON r.match_id=n.match_id WHERE n.riot_id='Dolly#SDGs' AND n.mode='competitive' ORDER BY n.ended_at DESC LIMIT 100");
          const first=joined.find(x=>x.match_id==='88e69e18-6b40-4572-84fb-4f09fe4f463b');
          const normalize=(p)=>String(p?.name??'').toLowerCase()+'#'+String(p?.tag??'').toLowerCase();
          const abemaIdentity=first?JSON.parse(first.players_json).find(p=>normalize(p)==='abema#ttv')?.puuid:null;
          const report=joined.map(row=>{
            const players=JSON.parse(row.players_json);
            const vdk=players.find(p=>normalize(p)==='dolly#sdgs');
            const abema=players.find(p=>normalize(p)==='abema#ttv'||(abemaIdentity&&p.puuid===abemaIdentity));
            const ishihara=players.find(p=>normalize(p)==='h1d3g1g4s#1037');
            const sameTeam=(p)=>Boolean(vdk&&p&&vdk.team_id===p.team_id);
            const sameParty=(p)=>Boolean(sameTeam(p)&&vdk.party_id&&p.party_id===vdk.party_id);
            return {matchId:row.match_id,date:new Date(Number(row.ended_at)+9*3600_000).toISOString().slice(0,10),map:row.map,
              outcome:row.outcome,abemaPresent:Boolean(abema),abemaSameTeam:sameTeam(abema),
              abemaSameParty:sameParty(abema),ishiharaPresent:Boolean(ishihara),
              ishiharaSameTeam:sameTeam(ishihara),ishiharaSameParty:sameParty(ishihara),
              threeSameTeam:sameTeam(abema)&&sameTeam(ishihara),
              threeSameParty:sameParty(abema)&&sameParty(ishihara),
              partyMembers:vdk?.party_id?players.filter(p=>p.party_id===vdk.party_id).length:0};
          });
          const count=(field)=>report.filter(x=>x[field]).length;
          console.log('VDK_THREE_PLAYER_REPORT '+JSON.stringify({
            restoredMatched:report.length,abemaPresent:count('abemaPresent'),
            abemaSameTeam:count('abemaSameTeam'),abemaSameParty:count('abemaSameParty'),
            ishiharaSameTeam:count('ishiharaSameTeam'),ishiharaSameParty:count('ishiharaSameParty'),
            threeSameTeam:count('threeSameTeam'),threeSameParty:count('threeSameParty'),
            analyzed:report.map(({matchId,date,map,outcome,abemaPresent,abemaSameTeam,abemaSameParty,ishiharaSameTeam,threeSameParty,partyMembers})=>({
              matchId,date,map,outcome,abemaPresent,abemaSameTeam,abemaSameParty,ishiharaSameTeam,threeSameParty,partyMembers
            })),
            identityEvidence:abemaIdentity?'Known Corrode PUUID + Riot ID/name':'Match-by-match name/tag only',
            note:'Numbers cover restored competitive match roster rows only. Unrestored matches remain unknown.'
          }));
          console.log('VDK_BACKFILL_WORKER_STATE '+JSON.stringify(workerState));
          console.log('VDK_BACKFILL_PROGRESS '+JSON.stringify({eligible:scope,archived:saved,
            abemaKnownRiotIdMatches:abema,sharedCorrodeExampleArchived:known===1,
            unavailable,temporarilyDeferred:deferred,enabledStatus:flag[0]?.value??'absent',
            hasSavedMatch:Boolean(last.length),caution:'Matching historical name/tag is not the same as globally stable PUUID; missing match is unknown'}));
          NODE

# Recheck after first scheduled archival window.

# Verify currently recovered historical match rosters before one-off acceleration.

# Mid-run audit of accelerated historical restoration.

# Later mid-run audit of all historical VDK match recovery.
