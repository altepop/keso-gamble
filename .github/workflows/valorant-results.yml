name: VALORANT Bot check and deploy
on:
  pull_request:
    paths:
      - 'services/valorant-results/**'
      - '.github/workflows/valorant-results.yml'
      - 'index.html'
      - 'coach.html'
      - 'coach/**'
      - 'js/**'
      - 'css/**'
      - 'assets/escalation-ranks/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/d1-daily-guard.mjs'
      - 'scripts/d1-daily-guard.test.mjs'
      - 'scripts/d1-read-audit.mjs'
      - 'scripts/d1-read-hotspots.mjs'
      - 'scripts/d1-read-hotspots.test.mjs'
      - 'scripts/build-discord-sdk.mjs'
      - 'scripts/build-activity.mjs'
      - 'scripts/*browser-check.cjs'
      - 'scripts/race-video/**'
      - '.github/workflows/race-video.yml'
  push:
    branches: [main]
    paths:
      - 'services/valorant-results/**'
      - '.github/workflows/valorant-results.yml'
      - 'index.html'
      - 'coach.html'
      - 'coach/**'
      - 'js/**'
      - 'css/**'
      - 'assets/escalation-ranks/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/d1-daily-guard.mjs'
      - 'scripts/d1-daily-guard.test.mjs'
      - 'scripts/d1-read-audit.mjs'
      - 'scripts/d1-read-hotspots.mjs'
      - 'scripts/d1-read-hotspots.test.mjs'
      - 'scripts/build-discord-sdk.mjs'
      - 'scripts/build-activity.mjs'
      - 'scripts/*browser-check.cjs'
      - 'scripts/race-video/**'
      - '.github/workflows/race-video.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valorant-results-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # Superseded PR checks must not block verification of the latest commit.
  # Production runs remain serialized and are never interrupted here.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    outputs:
      review_changed: ${{ steps.review_paths.outputs.changed }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/valorant-results
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/valorant-results/package-lock.json
      - name: Use the official Ubuntu archive with bounded download waits
        working-directory: .
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-playwright-downloads >/dev/null
      - name: Report proposed sanma release configuration without accessing Mahjong or D1
        env:
          SANMA_CONFIGURATION: ${{ vars.MAHJONG_SANMA_REVIEW_ENABLED == 'true' && 'enabled' || vars.MAHJONG_SANMA_REVIEW_ENABLED == 'false' && 'disabled' || vars.MAHJONG_SANMA_REVIEW_ENABLED == '' && 'enabled-release-default' || 'invalid' }}
        run: |
          printf 'equal_review_configuration: sanma=%s\n' "$SANMA_CONFIGURATION"
      - run: npm ci
      - name: Detect changes to optional mahjong analysis
        id: review_paths
        run: |
          if ! git -C ../.. diff --quiet HEAD^ HEAD -- 'services/valorant-results/src/mahjong-*' 'services/valorant-results/scripts/mahjong-*' 'services/valorant-results/scripts/c3-vendor' 'services/valorant-results/scripts/sanma-*' 'services/valorant-results/test/mahjong-*' 'services/valorant-results/test/fixtures/mahjong-review-*' '.github/workflows/mahjong-paipu.yml' '.github/workflows/valorant-results.yml'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned sanma hand calculator for changed analysis
        if: steps.review_paths.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/valorant-results/scripts/sanma-requirements.txt
      - name: Install isolated sanma calculator
        if: steps.review_paths.outputs.changed == 'true'
        run: |
          python3 -m venv .venv-mahjong
          .venv-mahjong/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r scripts/sanma-requirements.txt
          echo "SANMA_PYTHON=$PWD/.venv-mahjong/bin/python" >> "$GITHUB_ENV"
      - run: npm run check
      - name: Validate optional DAVE music service source and pure queue tests
        run: |
          node --check ../music-voice/server.mjs
          node --check ../music-voice/player.mjs
          node --check ../music-voice/queue.mjs
          node --test ../music-voice/test/*.test.mjs
      - name: Restore existing optional model cache for read-only verification
        if: steps.review_paths.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: services/valorant-results/.cache/c3-model
          key: equal-review-c3-5b30a83de3ab9523
      - name: Check real model in isolated worker with artificial legal replay
        if: steps.review_paths.outputs.changed == 'true'
        timeout-minutes: 3
        env:
          C3_ASSETS_ROOT: ${{ github.workspace }}/services/valorant-results/.cache/c3-model
        run: node scripts/mahjong-review-smoke.mjs
      - name: Check Activity logic
        run: |
          npm --prefix ../.. ci
          npm --prefix ../.. run check:discord
          # GitHub Pages serves the committed files, so a pull request must commit the rebuilt ?v= versions:
          # stale versions let a phone's WebView mix old cached modules with new ones (#138).
          if [ "${{ github.event_name }}" = pull_request ]; then npm --prefix ../.. run check:activity; fi
          # Keep direct GitHub web edits from blocking Worker deployment.
          npm --prefix ../.. run build:activity
          npm --prefix ../.. run check:activity
          npm --prefix ../.. test
      - run: npm run build
      - name: Test deploy smoke protocol (mocked endpoints)
        working-directory: .
        run: node --test scripts/post-deploy-smoke.test.mjs
      - name: Prepare race video verification
        timeout-minutes: 5
        working-directory: .
        run: bash scripts/race-video/prepare.sh
      - name: Render a fixture replay (no Discord delivery)
        working-directory: .
        run: node scripts/race-video/run.mjs --check
  # Activity flows in a real browser against mocked Worker answers (demo, live wallet, racing, Discord login,
  # casino, stocks, Mリーグ/履歴/pulse). No secrets and no network beyond the runner.
  # Keep every existing Chromium/WebKit browser case; run independent halves on
  # separate runners. The 'browser' fan-in below keeps the required CI status stable.
  browser-shards:
    name: Browser (${{ matrix.suite }})
    # Keep Playwright dependencies on a supported LTS image. The newer latest
    # image repeatedly stalled while fetching its changed multimedia packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [core, extended]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh Activity cache versions for browser tests
        run: npm run build:activity
      - name: Use the official Ubuntu archive with bounded download waits
        run: |
          # The runner's regional EC2 archive repeatedly stalls on multimedia
          # dependencies. Keep Ubuntu signature verification and package versions.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-playwright-downloads >/dev/null
      - name: Install Playwright, Chromium and WebKit
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - run: npm run test:browser:${{ matrix.suite }}
        env:
          COACH_V6_SCREENSHOTS_DIR: ${{ runner.temp }}/coach-v6-comparison
          COACH_JAPANESE_AUDIT: ${{ runner.temp }}/coach-v6-comparison/japanese.json
      - name: Keep prototype comparison and Japanese check evidence
        if: always() && matrix.suite == 'extended'
        uses: actions/upload-artifact@v7
        with:
          name: coach-v6-comparison
          path: ${{ runner.temp }}/coach-v6-comparison
          if-no-files-found: error
          retention-days: 7
  # A failed or cancelled shard must fail the original 'browser' status.
  browser:
    needs: browser-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        env:
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARDS_RESULT" = "success"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, browser]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check required deployment Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository Secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository Secret'; exit 1; }
      - name: Prepare private runner copy
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kp-app/services/valorant-results"
          cp -R services/valorant-results/. "$RUNNER_TEMP/kp-app/services/valorant-results/"
          mkdir -p "$RUNNER_TEMP/kp-app/js"
          cp js/*.js "$RUNNER_TEMP/kp-app/js/"
          # Include the trusted P9.4 CPU strategy modules in the isolated Worker bundle.
          mkdir -p "$RUNNER_TEMP/kp-app/duel-preview"
          cp duel-preview/cpu.js duel-preview/cpu-board-search.js duel-preview/cpu-hidden-games.js duel-preview/cpu-poker.js "$RUNNER_TEMP/kp-app/duel-preview/"
          cp coach.html "$RUNNER_TEMP/kp-app/coach.html"
          mkdir -p "$RUNNER_TEMP/kp-app/coach"
          cp coach/*.js "$RUNNER_TEMP/kp-app/coach/"
          mkdir -p "$RUNNER_TEMP/kp-app/services/music-voice"
          cp services/music-voice/catalog.json "$RUNNER_TEMP/kp-app/services/music-voice/"
          cd "$RUNNER_TEMP/kp-app/services/valorant-results"
          npm ci
      - name: Recover existing Worker configuration
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALORANT_RESULTS_WORKER: valorant-results
        run: node scripts/live-settings.mjs
      - name: Prepare encrypted KP configuration key
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-kp-key.mjs
      - name: Retain public encryption key
        uses: actions/upload-artifact@v7
        with:
          name: kp-bootstrap-public-key
          path: ${{ runner.temp }}/kp-app/services/valorant-results/kp-public-key.json
          retention-days: 30
      - name: Configure optional Discord Activity login
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: node scripts/provision-activity-auth.mjs
      - name: Configure optional Mahjong Secrets
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAHJONG_INGEST_KEY: ${{ secrets.MAHJONG_INGEST_KEY }}
          AMAE_KOROMO_TOKEN: ${{ secrets.AMAE_KOROMO_TOKEN }}
          PAIPU_DISPATCH_TOKEN: ${{ secrets.PAIPU_DISPATCH_TOKEN }}
        run: node scripts/provision-mahjong-key.mjs
      - name: Validate live configuration and build
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        run: |
          node scripts/assert-deploy-config.mjs
          npm run typecheck
          npm run build
      - name: Ensure additive match participant table (no legacy migrations)
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-match-rosters.mjs
      - name: Ensure additive coaching round event table (no legacy migrations)
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-round-events.mjs
      - name: Ensure isolated coaching position evidence table
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-positions.mjs
      - name: Ensure bounded position backfill state table
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-position-backfill.mjs
      - name: Ensure additive per-person historical archive tables
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-coach-member-archive.mjs
      - name: Ensure private coaching identity tables and immutable ownership
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-coach-profiles.mjs
      - name: Ensure private coaching goals table
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/ensure-coach-goals.mjs
          node scripts/ensure-coach-sharing.mjs
          node scripts/ensure-coach-team-consents.mjs
          node scripts/ensure-coach-records.mjs
          node scripts/ensure-coach-review.mjs
      - name: Read-only KESO COACH historical archive audit (aggregate counts only)
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-archive-audit.mjs
      - name: Deploy existing Bot (additive KP setup; existing commands retained)
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -- --keep-vars
      - name: Update existing Discord Activity entry point after successful Worker deploy
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ENTRYPOINT_MODE: ${{ vars.DISCORD_ACTIVITY_ENTRYPOINT_MODE || 'apply' }}
        run: |
          case "$ENTRYPOINT_MODE" in
            apply|rollback|status) ;;
            *) echo 'Invalid Activity entry mode'; exit 1 ;;
          esac
          node scripts/activity-entry-handler.mjs "--$ENTRYPOINT_MODE"
      - name: Register KESO COACH under existing /valo without altering other commands
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node --experimental-strip-types scripts/sync-valo-command.mjs
      - name: Verify production Activity, Worker and KP reads
        env:
          KESO_SMOKE_WALLET_TOKEN: ${{ secrets.KESO_SMOKE_WALLET_TOKEN }}
        run: node scripts/post-deploy-smoke.mjs
      - name: Observe fixed Henrik fields from normal requests (no added API calls)
        if: contains(github.event.head_commit.message, '[coach-performance-audit]')
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-provider-tail.mjs
      - name: Audit reported 06:57 match (read-only, no identifiers)
        if: contains(github.event.head_commit.message, '[coach-0657-audit]')
        continue-on-error: true
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-0657-audit.mjs
      - name: Verify private coach identity provisioning and unauthenticated boundaries
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          KESO_SMOKE_WALLET_TOKEN: ${{ secrets.KESO_SMOKE_WALLET_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/coach-profile-audit.mjs
          node scripts/coach-goals-audit.mjs
          node scripts/coach-sharing-audit.mjs
          node scripts/coach-team-consent-audit.mjs
          node scripts/coach-records-audit.mjs
          node scripts/coach-review-audit.mjs
          node scripts/coach-review-cost.mjs
      - name: Audit isolated position storage (aggregate evidence only)
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-position-audit.mjs
      - name: Verify bounded position backfill progress (read-only aggregate counts)
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          WAIT_FOR_POSITION_BACKFILL: ${{ contains(github.event.head_commit.message, '[coach-position-backfill]') && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-position-backfill-audit.mjs
      - name: Observe phase 0 position quality from normal responses (no extra Henrik calls)
        if: contains(github.event.head_commit.message, '[coach-position-audit]')
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/coach-position-tail.mjs
      - name: Read-only per-person coaching performance and D1 cost audit
        if: contains(github.event.head_commit.message, '[coach-performance-audit]') || contains(github.event.head_commit.message, '[coach-feedback-audit]')
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KESO_SMOKE_WALLET_TOKEN: ${{ secrets.KESO_SMOKE_WALLET_TOKEN }}
        run: node scripts/coach-performance-audit.mjs
      - name: Start read-only review delivery verification after changed analysis is deployed
        if: needs.check.outputs.review_changed == 'true'
        continue-on-error: true
        working-directory: services/valorant-results
        env:
          PAIPU_DISPATCH_TOKEN: ${{ secrets.PAIPU_DISPATCH_TOKEN }}
          REVIEW_ANALYSIS_AUDIT: ${{ contains(github.event.head_commit.message, '[mahjong-review-audit]') && 'true' || 'false' }}
          REVIEW_DELIVERY_PROBE: ${{ contains(github.event.head_commit.message, '[mahjong-review-probe]') && 'true' || 'false' }}
          REVIEW_DELIVERY_RESUME: ${{ contains(github.event.head_commit.message, '[mahjong-review-resume]') && 'true' || 'false' }}
        run: node scripts/dispatch-mahjong-delivery-audit.mjs
      - name: Check requested KP duel/luxury roster (read-only, no IDs printed)
        continue-on-error: true
        env:
          KESO_SMOKE_WALLET_TOKEN: ${{ secrets.KESO_SMOKE_WALLET_TOKEN }}
        run: node scripts/kp-target-roster-audit.mjs
      - name: Send optional deploy failure alert to Discord
        if: failure()
        env:
          KESO_SMOKE_ALERT_WEBHOOK_URL: ${{ secrets.KESO_SMOKE_ALERT_WEBHOOK_URL }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/post-deploy-smoke.mjs --notify-failure
      - name: Inspect unclassified queue identifiers (no account or match data)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/kp-app/services/valorant-results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-mode-identifiers.mjs
      - name: Remove private runner copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/kp-app"
