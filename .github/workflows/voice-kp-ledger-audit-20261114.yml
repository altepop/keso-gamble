name: One-time read-only voice KP ledger audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/voice-kp-ledger-audit-20261114.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read only aggregate voice receipt and relic receipts, no identities
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!/^[a-f0-9]{32}$/i.test(account??''))throw Error('Cloudflare read credentials unavailable');
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token};
          const res=await fetch(root+'/workers/scripts/valorant-results/settings',{headers,signal:AbortSignal.timeout(25000)});
          if(!res.ok)throw Error('Worker binding lookup HTTP '+res.status);
          const settings=await res.json();
          if(!settings.success)throw Error('Worker binding lookup unsuccessful');
          const db=settings.result?.bindings?.find(b=>b.type==='d1'&&b.name==='DB')?.id;
          if(!/^[a-f0-9-]{36}$/i.test(db??''))throw Error('Production D1 binding missing');
          const sinceHour=Date.now()-60*60*1000;
          const sinceDay=Date.now()-24*60*60*1000;
          const queries={
            voiceSlotsLastHour:`WITH e AS (
              SELECT id,user,at FROM kp_voice_events WHERE at>=${sinceHour}
              UNION ALL SELECT id,user,at FROM kp_voice_events_ext WHERE at>=${sinceHour}
            ) SELECT COUNT(*) AS slots,COUNT(DISTINCT e.user) AS recipients,MAX(e.at) AS lastAt,
              COALESCE(SUM(CASE WHEN base.id IS NULL OR base.delta!=5 THEN 1 ELSE 0 END),0) AS missingBase5,
              COALESCE(SUM(CASE WHEN bonus.id IS NULL OR bonus.delta!=10 THEN 1 ELSE 0 END),0) AS missingBonus10
              FROM e LEFT JOIN kp_ledger base ON base.id=e.id
              LEFT JOIN kp_ledger bonus ON bonus.id='bonus:'||e.id`,
            relicVoiceLastHour:`SELECT COUNT(*) AS payouts,COALESCE(SUM(delta),0) AS kpTotal,
              MAX(delta) AS biggestSinglePayout,MAX(at) AS lastAt
              FROM kp_ledger WHERE id>='relic:voice:' AND id<'relic:voice;' AND at>=${sinceHour}`,
            relicVoiceLastDay:`SELECT COUNT(*) AS payouts,COALESCE(SUM(delta),0) AS kpTotal,
              MAX(delta) AS biggestSinglePayout,MAX(at) AS lastAt
              FROM kp_ledger WHERE id>='relic:voice:' AND id<'relic:voice;' AND at>=${sinceDay}`,
            relicEffectLogLastDay:`SELECT COUNT(*) AS logged,MAX(bonus) AS highestBonus
              FROM relic_effect_logs WHERE mode='voice' AND at>=${sinceDay}`,
          };
          for(const [label,sql] of Object.entries(queries)){
            const response=await fetch(root+'/d1/database/'+db+'/query',{method:'POST',
              headers:{...headers,'Content-Type':'application/json'},
              body:JSON.stringify({sql}),signal:AbortSignal.timeout(25000)});
            if(!response.ok){ const err=await response.json().catch(()=>({})); console.error('D1 diagnostic error',label,JSON.stringify((err.errors??[]).map(e=>({code:e.code,message:String(e.message??'').slice(0,240)})))); throw Error('Read-only D1 query HTTP '+response.status+' for '+label); }
            const data=await response.json();
            if(!data.success||!data.result?.[0]?.success)throw Error('Read-only D1 query failed for '+label);
            const row=data.result[0].results?.[0]??{};
            console.log('voice_audit '+label+' '+JSON.stringify(row));
          }
          NODE
