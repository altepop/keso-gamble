name: DUEL Phase 9 guarded production policy
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "status (read only), activate (two fixed rows), or stop (remove only policy rows)"
        required: true
        type: choice
        options:
          - status
          - activate
          - stop
        default: status
      guild_id:
        description: "Approved Discord guild ID; never another guild"
        required: true
        type: string
        default: '606131625084059674'
permissions:
  contents: read
concurrency:
  group: duel-p9-production-policy
  cancel-in-progress: false
jobs:
  production_policy:
    # No PR, tag, fork or non-owner workflow actor may run production D1 changes.
    if: github.repository == 'altepop/keso-gamble' && github.ref == 'refs/heads/main' && github.actor == 'altepop'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Confirm production D1 credentials exist without displaying their values
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Cloudflare token unavailable'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Cloudflare account unavailable'; exit 1; }
      - name: Execute a scoped Phase 9 policy operation and read back both rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DUEL_RELEASE_OPERATION: ${{ inputs.operation }}
          DUEL_RELEASE_GUILD: ${{ inputs.guild_id }}
        run: node services/valorant-results/scripts/duel-phase9-release.mjs
