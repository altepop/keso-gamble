# One-time branch-local generated content version synchronization; removed after success.
name: Othello premium Activity cache sync
on:
  push:
    branches:
      - feat/othello-premium-feedback-20261118
    paths:
      - .github/workflows/othello-premium-cache-sync.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Update and verify content-derived browser cache versions
        run: |
          npm run build:activity
          npm run check:activity
          node --test tests/duel-othello-quality.test.js
      - name: Commit generated web versioned imports to isolated feature branch
        run: |
          git add js index.html
          if git diff --cached --quiet; then
            echo "All cache versions already up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): synchronize premium Othello import cache'
          git push origin HEAD:refs/heads/feat/othello-premium-feedback-20261118
