name: Temporary Mahjong public protocol lookup
on:
  pull_request:
    paths:
      - '.github/workflows/mahjong-public-error-probe.yml'
      - 'scripts/mahjong-public-protocol-probe.mjs'
permissions:
  contents: read
concurrency:
  group: mahjong-public-protocol-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-definitions:
    if: github.actor == 'altepop' && github.event.pull_request.head.repo.full_name == 'altepop/keso-gamble' && github.head_ref == 'fix/mahjong-audit-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/mahjong-public-protocol-probe.mjs
