name: Temporary D1 feed optimization verification
on:
  push:
    branches:
      - perf/d1-feed-conditional-read-20261031
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/d1-feed-conditional-read-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend Activity build and tests
        run: |
          npm ci
          npm run build:activity
          npm run check:activity
          npm test
      - name: Worker typecheck and tests
        run: |
          npm ci --prefix services/valorant-results
          npm --prefix services/valorant-results run typecheck
          npm --prefix services/valorant-results test
      - name: Save versioned imports for browser clients
        run: |
          if git diff --quiet -- js css index.html; then
            echo "Activity cache already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: bump Activity cache for low-read feed"
          git push origin HEAD:refs/heads/perf/d1-feed-conditional-read-20261031
