name: P12 duel administrator deployment evidence
on:
  pull_request:
    paths:
      - '.github/workflows/duel-admin-evidence.yml'
      - 'scripts/duel-admin-evidence.mjs'
      - 'services/valorant-results/test/duel-admin-evidence.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-admin-evidence.yml'
      - 'scripts/duel-admin-evidence.mjs'
      - 'services/valorant-results/test/duel-admin-evidence.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '11 22 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: duel-admin-evidence
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify safe evidence projection
        run: node --test services/valorant-results/test/duel-admin-evidence.test.mjs
      - name: Capture latest sanitized Actions metadata
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_ADMIN_EVIDENCE_FILE: ${{ runner.temp }}/duel-admin-evidence.json
        run: node scripts/duel-admin-evidence.mjs
      - name: Retain bounded evidence record for 30 days
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'altepop')
        uses: actions/upload-artifact@v7
        with:
          name: duel-admin-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/duel-admin-evidence.json
          if-no-files-found: error
          retention-days: 30
