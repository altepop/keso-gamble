name: One-off VALORANT roster audit (read-only)
on:
  push:
    branches: [feat/valorant-analysis-only-observers]
    paths: ['.github/workflows/valorant-roster-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only existing roster / KP mapping counts
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/d1/database/bf23ab40-814f-4626-9e0b-36739ac41750/query';
          async function sql(s,p=[]){
            if(!/^\s*SELECT\s/i.test(s))throw Error('Only SELECT allowed');
            const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:s,params:p}),signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('HTTP '+r.status);
            const j=await r.json();if(!j.success||!j.result?.[0]?.success)throw Error('SQL failure');
            return j.result[0].results;
          }
          const [roster,kp,link]=await Promise.all([
            sql('SELECT riot_id FROM tracked_players ORDER BY riot_id'),
            sql('SELECT COUNT(*) AS n FROM kp_accounts').catch(()=>[]),
            sql('SELECT riot FROM kp_accounts WHERE user=? LIMIT 5',['827801943928995840']).catch(()=>[])
          ]);
          console.log('SAFE_ROSTER_AUDIT '+JSON.stringify({monitored:roster.map(x=>x.riot_id),kobayashiExistingRiotIds:link.map(x=>x.riot),kpAccountCount:kp[0]?.n??null}));
          NODE
