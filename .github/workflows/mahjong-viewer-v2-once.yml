name: Temporary Mahjong viewer V2 history check
on:
  pull_request:
    paths:
      - '.github/workflows/mahjong-viewer-v2-once.yml'
permissions:
  contents: read
concurrency:
  group: mahjong-paipu
  cancel-in-progress: false
jobs:
  viewer-history:
    if: github.actor == 'altepop' && github.event.pull_request.number == 393 && github.event.pull_request.head.repo.full_name == 'altepop/keso-gamble' && github.head_ref == 'fix/mahjong-audit-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix services/valorant-results ci --ignore-scripts
      - name: Read one V2 iterator and one page, at most one completed owned replay
        working-directory: services/valorant-results
        run: node scripts/mahjong-review-live-audit.mjs --viewer-history-check
        env:
          YOSTAR_UID: ${{ secrets.YOSTAR_UID }}
          YOSTAR_TOKEN: ${{ secrets.YOSTAR_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
