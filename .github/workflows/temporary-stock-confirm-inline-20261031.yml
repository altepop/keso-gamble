name: Temporary verify stock confirmation in Discord browsers
on:
  push:
    branches:
      - fix/discord-stock-confirm-inline-20261031
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discord-stock-confirm-inline-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run frontend checks
        run: |
          npm ci
          npm run build:activity
          npm run check:activity
          npm test
      - name: Test mobile Chrome and iOS WebKit (mocked Worker only)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit
          node scripts/private-casino-browser-check.cjs chromium
          node scripts/private-casino-browser-check.cjs webkit
      - name: Commit generated cache busting version
        run: |
          if git diff --quiet -- js css index.html; then
            echo "Browser files up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: refresh Activity cache for inline stock approval"
          git push origin HEAD:refs/heads/fix/discord-stock-confirm-inline-20261031
