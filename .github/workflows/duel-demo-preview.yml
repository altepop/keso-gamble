name: Duel six-mode interactive demo screenshots
on:
  pull_request:
    paths:
      - 'duel-demo.html'
      - 'index.html'
      - 'duel-quality/**'
      - 'tests/duel-othello-quality.test.js'
      - 'duel-preview/**'
      - 'js/duel-*.js'
      - 'scripts/duel-demo-browser-check.cjs'
      - 'scripts/duel-othello-pass-browser-check.cjs'
      - 'scripts/duel-cpu-browser-check.cjs'
      - 'scripts/duel-live-touch-browser-check.cjs'
      - '.github/workflows/duel-demo-preview.yml'
  push:
    branches: [main]
    paths:
      - 'duel-demo.html'
      - 'index.html'
      - 'duel-quality/**'
      - 'tests/duel-othello-quality.test.js'
      - 'duel-preview/**'
      - 'js/duel-*.js'
      - 'scripts/duel-demo-browser-check.cjs'
      - 'scripts/duel-othello-pass-browser-check.cjs'
      - 'scripts/duel-live-touch-browser-check.cjs'
      - '.github/workflows/duel-demo-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-modes:
    name: Screenshot and test all six PvP games
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify safe Othello board transition classification
        run: node --test tests/duel-othello-quality.test.js
      - run: npm install --no-save playwright@1.63.0
      - name: Use official Ubuntu archive with bounded download waits
        run: |
          # Avoid slow regional mirrors during Playwright system dependency setup.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-playwright-downloads >/dev/null
      - name: Install Chromium and WebKit with signed Ubuntu dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit
      - name: Walk through all 6 modes on mobile Chromium
        env:
          DUEL_DEMO_SHOTS: ${{ runner.temp }}/duel-screens
        run: node scripts/duel-demo-browser-check.cjs
      - name: Walk through all 6 modes on iPhone WebKit
        env:
          DUEL_DEMO_SHOTS: ${{ runner.temp }}/duel-screens
        run: node scripts/duel-demo-browser-check.cjs webkit
      - name: Verify automatic Othello pass continues on mobile Chromium
        run: node scripts/duel-othello-pass-browser-check.cjs
      - name: Verify automatic Othello pass continues on iPhone WebKit
        run: node scripts/duel-othello-pass-browser-check.cjs webkit
      - name: Verify production Activity Gomoku touch flow in Chromium
        run: node scripts/duel-live-touch-browser-check.cjs
      - name: Verify production Activity Gomoku touch flow in iPhone WebKit
        run: node scripts/duel-live-touch-browser-check.cjs webkit
      - name: Test CPU practice in mobile Chromium
        run: node scripts/duel-cpu-browser-check.cjs
      - name: Test CPU practice in iPhone WebKit
        run: node scripts/duel-cpu-browser-check.cjs webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-demo-six-modes
          path: ${{ runner.temp }}/duel-screens/*.png
          if-no-files-found: warn
          retention-days: 14
