name: Death verdict incident diagnostic (read-only)
on:
  pull_request:
    paths: ['scripts/death-notice-audit*', '.github/workflows/death-notice-audit.yml']
  push:
    branches: [main]
    paths: ['scripts/death-notice-audit*', '.github/workflows/death-notice-audit.yml']
  workflow_dispatch:
    inputs:
      reported_at:
        description: 'Reported delivery time (ISO 8601 with timezone)'
        default: '2026-11-07T00:37:00+09:00'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: node --test scripts/death-notice-audit.test.mjs
  audit:
    needs: test
    if: github.repository == 'altepop/keso-gamble' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.actor == 'altepop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Inspect incident records (SELECT only, anonymous output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORTED_AT: ${{ inputs.reported_at || '2026-11-07T00:37:00+09:00' }}
        run: node scripts/death-notice-audit.mjs
