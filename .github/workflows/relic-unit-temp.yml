name: Temporary relic catalog unit verification
on:
  push:
    branches:
      - feat/relic-catalog-filters-rebased-20261104
    paths:
      - '.github/workflows/relic-unit-temp.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root tools
        run: npm ci
      - name: Verify content-derived browser cache
        run: npm run check:activity
      - name: Run all UI and game unit tests
        run: npm test
      - name: Mark successful verification (temporary branch only)
        run: |
          echo "PASS: npm run check:activity + npm test" > .relic-unit-verified-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .relic-unit-verified-tmp
          git commit -m "test(ci): mark relic validation passing"
          git push origin HEAD:feat/relic-catalog-filters-rebased-20261104
