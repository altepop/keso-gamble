name: Mahjong paipu fetch

# Reads the paipu that /paifu claims wait on, using the Mahjong Soul account in the YOSTAR_* Secrets,
# and sends summaries to the Worker. Logs are public: the script prints counts and error codes only.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      check:
        description: 'ログインできるかだけ確認する（牌譜は取得しない）'
        type: boolean
        default: false
      c3_probe:
        description: '実モデルのNode推論だけ検証（雀魂・Discord・KP・D1へアクセスしない）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mahjong-paipu
  cancel-in-progress: false

jobs:
  fetch:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/valorant-results
    env:
      MAHJONG_WORKER_URL: https://valorant-results.tealeaforest.workers.dev
      MAHJONG_INGEST_KEY: ${{ secrets.MAHJONG_INGEST_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Secrets and queue
        id: queue
        env:
          YOSTAR_TOKEN: ${{ secrets.YOSTAR_TOKEN }}
          CHECK: ${{ inputs.check }}
          MODEL_PROBE: ${{ inputs.c3_probe }}
        run: |
          if [ "$MODEL_PROBE" = "true" ]; then echo 'count=probe' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$YOSTAR_TOKEN" ] || [ -z "$MAHJONG_INGEST_KEY" ]; then
            echo 'YOSTAR_* または MAHJONG_INGEST_KEY が未設定のためスキップします。'
            exit 0
          fi
          if [ "$CHECK" = 'true' ]; then echo 'count=check' >> "$GITHUB_OUTPUT"; exit 0; fi
          node --experimental-strip-types scripts/mahjong-paipu.mjs --queue | tee -a "$GITHUB_OUTPUT"
      - name: Install
        if: steps.queue.outputs.count && steps.queue.outputs.count != '0' && steps.queue.outputs.count != 'probe'
        run: npm ci --ignore-scripts
      - name: Decide optional review inference
        id: c3
        if: steps.queue.outputs.count && steps.queue.outputs.count != '0' && steps.queue.outputs.count != 'check'
        env:
          MODEL_ENABLED: ${{ vars.MAHJONG_EQUAL_REVIEW_ENABLED }}
          MODEL_PROBE: ${{ inputs.c3_probe }}
        run: |
          if [ "$MODEL_ENABLED" = "true" ] || [ "$MODEL_PROBE" = "true" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore public model cache
        if: steps.c3.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: services/valorant-results/.cache/c3-model
          key: equal-review-c3-5b30a83de3ab9523
      - name: Load source-verified static model
        if: steps.c3.outputs.enabled == 'true'
        env:
          C3_ASSETS_ROOT: ${{ github.workspace }}/services/valorant-results/.cache/c3-model
        run: node scripts/mahjong-c3-download.mjs
      - name: Read-only Node inference probe
        if: inputs.c3_probe == true
        env:
          C3_ASSETS_ROOT: ${{ github.workspace }}/services/valorant-results/.cache/c3-model
        run: node scripts/mahjong-c3-probe.mjs
      - name: Fetch and summarize paipu
        if: steps.queue.outputs.count && steps.queue.outputs.count != '0' && steps.queue.outputs.count != 'probe'
        env:
          YOSTAR_UID: ${{ secrets.YOSTAR_UID }}
          YOSTAR_TOKEN: ${{ secrets.YOSTAR_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          MAHJONG_EQUAL_REVIEW_ENABLED: ${{ steps.c3.outputs.enabled == 'true' && 'true' || 'false' }}
          C3_ASSETS_ROOT: ${{ github.workspace }}/services/valorant-results/.cache/c3-model
        run: node --experimental-strip-types scripts/mahjong-paipu.mjs ${{ steps.queue.outputs.count == 'check' && '--check' || '' }}
