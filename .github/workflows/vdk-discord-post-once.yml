          if(!token)throw Error('Bot secret unavailable');
          async function send(path,method='GET',body){
            for(let i=0;i<4;i++){
              const res=await fetch('https://discord.com/api/v10'+path,{
                method,headers:{Authorization:'Bot '+token,...(body?{'Content-Type':'application/json'}:{})},
                body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});
              if(res.status===429){const rate=await res.json();await new Promise(done=>setTimeout(done,Math.min(12000,(rate.retry_after||1)*1000)));continue;}
              if(!res.ok)throw Error('Discord API HTTP '+res.status+' '+(await res.text()).slice(0,120));
              return res.json();
            }
            throw Error('Discord rate limit');
