name: VDK rescue Discord one-off verified post
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Publish full recorded coaching report to rescue channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const parts=["🆘 **【V26 ACT6｜VDK・Abema・石原を救いたい。】**\n研究対象に**石原（h1d3g1g4s#1037）**を追加。11/15カロードでは石原フェニックス16K/18D/5A・ACS215、表示ダイヤ2。\n石原の監視コンペ：**32戦16勝15敗1分、K/D1.08、ACS205.3**。主力はサイファー13戦、チェンバー12戦。今ACT全試合とは限らない。\nVDKと石原が**同じチームでプレーした25戦：10勝14敗1分**を試合IDで照合。\n**VDKソーヴァ＋石原サイファー：3勝2敗1分**（サンセット2勝／ヘイヴン2敗）。\n**VDKフェイド＋石原チェンバー：0勝4敗**。ただし相手ランク・マップ差は未補正。\n**VDKクローヴ＋石原チェンバー：2勝0敗**。2戦だけなので相性確定ではない。\nR20とR22では石原が0:23、VDKがその前後1〜2秒に死亡。先制キルを活かせなかった理由を位置とトレードから検証する。\n※共闘25戦の全てにAbemaがいたとは未確認。ただし11/15カロード戦はHenrikDev APIの実データでVDK・Abema・石原の同一チーム・同一パーティーが確認でき、他の同一パーティー参加者は0人＝正確に3人トリオだった。\n📚 具体的な改善策、今ACT74試合との違い、全マップ・エージェントの根拠を続きに掲載。\n-# VDK-ACT6-74-20261116-VERIFIED","**【V26 ACT 6】今回はVDKを救いたい。｜Dolly#SDGs ガチ戦績診断**\n\n対象：Dolly#SDGs／VALORANT V26: A6 Competitive。ユーザー提供のTracker PDF 2点（同じACT概要、詳細版に追加数値あり）。**対象期間を今ACT74試合に統一**。以前のKESO PLAY本番D1監視44試合は、分母が異なるため本稿の集計と混ぜない。\n>\n2026年11月16日時点で提供されたPDFのスナップショットであり、リアルタイムのランクではない。PDF表記「Platinum 3」と過去のプラチナ2降格通知との時点差は未解決。「プラチナ2降格記念」は企画名として維持し、現在ランクは断定しない。","**総合診断**\n\n• **74試合、32勝40敗2分、Tracker表示勝率43.2%**（32/74。引分も分母に含む）。\n• **42時間、963K/1099D/441A、K/D0.88、KAD1.28**。1試合平均13.0K、14.9D、6.0A。\n• **平均ACS186.1（下位15%）・ADR124.7（下位17%）・1ラウンド平均ダメージ差−11（下位27%）**。与ダメージ総計187,112／被ダメージ203,658／差−16,546。\n• **HS率27.1%（上位22%）**、KAST69.2%（下位42%）、ラウンド勝率48.4%（下位23%）、Tracker Score280/1000。\n• **初動**：ファーストキル112回、ファーストデス111回。全体ではほぼ同数。\n• **直近20試合：9勝11敗、K/D0.80、ADR111**。今ACT全体のK/D0.88／ADR124.7より落ち込んでいる。直近20試合の命中部位内訳は頭28.8%、胴64.3%、脚6.9%。\n• **良い点の要約**：HS率は相対的に高い。防衛側は攻撃側より戦闘貢献が大きい。センチネルでは比較的良い試合成績、サンセット・サミットに勝ち筋がある。設置173回・解除41回と目標への関与もある。\n• **問題点の要約**：ACSとADRが低く、トータル与ダメージが被ダメージを下回る。攻撃側のダメージ差と初動の負け越し、使用頻度の高いイニシエーター・デュエリストの低勝率、アビス・バインド・ヘイヴンへの苦戦が重なる。\n\n**何が悪くて、何が悪くないか**\n\n**最も重要なのは、HS率27.1%（上位22%）に対し、ACS186.1（下位15%）・ADR124.7（下位17%）という乖離だ。** 狙いを頭に合わせる能力だけでは、勝つための戦闘機会やダメージが不足している可能性がある。接敵を作るまでの位置取り、最初に接敵する角度、索敵・スモークと連動したピーク、トレード可能距離、スキル使用後に情報を勝ちにつなぐ動きが優先の検証対象だ。ただしHS率はエイム力全体の証明ではないし、録画なしに各原因を断定しない。","**実戦検証01｜2026年11月15日 カロード：降格直前の1試合を相手ランクで補正**\n\n**対象**：Tracker試合ID `88e69e18-6b40-4572-84fb-4f09fe4f463b`。ユーザー提供「Find your stats - Valorant Tracker.pdf」「同 2.pdf」「同 3.pdf」の3画面。時刻はTracker表示**05:49**、所要36分24秒、終了推定**06:25**。この終了時刻はKESO PLAY監視記録の同日06:25「カロード／フェイド／9-13敗北／16K14D9A」と一致する。**同じ試合IDを持つ10人の参加者記録が本番D1で確認され、同一試合と確定した**。ゲームプレイのVODではない。\n\n**Match Rank（試合詳細ページに表示されたランク）**\n\n・ダイヤモンド1 × 3名：VDK側（9ラウンド獲得） ダイヤモンド3 × 1名（Abema#ttv）\n・プラチナ3 × 2名：VDK側（9ラウンド獲得） ダイヤモンド2 × 1名（石原＝h1d3g1g4s#1037）\n・：VDK側（9ラウンド獲得） プラチナ3 × 1名（Dolly#SDGs）\n・：VDK側（9ラウンド獲得） プラチナ1 × 1名\n・：VDK側（9ラウンド獲得） ゴールド2 × 1名\n\n**表示階級を順序尺度で符号化する簡易指標**では相手の平均15.6、VDK側の平均14.8で、**相手側が約0.8ディビジョン高い**。これは実際の非公開MMRではないし、階級間隔が実力差に比例すると証明するものでもない。相手チームにVDK（プラ3）より低いランクの選手はいない。\n\n**VDK本人の成績と相手別直接対戦**\n\n**VDK（フェイド）**：16K / 14D / 9A、ACS208、ADR138、HS42.4%、KAST73.0%、DDΔ/R +14、攻撃7K/6D/5A、防衛9K/8D/4A。\n\n・Maria：相手のMatch Rank ダイヤ1 ／ VDKから見た直接K/D 5K / 4D ／ 与ダメージ / 被ダメージ 888 / 509\n・타이론：相手のMatch Rank ダイヤ1 ／ VDKから見た直接K/D 3K / 1D ／ 与ダメージ / 被ダメージ 560 / 248\n・PauPau：相手のMatch Rank ダイヤ1 ／ VDKから見た直接K/D 2K / 3D ／ 与ダメージ / 被ダメージ 276 / 598\n・danizyyy：相手のMatch Rank プラ3 ／ VDKから見た直接K/D 3K / 4D ／ 与ダメージ / 被ダメージ 719 / 803\n・Memento Mori：相手のMatch Rank プラ3 ／ VDKから見た直接K/D 3K / 2D ／ 与ダメージ / 被ダメージ 584 / 562\n・ダイヤ1の3人合計：相手のMatch Rank ダイヤ1 ／ VDKから見た直接K/D 10K / 8D（1.25） ／ 与ダメージ / 被ダメージ 1,724 / 1,355\n・プラ3の2人合計：相手のMatch Rank プラ3 ／ VDKから見た直接K/D 6K / 6D（1.00） ／ 与ダメージ / 被ダメージ 1,303 / 1,365\n\nこの試合では**16キル中10キルを自分より高い表示ランク（ダイヤ1）の選手に対して獲得し、直接対戦で10対8と勝ち越した**。したがって、**「格下狩りによる上振れ」としてこの1試合の好調を説明することはできない**。一方、相手チームへの敗北や、他の12戦のクローヴ成績の妥当性までこの1戦で結論は出せない。この試合の使用エージェントは**フェイド**であり、**クローヴ13試合の格付けを直接検証する証拠ではない**。\n\n**Abema#ttvの役割評価を訂正：FK4／FD0・クローヴULTによる遅延**","Abema#ttv（表示ダイヤ3・クローヴ）は15K / 22D / 6A、ACS196、DDΔ/R −82。**当事者申告のFK4／FD0について、今回追加されたTracker「Rounds」の4枚（R7・R10・R20・R22）のEvent Logから、4回の先制キル（FK4）を直接確認した**。FD0は試合全ラウンドの詳細を受け取っていないので当事者申告として維持し、全試合ログからの独立検証済みとはしない。\n\n**FK4／FD0なら、少なくとも4回は敵チームの最初のデスを奪い、自身が先に倒されるファーストデスは0回だ。** 一方、K/D0.68やDDΔ/R−82は戦闘の総量としては残るが、初動価値と両立し得る。**「22Dだから足を引っ張った」「VDKより貢献していない」という評価は取り消す。** スコアの低さのみで本人の責任を推定しない。\n\n加えて、AbemaはクローヴのULT「ノット・デッド・イェット」で**意図的に復活して時間を稼ぐ場合がある**（当事者の実戦観察）。Riotの公式解説でも、復活後にキルやアシストを取れないと分かっていても、重要なラウンドで復活する選択が正しい場合があるとしている。**復活後の追加デスが22Dにどの程度含まれたかは不明**。22Dと「本当に不利な初動デスの回数」を同一視しない。\n\n**実際の改善判定**は、(1)ULT前のスパイク・残り時間・人数差、(2)復活によって敵が追跡や射線移動に費やした時間、(3)味方がその間に逃げ切る・解除する・設置する・人数差を作るなどの効果があったか、(4)ULTによって失った次ラウンドへのリソース、をラウンド単位で確認する。ULTが単なる再デスに終わった場面と、敵の解除やピークを遅らせた場面を区別する。\n\n**訂正後の暫定評価**：この1試合のAbemaは**FK4をラウンド詳細で裏付けられる**明確な初動の強みがある。FD0は本人申告だ。死後スモークとULTの時間稼ぎ効果は未検証。VDKとAbemaのどちらが敗因だったかは特定できない。\n\n**追加「Rounds」4枚から分かったこと：FK後に2勝2敗**\n\n**出典**：ユーザー提供「Find your stats - Valorant Tracker 4.pdf」「同 5.pdf」「同 6.pdf」「同 7.pdf」。いずれも同じカロード9-13戦、各1ページ。選択されたラウンドは**R7、R10、R20、R22**。イベントログの先頭キルを確認した。\n\n・R7：初動キル（Abema） 0:21 ／ 勝敗 勝ち ／ VDK（フェイド） 3K / 0D / 0A ／ Abema（クローヴ） 2K / 1D / 0A\n・R10：初動キル（Abema） 0:12 ／ 勝敗 勝ち ／ VDK（フェイド） 1K / 0D / 1A ／ Abema（クローヴ） 2K / 0D / 1A\n・R20：初動キル（Abema） 0:13 ／ 勝敗 負け ／ VDK（フェイド） 0K / 1D / 1A ／ Abema（クローヴ） 1K / 1D / 0A\n・R22：初動キル（Abema） 0:06 ／ 勝敗 負け ／ VDK（フェイド） 1K / 1D / 0A ／ Abema（クローヴ） 1K / 1D / 0A\n\n**Abemaの先制キル4回が、提供された4ラウンドで個別に確認できた。** 自身の先制キルからのラウンド勝利は**2/4（50%）**。この値は特定の4ラウンドのみの数字であり、他の全ラウンド・他試合へ一般化しない。","**R20の重要な時系列**：Abemaが0:13に敵を倒して一旦5対4の人数有利を作ったものの、0:17に味方1人が倒されて4対4、0:22にVDKが倒されて3対4、0:23に別の味方が倒されて2対4、0:24にAbemaが倒されて1対4、0:41に最終的に全滅した。**先制キル後の0:17〜0:24の7秒間で4人が続けて倒されたこと**は、明確なチームとしてのレビュー対象だ。ただしスキル配置、各プレイヤーの射線、報告やVC状況はログだけでは分からない。誰が悪いかではなく「先制キル後の位置取り・引き際・カバー」を検証する。\n\n**R10の対照例**：Abemaが0:12に先制キル、チーム全員無死亡の5対0（Abema2K・VDK1K1A）で勝利。**先制キルをそのまま勝利へ変換できたラウンド**だ。\n\n**R7も好例**：Abemaが0:21に先制キル、VDK3K0D／Abema2K1Dで勝利。二人が合計5キルした点は確かだが、キル順や実際の連携内容はVODで確認する。\n\n**R22の反例**：Abemaが開始0:06に先制キルしても敗北。ログには0:06に複数イベントが記録されており、映像なしで先制キルが人数有利として何秒持続したか、味方の配置がどうだったかは断定しない。\n\n**クローヴULTの検証限界**：今回の「Rounds」4枚はキル順と位置の静止画を含むが、ULTの発動時刻・復活中の敵の行動・時間稼ぎの効果を十分には記録しない。**特定のラウンドでULTを使った、あるいはULT後の追加デスが起きたとは断定しない**。今後はラウンドVODでULT使用前後の人数・時計・スパイク状況を確認する。\n\n**石原（h1d3g1g4s#1037）も分析対象：フェニックスの戦闘貢献とチーム連携**\n\n**本人特定**：ユーザーから「h1d3g1g4s（石原）」との申告がある。Trackerスコアボードの`h1d3g1…#1037`、表示ランク**ダイヤモンド2**のプレイヤーに対応。Rounds画面ではフェニックスとして表示される。VDK（フェイド）、Abema（クローヴ）、石原（フェニックス）の3名を対象に、個人成績とチームの相互作用を区別して分析する。\n\n**石原のこの1試合の総合成績**：**16K／18D／5A、K/D0.89、ACS215、DDΔ/R −24**。VDKのACS208を上回る。ACSだけで個人の責任を推定しない。石原の**今ACT全体の戦績はまだ取得していない**ため、この1試合でエージェント適性を確定しない。\n\n**今回ユーザーが提示した4ラウンドの記録**：\n\n・7：結果 勝利 ／ 石原（フェニックス） 0K／1D／1A ／ 石原のイベント 0:36に死亡 ／ VDK・Abema VDK 3K0D、Abema 2K1D。二人で5キル\n・10：結果 勝利 ／ 石原（フェニックス） 1K／0D／0A ／ 石原のイベント 0:18にキル、生存 ／ VDK・Abema VDK 1K0D1A、Abema 2K0D1A。チーム全員生存で勝利\n・20：結果 敗北 ／ 石原（フェニックス） 0K／1D／1A ／ 石原のイベント 0:23に死亡 ／ VDK・Abema Abema 0:13先制キル→VDK 0:22死亡→石原0:23死亡→Abema0:24死亡\n・22：結果 敗北 ／ 石原（フェニックス） 0K／1D／1A ／ 石原のイベント 0:23に死亡 ／ VDK・Abema Abema 0:06先制キル→同秒に敵からのキルも発生→石原0:23死亡→VDK0:25死亡\n\n**この4ラウンドだけで1K／3D／3A・2勝2敗**。選択された一部のラウンドであり、全22ラウンドの代表サンプルではない。全試合の16K／18D／5Aを無視して「石原は1K／3D」と評価するのは誤りだ。","**最優先の検証箇所はR20とR22**。石原は両ラウンドで開始23秒に死亡し、VDKも前後1〜2秒（R20：0:22、R22：0:25）に死亡している。**序盤の射線・位置関係、フラッシュと索敵の順序、トレード可能距離、初動人数有利後の引き際**を、録画で確認すべきだ。「石原が突っ込んだ」「VDKのカバーがない」とはログだけで断定できない。\n\n**対照例のR10**では、Abemaの先制キル後、石原が0:18に1キルを取り、生存。VDKも1キル1アシストを記録して味方全員生存で勝利。良い進入連携によるものかは未確認だが、初動の成功をラウンド勝利へ変換した例としてR20・R22と比較できる。\n\n**石原への改善仮説**：\n1. **フェニックスのフラッシュ前後の位置と役割を共有**：Abemaのスモーク、VDKの索敵に合わせて、誰が先行し誰がトレードするかを決める。\n2. **初動キルを取った直後の行動を決める**：安全に引いて有利を保持するか、味方と同時にエリアを広げるか。単独の追加ピークを必要な行動と区別する。\n3. **R20・R22の0:23前後を動画で再検証**：相手の射線、リスク情報、残スキル、VDKとの距離を確認し、二人が短時間に倒された理由を切り分ける。\n4. **今ACT全体は別途集計**：石原#1037のA6エージェント詳細、試合履歴、相手ランクを集め、この1試合の印象に引きずられない。\n\n**この1試合から学ぶべきこと**\n\n1. **降格直前の試合でVDKの射撃力が急に崩れたわけではない**。自分よりランク表示の高い敵にもキルを取り、K/D1.14、DDΔ/R+14だった。\n2. **敗因はラウンド単位で切り分ける必要がある**。VDKのフェイドによる9アシストや索敵、Abemaの4FK／0FD、クローヴの死後スモーク・ULT時間稼ぎが、実際に何ラウンドの勝利につながったかはVOD/ラウンド詳細がないので未検証。\n3. **Abemaの貢献をK/Dだけで評価しない**。表示ダイヤ3でK/D0.68・DDΔ−82という数字と、当事者報告によるFK4／FD0は矛盾しない。クローヴULTによる遅延もVODで評価する。相手・味方の表示ランクと実際の戦闘価値は別だ。\n4. **相手ランク補正を今ACTのキャラ比較全体に外挿しない**。これはフェイドの1試合のみの分析。次はクローヴ13戦とサイファー6戦で同じ手法を適用する。","**石原の継続戦績：KESO PLAY監視32試合（VDKのACT全体74試合とは別集計）**\n\n**対象**：h1d3g1g4s#1037（石原）。KESO PLAYの本番D1・試合通知の読み取り専用集計。監視記録は**2026年10月25日02:08〜11月15日06:25 JST**。**コンペ32試合、16勝15敗1分、引分を除く勝率51.6%、総合K/D1.08・平均ACS205.3**。直近10試合は**4勝6敗、K/D1.19・ACS227.6**。直近は勝率の割に個人の戦闘指標が高い傾向だが、ロール・マップ・相手のランク・トレード・ラウンドの情報なしに貢献の質は断定できない。\n\n**重要：この32試合はKESO PLAY監視に残っている試合のみ**。TrackerのACT全期間を網羅したものではない。VDKのTracker74試合、またはD1のVDK44試合と直接比較すると選択バイアスが生じ得る。両者が同じ試合でチームメイトだったかは個別照合が必要だ。\n\n**石原のエージェント別（監視期間の全6体・32戦）**\n\n・サイファー：試合 13 ／ 勝敗 7勝5敗1分 ／ K/D 1.13 ／ 平均ACS 201.8\n・チェンバー：試合 12 ／ 勝敗 6勝6敗 ／ K/D 1.06 ／ 平均ACS 215.1\n・フェニックス：試合 3 ／ 勝敗 2勝1敗 ／ K/D 1.34 ／ 平均ACS 214.0\n・ヴァイス：試合 2 ／ 勝敗 1勝1敗 ／ K/D 1.14 ／ 平均ACS 186.5\n・レイズ：試合 1 ／ 勝敗 0勝1敗 ／ K/D 1.06 ／ 平均ACS 259.0\n・テホ：試合 1 ／ 勝敗 0勝1敗 ／ K/D 0.40 ／ 平均ACS 92.0\n\n**最重要の発見：石原の主力はフェニックスではなく、サイファーとチェンバー（計25/32試合）だ。** カロードの1試合だけでデュエリスト適性を評価すると、普段のセンチネル運用を見落とす。フェニックスは3戦2勝1敗でK/D1.34だが、少数のため最適ロールと断定しない。\n\n**石原のマップ別（監視期間）**\n\n・カロード：試合 6 ／ 勝敗 2勝4敗 ／ K/D 0.90 ／ 平均ACS 182.3\n・アビス：試合 6 ／ 勝敗 3勝2敗1分 ／ K/D 1.25 ／ 平均ACS 195.0\n・ロータス：試合 5 ／ 勝敗 3勝2敗 ／ K/D 1.20 ／ 平均ACS 215.4\n・サンセット：試合 4 ／ 勝敗 3勝1敗 ／ K/D 0.81 ／ 平均ACS 174.5\n・サミット：試合 4 ／ 勝敗 2勝2敗 ／ K/D 1.27 ／ 平均ACS 248.5\n・バインド：試合 4 ／ 勝敗 2勝2敗 ／ K/D 1.28 ／ 平均ACS 245.0\n・ヘイヴン：試合 3 ／ 勝敗 1勝2敗 ／ K/D 0.95 ／ 平均ACS 186.0\n\n**カロードは石原にとっても今回の監視では負け越し（2勝4敗）**。VDKのカロード使用エージェントや敵ランクと組み合わせ、どのような進入・セットアップで苦戦するかを調べたい。ただしマップ自体が負けの原因とは限らず、少数試合の相手強度の差もある。\n\n**石原を改善する際の優先順位**\n\n1. **サイファー／チェンバーという主力2キャラの勝ち方をまず確認**。クローヴ（VDKまたはAbema）とのスモーク・カメラ・トラップ・射線の補完関係をマップごとに決める。\n2. **カロードの6戦での低調を検証**。相手のランク、使用エージェント、攻守、序盤のファーストデス、守備サイト放棄、人数有利後の連続デスを優先してVODで分類する。","3. **フェニックスで味方と協力して進入した場合の質を検証**。特に今回のR20/R22ではVDKと石原が1〜2秒差で死亡した。フラッシュや索敵の使用タイミング、トレード可能な距離をチェックする。\n4. **勝ってもACSが低い試合、負けてもACSが高い試合を分ける**。直近10戦は平均ACS227.6なのに4勝6敗。個人のACS改善だけでなく、ラウンドを勝ち切る選択に注目する。\n5. **石原を他の2名と単純に比較しない**。本人のランク、ロール、相手の強さ、同一パーティー・マップの条件をそろえた上で比較する。\n\n**VDK×石原：同じチーム25戦の「組み合わせ」を比較**\n\n**同一試合ID・同一チームIDで確認した25試合：10勝14敗1分、引分除外の勝率41.7%。** 二人だけのデュオ／トリオ／フルパの内訳は不明。Abemaがこの25試合に毎回いたとは確認できない。対象はKESO PLAY監視の一部であり、VDKのACT全体74試合の勝率と同一母集団として混算しない。\n\nこの**同一チーム25試合に限った集計**では、VDKは計286K／366D・K/D0.78・平均ACS162.6、石原は計370K／358D・K/D1.03・平均ACS205.9。ただしセンチネルとイニシエーターなど**ロール差を考慮せず個人の優劣を断定しない**。\n\n・ソーヴァ：石原 サイファー ／ 共闘結果 6戦3勝2敗1分 ／ VDKのK/D・ACS 0.80・154.2 ／ 石原のK/D・ACS 1.00・197.7 ／ 特に確認すべきこと 情報を得た後、攻守の判断につながったか\n・フェイド：石原 チェンバー ／ 共闘結果 4戦0勝4敗 ／ VDKのK/D・ACS 0.98・213.0 ／ 石原のK/D・ACS 0.68・156.0 ／ 特に確認すべきこと 情報取得とチェンバーのピーク／撤退が同期しているか\n・クローヴ：石原 チェンバー ／ 共闘結果 2戦2勝0敗 ／ VDKのK/D・ACS 0.70・160.0 ／ 石原のK/D・ACS 1.37・249.0 ／ 特に確認すべきこと スモークとチェンバーの射線で勝ちを作ったか\n・フェイド：石原 フェニックス ／ 共闘結果 1戦0勝1敗 ／ VDKのK/D・ACS 該当カロード戦 ／ 石原のK/D・ACS 該当カロード戦 ／ 特に確認すべきこと R20／R22の連続デス\n\n**注意**：「フェイド＋チェンバーが弱い」「クローヴ＋チェンバーが強い」は**現時点では仮説**。勝敗差は敵味方の表示ランク、マップ、パーティー人数、直近の練度などで変わり得る。4戦や2戦に高い確信度は与えられない。\n\n**フェイド＋チェンバー4敗の内訳（特に注目）**：\n• **カロード**：2026/10/25・12-14敗（VDK21K18D・ACS249／石原10K23D・ACS127）、2026/11/12・10-13敗（VDK20K17D・ACS225／石原16K15D・ACS177）\n• **サミット**：2026/11/12・2-13敗（VDK6K14D・ACS154／石原8K14D・ACS149）\n• **ロータス**：2026/11/09・8-13敗（VDK17K16D・ACS224／石原12K16D・ACS171）\n\n同じ「4敗」でもVDK本人の撃ち合いができている試合と両者とも苦戦した試合がある。**石原のチェンバーは監視期間全体12戦K/D1.06・ACS215.1に対し、VDKフェイドとの4戦ではK/D0.68・ACS156.0**と低い。だからこそ、試合相手・射線・索敵からのピーク・トレード距離の変化を比較する価値が高い。**相手の強さの違いが原因かもしれず、「VDKのフェイドが石原を弱くした」とは断定しない**。\n\n**ソーヴァ＋サイファー6戦のマップ差**：\n• **サンセット**：2勝0敗","• **アビス**：1勝0敗1分\n• **ヘイヴン**：**0勝2敗**\n\n同じキャラの組み合わせでもヘイヴンで2敗。**エージェントだけでなくマップ別に情報の使い方と守備サイトのカバーを検証する**。\n\n**クローヴ＋チェンバー2勝の内訳**：サミット13-8勝（VDK12K16D・ACS177／石原22K14D・ACS296）、カロード13-8勝（VDK11K17D・ACS143／石原15K13D・ACS202）。VDKのK/Dが1未満でも試合には勝っている。クローヴのスモークやサポートが貢献した可能性はあるが、**キル以外の効果はVODで確認する**。\n\n**三人で検証する次の試合の行動**\n\n1. **担当ロールを明示**：VDK、Abema、石原の3人が同じチームにいる場合、誰がスモーク・誰が先行・誰が守備情報を取り、何秒後にピークするかをラウンド開始前に合わせる。**この25戦にAbemaがいたかは未検証**。\n2. **石原サイファー＋VDKソーヴァはヘイヴンを再審査**：映像の負けラウンドを「索敵→退避／射線変更→トレード可能な位置」の順序で追う。\n3. **石原チェンバー＋VDKフェイドの4敗を集中的に比較**：同じカロードで勝った「VDKクローヴ＋石原チェンバー」と比べ、敵の表示ランク・エリア取得・スキル使用・最初のデスの場所を記録。\n4. **初動人数有利の転換**：R20・R22のようにAbemaの先制キルが勝利につながらなかったケースで、VDK・石原の双方が短時間に倒された原因を、VODとチームVCで確認する。\n5. **効果検証**：各構成を最低数試合、同じマップに絞って実験。勝率のみではなく人数有利後のラウンド取得率・トレード不能デス・役割の遂行を測る。","**1. 攻撃・防衛の非対称性（今回いちばん改善効果を期待する領域）**\n\n・対象ラウンド：攻撃 752 ／ 防衛 749 ／ 所見 母数はほぼ同じ\n・ラウンド勝率：攻撃 48.0% ／ 防衛 48.7% ／ 所見 大きな勝率差はない\n・平均ACS：攻撃 176.3 ／ 防衛 196.0 ／ 所見 攻撃側−19.7\n・ADR：攻撃 117.9 ／ 防衛 131.4 ／ 所見 攻撃側−13.5\n・1Rダメージ差：攻撃 −22 ／ 防衛 −1 ／ 所見 攻撃で不利な撃ち合いが相対的に多い可能性\n・KAST：攻撃 68.6% ／ 防衛 69.7% ／ 所見 攻撃側−1.1pt\n・ファーストキル / ファーストデス：攻撃 43 / 56 ／ 防衛 69 / 55 ／ 所見 攻撃初動は13回負け越し\n・キル / デス：攻撃 474 / 562 ／ 防衛 490 / 537 ／ 所見 攻撃のK/D0.84、防衛0.91\n\n判断：**攻撃側で「先に有利な接敵を作れず、情報取得と連携が成果につながらない」可能性を最優先で検証する。** ただし両サイドのラウンド勝率は近いため、攻撃だけを敗因と決めつけない。\n\n実践：**Abemaもロール変更可能**という条件で、まず**VDK＝クローヴ／Abema＝索敵・進入役**と**VDK＝サイファー／Abema＝クローヴなど**を比較する。VDKのA6クローヴは13戦69.2%、サイファーは6戦50.0%・K/D1.08・KAST76.5%と、今ACTで一定の結果がある。どちらも攻撃側の初動で誰がどの射線を通って進入するかを事前に決める。VDKがソーヴァを担当する場合はリコンの目的と連携タイミングを特に検証する。","**2. ロール別の全ACT成績**\n\n・イニシエーター：勝敗 10勝18敗（ほか引分がある可能性） ／ Tracker勝率 33.3% ／ K/D/A 337/427/183 ／ K/D 0.79\n・デュエリスト：勝敗 7勝14敗 ／ Tracker勝率 33.3% ／ K/D/A 295/333/99 ／ K/D 0.89\n・コントローラー：勝敗 10勝5敗 ／ Tracker勝率 66.7% ／ K/D/A 213/240/125 ／ K/D 0.89\n・センチネル：勝敗 5勝3敗 ／ Tracker勝率 62.5% ／ K/D/A 118/99/34 ／ K/D 1.19\n\nロール別の勝率はPDFに表示された値を優先。引分の内訳はロール行では明示されていないため、勝敗のみ列挙した。\n\n**重要な前提変更：Abema#ttvはクローヴ以外のロールにも変更可能。** VDKは今ACTのコントローラーが10勝5敗、クローヴ単独で13戦・勝率69.2%（前ACTも16戦・56.2%）なので、**VDK＝クローヴ／Abema＝別ロールを優先的に検証する**。ただしAbemaの他ロールでの戦績は未入手であり、この組み合わせが最良だと確定したわけではない。\n\n**実戦案（A6の14エージェント詳細で再評価）**：**現在の数値で最初に検証する候補はクローヴ**（13戦69.2%、ADR144.0、ACS209.3、KAST74.7%）、**次に検証する候補はサイファー**（6戦50.0%、K/D1.08、ADR141.3、ACS207.4、KAST76.5%、DDΔ+18）。サイファーはA5の9戦33.3%、KAST65.9%からA6では大きく持ち直した。一方、**フェニックスはA5の7戦57.1%・ACS242.4からA6の7戦28.6%・ACS172.7・KAST64.0%へ急落**したため、現時点では第2候補から外す。ソーヴァは16戦37.5%・ACS167.6で、索敵が必要なマップに限定しリコンの使用目的を改善する。フェイドはA6の11戦27.3%・KAST65.9%・攻撃側ラウンド勝率38.5%と厳しく、動画検証までは優先度を下げる。Abemaは他ロールへ変更可能だが、本人の別ロールの実力は未確認である。","**3. エージェント別（今ACTの全14体・詳細PDFから確認）**\n\n・ソーヴァ：試合 16 ／ 勝率 37.5% ／ 補足 リコン即使用の癖はAbemaの実戦観察。PDFには使用時刻はない\n・クローヴ：試合 13 ／ 勝率 69.2% ／ 補足 最優先候補。ADR144.0、ACS209.3、KAST74.7%、攻撃側ラウンド勝率58.1%\n・フェイド：試合 11 ／ 勝率 27.3% ／ 補足 低勝率。特定マップでの役割・索敵→進入を映像検証\n\n追加されたA6詳細PDF3枚により、今ACTの全14エージェントについて試合数、勝率、K/D、ADR、ACS、KAST、攻守別ラウンド勝率まで取得できた。以下の追加章で全件を掲載する。今ACTの74試合と各エージェントの試合数の合計は一致する。\n\n**今ACT A6：エージェント全14体の詳細**\n\n・ソーヴァ：試合 16 ／ 勝率 37.5% ／ K/D 0.83 ／ ADR 115.5 ／ ACS 167.6 ／ KAST 71.1% ／ DDΔ/R −7\n・クローヴ：試合 13 ／ 勝率 69.2% ／ K/D 0.89 ／ ADR 144.0 ／ ACS 209.3 ／ KAST 74.7% ／ DDΔ/R −9\n・フェイド：試合 11 ／ 勝率 27.3% ／ K/D 0.81 ／ ADR 114.1 ／ ACS 175.0 ／ KAST 65.9% ／ DDΔ/R −23\n・フェニックス：試合 7 ／ 勝率 28.6% ／ K/D 0.84 ／ ADR 112.9 ／ ACS 172.7 ／ KAST 64.0% ／ DDΔ/R −30\n・サイファー：試合 6 ／ 勝率 50.0% ／ K/D 1.08 ／ ADR 141.3 ／ ACS 207.4 ／ KAST 76.5% ／ DDΔ/R +18\n・レイナ：試合 5 ／ 勝率 40.0% ／ K/D 1.17 ／ ADR 148.8 ／ ACS 224.1 ／ KAST 72.5% ／ DDΔ/R +21\n・レイズ：試合 4 ／ 勝率 25.0% ／ K/D 0.84 ／ ADR 134.2 ／ ACS 207.3 ／ KAST 62.1% ／ DDΔ/R −7\n・ジェット：試合 4 ／ 勝率 50.0% ／ K/D 0.76 ／ ADR 118.4 ／ ACS 177.4 ／ KAST 59.0% ／ DDΔ/R −25\n・オーメン：試合 2 ／ 勝率 50.0% ／ K/D 0.87 ／ ADR 120.2 ／ ACS 181.8 ／ KAST 66.1% ／ DDΔ/R −22\n・スカイ：試合 2 ／ 勝率 0.0% ／ K/D 0.52 ／ ADR 83.7 ／ ACS 131.8 ／ KAST 65.7% ／ DDΔ/R −66\n・アイソ：試合 1 ／ 勝率 0.0% ／ K/D 0.67 ／ ADR 101.2 ／ ACS 145.3 ／ KAST 73.1% ／ DDΔ/R −20\n・ヴァイス：試合 1 ／ 勝率 100% ／ K/D 1.85 ／ ADR 178.4 ／ ACS 297.3 ／ KAST 72.7% ／ DDΔ/R +68\n・テホ：試合 1 ／ 勝率 100% ／ K/D 0.42 ／ ADR 62.0 ／ ACS 95.9 ／ KAST 66.7% ／ DDΔ/R −56\n・チェンバー：試合 1 ／ 勝率 100% ／ K/D 1.22 ／ ADR 111.1 ／ ACS 162.2 ／ KAST 64.7% ／ DDΔ/R −12\n\n**突合チェック**：全14体の試合数は74、合計963K／1099D／441Aで、今ACT概要PDFの総数と完全一致。したがってエージェント別集計に欠落はない。1〜2試合の勝率は適性判断に使わない。\n\n**A6の攻守別ラウンド勝率・K/D（優先6体）**","・クローヴ：攻撃R勝率 58.1% ／ 攻撃K/D 0.78 ／ 防衛R勝率 55.2% ／ 防衛K/D 1.00 ／ 要点 攻撃側もラウンドを取れている\n・サイファー：攻撃R勝率 50.0% ／ 攻撃K/D 1.20 ／ 防衛R勝率 47.8% ／ 防衛K/D 1.00 ／ 要点 今ACTは攻撃でK/Dが高い\n・ソーヴァ：攻撃R勝率 50.6% ／ 攻撃K/D 0.74 ／ 防衛R勝率 44.4% ／ 防衛K/D 0.95 ／ 要点 防衛のラウンド取得と攻撃のキル効率が別課題\n・フェイド：攻撃R勝率 38.5% ／ 攻撃K/D 0.71 ／ 防衛R勝率 45.0% ／ 防衛K/D 0.91 ／ 要点 攻撃側のチーム勝率がとくに低い\n・フェニックス：攻撃R勝率 46.8% ／ 攻撃K/D 0.90 ／ 防衛R勝率 46.1% ／ 防衛K/D 0.78 ／ 要点 攻守とも前ACTより悪化\n・レイナ：攻撃R勝率 38.3% ／ 攻撃K/D 1.08 ／ 防衛R勝率 56.4% ／ 防衛K/D 1.26 ／ 要点 キル性能があっても攻撃ラウンドの勝率は低い\n\n**この表からの重要な判断**：ソーヴァはA6の攻撃側ラウンド勝率50.6%に対し、防衛44.4%。以前の「攻撃の索敵だけが問題」という指摘は不十分だ。一方フェイドの攻撃側38.5%は明確なレビュー候補。**クローヴは個人K/D0.89でも攻守のラウンド勝率58.1%／55.2%と高く、キル数以外の勝ちへの関与を検証する価値がある**。ただし情報量・スモークの実効性はVODなしでは断定しない。\n\n**前ACT A5 → 今ACT A6の「適性変化」**\n\n・クローヴ：試合勝率 A5→A6 56.2%→69.2% ／ ADR A5→A6 150.9→144.0 ／ ACS A5→A6 224.3→209.3 ／ KAST A5→A6 76.8%→74.7% ／ 注目点 戦闘指標はやや低下でも試合勝率は上昇\n・サイファー：試合勝率 A5→A6 33.3%→50.0% ／ ADR A5→A6 118.1→141.3 ／ ACS A5→A6 177.1→207.4 ／ KAST A5→A6 65.9%→76.5% ／ 注目点 複数の戦闘/連携指標が同時に改善\n・フェニックス：試合勝率 A5→A6 57.1%→28.6% ／ ADR A5→A6 161.2→112.9 ／ ACS A5→A6 242.4→172.7 ／ KAST A5→A6 79.0%→64.0% ／ 注目点 同じ7試合で大幅悪化。優先ピックから外す\n・フェイド：試合勝率 A5→A6 55.0%→27.3% ／ ADR A5→A6 117.1→114.1 ／ ACS A5→A6 178.5→175.0 ／ KAST A5→A6 74.9%→65.9% ／ 注目点 勝率・KAST・攻撃側ラウンド勝率が悪化\n・ソーヴァ：試合勝率 A5→A6 42.2%→37.5% ／ ADR A5→A6 132.2→115.5 ／ ACS A5→A6 191.8→167.6 ／ KAST A5→A6 72.5%→71.1% ／ 注目点 索敵の即使用癖と戦闘貢献を動画で検証\n\n※A5とA6で対戦相手やマップ構成は異なる可能性がある。数字が動いた理由をエージェントだけに帰属させない。","**4. マップ別（Tracker掲載の全7マップ）**\n\n・サミット：勝敗 7勝3敗 ／ Tracker勝率 70.0% ／ 優先度 良いセットアップを言語化\n・サンセット：勝敗 8勝5敗 ／ Tracker勝率 61.5% ／ 優先度 勝ち筋の再現\n・ロータス：勝敗 4勝4敗 ／ Tracker勝率 50.0% ／ 優先度 デュオ連携を見直す\n・カロード：勝敗 8勝9敗 ／ Tracker勝率 47.1% ／ 優先度 使用エージェント別の精査\n・バインド：勝敗 2勝7敗 ／ Tracker勝率 22.2% ／ 優先度 S：攻守のセットアップ\n・ヘイヴン：勝敗 1勝4敗 ／ Tracker勝率 20.0% ／ 優先度 S：ローテと索敵後の進行\n・アビス：勝敗 2勝8敗（表示勝率16.7%） ／ Tracker勝率 16.7% ／ 優先度 S：最優先で弱点の切り分け\n\n**注**：PDFのアビスは「2勝8敗」と「勝率16.7%」を同時に表示している。全体には2引分があるため分母に引分が含まれる可能性が高いが、画面のマップ一覧には引分の内訳が明記されていない。表示値をそのまま採用する。\n\n「カロード」と表記する。「コロード」にはしない。","**5. 詳細な良い点と課題**\n\n**良い点（根拠の強い順）**\n\n1. **HS率27.1%はTracker比較で上位22%。** 射撃精度は全てが問題ではない。ただしストッピング・クロスヘア位置・撃ち合いの質を証明する指標ではない。\n2. **防衛側：ACS196.0、ADR131.4、ダメージ差−1。** 攻撃よりも相対的に安定して戦闘ができている。\n3. **コントローラー：10勝5敗、クローヴ13戦・69.2%。** VDKの最初の試験候補。センチネルも5勝3敗・K/D1.19だが、今ACTの個別キャラ内訳が不明なので補助候補とする。\n4. **サミット70%、サンセット61.5%。** 苦手マップだけではなく、勝てているマップの成功パターンを再現すべき。\n5. **スパイク設置173回、解除41回。** オブジェクトへの関与が見える。成功率や置き方は別途動画が必要。\n6. **ファーストキル112、ファーストデス111。** 全体で一方的に先に倒され続けているわけではない。ただし攻撃では43対56で負け越し。\n7. **1v1勝利18、1v2勝利9、1v3勝利2。** 人数不利を覆せた場面はある。ただしTracker内のクラッチ総数は29と32の表示が混在するため、合計を断定しない。\n\n**課題（根拠の強い順）**\n\n1. **ADR124.7（下位17%）、ACS186.1（下位15%）と低い。** HS率が高くても総合的な戦闘貢献が不足。\n2. **平均ダメージ差−11/R、合計−16,546。** 自分の被ダメージの方が多い。\n3. **攻撃側のダメージ差−22/Rと初動43FB対56FD。** 最優先で映像検証すべき構造的な弱点。\n4. **使用頻度の高いイニシエーター勝率33.3%、デュエリスト33.3%。** ロール選択と実際の成果に乖離。\n5. **ソーヴァ16戦37.5%、フェイド11戦27.3%。** 味方のための情報取得が十分な価値を作れているか不明。\n6. **アビス16.7%、バインド22.2%、ヘイヴン20%。** 明らかなマップ別改善候補。ただし複数の味方・敵・キャラを含む。\n7. **直近20戦9勝11敗、K/D0.80、ADR111。** 今ACT全体よりも近況の戦闘指標が低い。\n8. **KAST69.2%は下位42%、ラウンド勝率48.4%は下位23%。** HS率の相対的な良さと勝利への貢献の乖離がある。\n9. **トレード：Avenger70／Victim168。** 元サイトの集計値として記録。ただし「味方をトレードできた／された」ときの機会数と定義が不明なため、数字だけで非難しない。\n10. **クラッチ機会・1v1敗北16の表示。** 1v1の勝利18もあるため、単純に「クラッチが弱い」とは結論できない。","**6. Abemaの実戦観察：ソーヴァの「リコンが戻るとすぐ使う」癖**\n\n**証拠の区別**：これはAbema#ttvによる実戦観察であり、Tracker PDFから判明した数値ではない。使用頻度や原因は録画で裏付ける。\n\n**何がまずいか**\n\nリコンボルトが戻るたびに機械的に撃つと、(a)味方が進入できない、(b)重要な進入・リテイクでは使用できない、(c)敵に破壊されただけで味方の行動が変わらない、といった「スキルを使ったがラウンドを動かせなかった」場面が増え得る。\n\n**どう直すか**\n\n• **撃つ前の3秒確認**：「今、何を知りたい？ 誰が、その情報で動く？」\n• **担当者に合わせて連携**：VDKがソーヴァなら、Abemaがクローヴの試合は「次にリコン、合わせてスモーク」と短く合図。Abemaが別ロールなら、チーム内のスモーク担当と進入のタイミングを合わせる。VDKがクローヴを使う試合では、Abemaの索敵・フラッシュを受けてスモークを入れる。\n• **撃った後はチーム行動**：「映った／映らない／破壊された」を伝えるだけで終わらず、味方の進入・撤退・エリア確保へつなぐ。\n• **早い索敵が必要なら即使用は正解**。開幕の位置確認やローテ判断など、目的があり味方が活用できる場合は温存しない。\n• **次のソーヴァ5戦で採点**：各試合のリコン5件を抽出し、使用目的・味方の位置・使用後10秒のアクション・重要局面に使えたかを記録。\n\n**目標は使用回数を減らすことではなく、リコンから味方の行動につながった割合を上げることだ。**","**7. 2週間の救済メニュー**\n\n• **1〜3試合目**：デュオでVDK＝クローヴ、Abema＝使えるイニシエーター等の別ロールを試す。各マップの攻撃セットアップを2つ用意し、スモークと索敵・進入の同期を記録する。\n• **4〜6試合目**：VDK＝サイファー、Abema＝クローヴ等を試す。攻撃側でサイファーの情報スキルをどこで使い、敵の位置を受けて味方が進入できたかを確認する。ファーストデスを映像で振り返り、スモーク端・敵の位置・味方との距離・トレード可否を記録する。\n• **7〜10試合目**：マップに応じて2構成を比較する。ソーヴァ使用時はリコンの使用目的を宣言し、フェイド使用時も索敵→進入の秒数を見直す。構成と結果を試合ごとに記録する。\n• **11〜15試合目**：同じ役割と同程度のマップ条件で比較。勝率だけでなくADR・ACS・KAST・攻撃初動FB/FD・大差負けの有無を追う。\n\n**暫定評価目標**：今ACTベースのADR124.7を130台に、ACS186.1を195前後に、KAST69.2%を72%前後へ、攻撃FB/FD 43/56を中長期で同数以上へ改善。**数値は練習目標であり達成の保証ではない**。特に15試合だけの勝率は上振れ・下振れが大きい。","**追加資料③・④：前ACTエージェント詳細とAbema共闘実績（今回のPDF5点）**\n\n**厳密なスコープ**：新規に受領した「Competitive Agent Stats」4枚はすべて**V26:A5（前ACT）**。新規「Valorant Competitive Match History 3」は**V26:A6選択画面**だが、下部のチームメイト・パーティー内訳はACT74戦を超える表示件数を含むため、同じ対象期間だと保証されない。**A5の表をA6の戦績として引用しない**。\n\n**A5→A6：同じエージェントの勝率（試合勝率）の変化**\n\n・ソーヴァ：A5 45戦 42.2% ／ A6 16戦 37.5% ／ 変化 −4.7pt\n・フェイド：A5 20戦 55.0% ／ A6 11戦 27.3% ／ 変化 −27.7pt\n・クローヴ：A5 16戦 56.2% ／ A6 13戦 69.2% ／ 変化 +13.0pt\n\n**フェイドの落ち込みは重要な発見だが、根本原因は未特定。** 前ACTのフェイドはKAST74.9%、攻撃ラウンド勝率53.6%、防衛51.4%。今ACTの勝率低下は、マップ構成・味方・敵・パッチ・運用・偶然の変動が考えられる。リコン即撃ちの観察は**ソーヴァ**に関するものであり、フェイドに直接転用しない。\n\n**前ACT：主なエージェントの戦闘指標（全てA5）**\n\n・ソーヴァ：試合 45 ／ 勝率 42.2% ／ K/D 0.97 ／ ADR 132.2 ／ ACS 191.8 ／ KAST 72.5% ／ 攻撃R勝率 45.6% ／ 防衛R勝率 52.5%\n・フェイド：試合 20 ／ 勝率 55.0% ／ K/D 0.95 ／ ADR 117.1 ／ ACS 178.5 ／ KAST 74.9% ／ 攻撃R勝率 53.6% ／ 防衛R勝率 51.4%\n・クローヴ：試合 16 ／ 勝率 56.2% ／ K/D 1.02 ／ ADR 150.9 ／ ACS 224.3 ／ KAST 76.8% ／ 攻撃R勝率 45.5% ／ 防衛R勝率 58.8%\n・レイナ：試合 8 ／ 勝率 62.5% ／ K/D 1.00 ／ ADR 128.4 ／ ACS 193.8 ／ KAST 70.7% ／ 攻撃R勝率 54.9% ／ 防衛R勝率 51.8%\n・サイファー：試合 9 ／ 勝率 33.3% ／ K/D 0.84 ／ ADR 118.1 ／ ACS 177.1 ／ KAST 65.9% ／ 攻撃R勝率 37.8% ／ 防衛R勝率 50.6%\n・フェニックス：試合 7 ／ 勝率 57.1% ／ K/D 1.10 ／ ADR 161.2 ／ ACS 242.4 ／ KAST 79.0% ／ 攻撃R勝率 51.4% ／ 防衛R勝率 55.9%\n・オーメン：試合 5 ／ 勝率 40.0% ／ K/D 1.22 ／ ADR 141.6 ／ ACS 216.3 ／ KAST 75.0% ／ 攻撃R勝率 46.2% ／ 防衛R勝率 50.9%\n\n**攻守の数値は勝ったラウンド数÷該当サイドのラウンド数**。試合の勝率と混同しない。\n\n**A6データでの再修正**：前ACTのフェニックス好調だけを頼りにするのは不適切。A6フェニックスは7戦2勝5敗、K/D0.84、ADR112.9、ACS172.7、KAST64.0%と急落した。一方サイファーはA6で6戦3勝3敗、K/D1.08、ADR141.3、ACS207.4、KAST76.5%・DDΔ+18へ改善。クローヴはA6で13戦9勝4敗・攻撃側ラウンド勝率58.1%。**今はVDKクローヴが第1候補、サイファー第2候補、ソーヴァは必要マップで索敵運用を立て直す候補**だ。ヴァイスはA6でも1戦1勝なのでサンプル不足、キャラ全体の評価には使わない。\n\n**共闘：Abema#ttv**","• Trackerのチームメイト一覧は、**Abema#ttvと52試合共闘、表示勝率50.0%、表示K/D1.12、平均順位4.6**と記載する。前回D1通知同士で同一試合を照合できなかった事実とは矛盾しない。Trackerが独立に共闘を認識したデータだ。\n• パーティー人数別：**ソロ86戦・42.2%・K/D0.92、デュオ14戦・50.0%・K/D0.94、トリオ56戦・48.1%・K/D0.91、5人8戦・50.0%・K/D0.94**と表示。\n• **パーティー内訳は164試合**となりA6の74試合と整合しない。52共闘試合がすべて二人だけの「デュオ」だったと断定できず、トリオや5人パーティーで共闘したケースを含み得る。集計期間も一致していない可能性がある。\n• **前提更新**：Abemaは従来クローヴをよく使用していたが、今後はロール変更可能（当事者情報）。VDKのクローヴは、A5・A6とも良い成績のため**デュオの最優先試験候補に戻す**。Abemaの他ロールの適性は未確認。\n• デュオ改善の評価軸は、**誰がスモークを担当するか、索敵・情報取得・エントリーの同期、トレード可能な距離、攻撃ラウンドのFB/FD**。VDK＝クローヴ時はVDKのスモーク＋Abemaの索敵／進入、VDK＝サイファー時はVDKの情報取得＋Abemaのスモーク／味方の進入を検証する。現PDFでは連携の成否は分からない。\n\n**効果測定の設計**\n\n**最初の10〜15試合**は対照条件を揃える。可能な限りAbemaと一緒の試合を分け、**VDK＝クローヴ／Abema＝別ロール**と**VDK＝サイファー／Abema＝クローヴなど**をマップごとに比較する（相方の習熟度も考慮）。各試合で（1）攻撃ラウンドFB/FD（2）ADR、ACS（3）KAST（4）スモーク＋索敵の使用目的・発動時刻・味方のアクション（5）人数有利時の不要な単独デスを記録し、**勝率だけでなく具体的なプレイ行動が改善したか**を評価する。\n\n**追加資料の出典**\n\n• ユーザー提供「Dolly#SDGs's Valorant Competitive Match History - Valorant Tracker 3.pdf」：V26:A6選択、TeammatesとParty Size Breakdown。\n• ユーザー提供「Dolly#SDGs's Competitive Agent Stats - Valorant Tracker.pdf」「同 2.pdf」「同 3.pdf」「同 4.pdf」：すべてV26:A5。出現回数・K/D・ADR・ACS、各サイドのラウンド勝率、KAST等。\n\n**デュオのロール配分テスト：3構成を比較**\n\n・A：第1候補：VDK クローヴ ／ Abema 別ロール（得意なイニシエーター等） ／ 根拠 VDKのクローヴはA6 13戦69.2%、A5 16戦56.2% ／ 検証課題 Abemaの新ロールで情報取得・進入が成立するか\n・B：第2候補：VDK サイファー ／ Abema クローヴ ／ 根拠 VDKのA6サイファー6戦50.0%、K/D1.08、ACS207.4、KAST76.5%、DDΔ+18 ／ 検証課題 攻撃側で得た情報をAbemaのスモーク・進入に活かせるか\n・C：条件付き：VDK ソーヴァ ／ Abema クローヴ等 ／ 根拠 A6ソーヴァ16戦37.5%、攻撃側ラウンド勝率50.6%／防衛側44.4% ／ 検証課題 リコンの目的・使用時刻・リテイク時の索敵連携を改善できるか","• **Aが第1候補なのはVDK本人のデータに基づく仮説**。A6でクローヴは13戦69.2%、サイファーは6戦50.0%。後者は好転したとはいえ試合数が少ない。Abemaのイニシエーター／デュエリスト／センチネル等の得手不得手は未入手なので、「Aが二人の最強構成」とは断定できない。\n• **比較の仕方**：同じマップ・近い味方構成・同程度の試合条件で、各案を原則4〜5戦ずつ試す。パッチ・相手レベル・パーティー人数の違いを記録し、少数試合の勝率だけで結論しない。デュオ以外の3人・5人パーティーは別集計する。\n• **戦術KPI**：攻撃初動FB/FD、ADR、ACS、KAST、リコン・スモーク・フラッシュの発動→味方の進入までの秒数、トレード不能デス、設置後の人数有利からの失点を記録。\n• **試合中の確認**：AではVDKがAbemaの索敵・進入にスモークを合わせる。BではVDKのカメラ等による情報共有とAbemaのスモーク／味方の進入を同期させる。役割名だけ交換しても連携の失敗は解消しない。\n• **追加で欲しいデータ**：Abema#ttvの今ACTエージェント別Stats（クローヴ以外の勝率・ADR・ACS・KAST、攻撃/防衛別）。これでA案の実現性が分かる。","**追加検証：相手のランク・マッチング強度による補正（最重要）**\n\n**再評価の結論**：A6クローヴ13試合・勝率69.2%とサイファー6試合・勝率50.0%の順位は、**相手の強さ、味方の強さ、マップ、パーティー人数、勝利時の上振れを調整していない、単なる生の観測値**。特に、弱い相手と当たった試合がクローヴに偏っていれば、クローヴが本当に適性上位とは言い切れない。前記の「第1候補／第2候補」は**検証着手順**であり、確定の実力序列ではない。\n\n**少数試合に伴う不確実性**\n\n• クローヴ：9勝4敗（13戦）＝**69.2%**、勝率の95% Wilson区間は**約42〜87%**。\n• サイファー：3勝3敗（6戦）＝**50.0%**、同区間は**約19〜81%**。\n• ソーヴァ：6勝10敗（16戦）＝**37.5%**、同区間は**約19〜61%**。\n\nこれは「真の勝率が必ずその範囲」という意味ではない。あくまで独立した同条件の試合を仮定した統計的な目安であり、実際のマッチ条件が異なる以上、各エージェント間の優劣を確定する根拠にはならない。**このデータだけでは「クローヴが強いから勝った」と「弱い敵と当たったから勝った」を分離できない。**\n\n**正確に区別すべきレート**\n\n• Riotの**非公開MMR（真のマッチングレーティング）**は公式から公開されない。Trackerに記録されるプレイヤーの**表示ランク**は代替指標であり、MMRと一致しない場合がある。表示ランクの平均を「平均MMR」と表記しない。\n• 試合ごとの**相手5人の当時の表示ランク**を入手できる範囲で記録し、相手5人の中央値・平均、チーム5人の平均とのランク差、ランクのばらつきを出す。過去最高ランクで代用しない。\n• 併せて**VDK本人の試合当時の表示ランク、マップ、パーティー人数、Abemaの参加・キャラ、相手チームのキャラ、試合スコア、RR増減、本人ACS/ADR/KAST/K/D**を記録する。\n• **敵の表示ランクが低くても非公開MMRが高いケース**や、味方の平均ランクが高くて勝ちやすいケースもある。敵側だけでなく**味方側も補正**する。\n\n**比較・検証手順**\n\n1. **今ACTの74試合の詳細ページ／試合リンクを取得**。そのうちまず、クローヴ13試合とサイファー6試合、ソーヴァ16試合を優先する。詳細に試合時点の表示ランクがなければ欠測として扱い、現在ランクで上書きしない。\n2. **ラベル付け**：相手チームの中央値がVDK当時のランクより低い／同程度／高い、味方・敵の平均ランク差、マップ、パーティー人数（ソロ／2人／3人／5人）、Abemaとの共闘、アクト内の時期。\n3. **まず層別比較**：同程度の相手・同じマップ・同じパーティー条件に限って、各キャラの勝率・ADR・ACS・KAST・初動FK/FD・ラウンド差を比較。各セルが少数なら順位付けしない。\n4. **さらに共闘の交絡を検討**：同一チームでのAbemaの実戦結果がある場合に限り、Abemaの参加有無・担当ロールごとに分ける。二人のロール交換はAbemaの習熟度による変化も含むため、勝率差をVDK個人のエージェント適性と即断しない。\n5. **勝率だけでなくプレイ指標を並べる**：例として低ランクの敵との大勝によってACSが上がっている場合、同程度以上の敵とのACS/ADR/KASTが維持できているかを見る。ただしロール差があるためACSの単純比較も最終結論にしない。\n6. **サンプルが足りなければ「未確定」を許容**：74試合をマップ×エージェント×相手レベル×パーティー別に分けると極端に少なくなる。複雑な多変量回帰で見かけの精度を出すより、比較可能な試合を収集し、試合ごとの判断ミス・スキル連携をVODで確認する。","**投稿に入れるべき暫定判定**\n\n**「今ACTのクローヴは勝率69.2%で最初の検証候補。ただし相手の強さやデュオ・マップ構成が未補正なので、『VDKにはクローヴが最適』との確定判定はしない。サイファーも同様。ソーヴァ／フェイドの低勝率も、厳しい相手との対戦が偏った可能性を排除できない。」**\n\n**追加で必要なもの**：今ACTの**試合詳細ページURL（まずクローヴ13戦＋サイファー6戦）**、または各試合のスコアボードでチーム10人のランクとキャラが読み取れる画面。これが相手レベルの偏りを確認する最短経路だ。","**8. 断定してはいけない領域**\n\n• PDFからは試合ごとのエージェント・マップ・デュオのクロス集計、攻守別の各マップ、正確なトレード機会数、索敵後のキル転換率、リコンの使用時刻、ファーストデス時の状況、VC、ピーク・ストッピング・クロスヘア動作、味方や相手のレーティングは取得できない。\n• Abema#ttvは以前クローヴを使っていたがロール変更可能という当事者情報がある。Trackerは52試合の共闘を表示する一方、KESO PLAYのD1上では同一試合を照合できなかった。共闘52試合は二人だけのデュオ52試合と同義ではない。Abema自身のロール別戦績も不明。\n• Tracker PDFの現在ランク表記はプラチナ3。プラチナ2降格通知との時点は一致しないため、**「現時点でもプラチナ2」と決めつけない**。\n• 「クラッチ29」と「クラッチ32」の表示の不整合、「アビス2勝8敗」と16.7%の分母不明には注記する。","**結論**\n\n**VDKの弱点を「エイム不足」だけにするのはデータへの反逆だ。** 今ACTで明確なのは、相対的に高いHS率と、低いACS/ADR、攻撃側の初動負け越し、得意不得意の大きいロール・マップ、直近20戦の指標低下である。\n\n**Abemaはロール変更可能だ。** VDKのクローヴがA5・A6で比較的好調なので、まず**VDK＝クローヴ／Abema＝別ロール**を検証し、**VDK＝サイファー／Abema＝クローヴ**と比較する。ソーヴァは必要なマップに絞り、リコンを「再使用可能になったから撃つ」から「味方の進入や判断を変えるために撃つ」へ変える。A6で調子を落としたフェニックスを、前ACTの数値だけで優先しない。\n\n次は試合録画1本から、人数有利時の単独デス、攻撃のファーストデス、索敵から味方が動くまでの秒数を直接検証するのが最も有益である。\n\n_出典：提供された「Dolly#SDGs's Valorant Competitive Match History - Valorant Tracker.pdf」「同 2.pdf」（いずれも1ページの縦長スクリーンPDF）。V26:A6競技モード概要。ユーザー提供のAbema#ttvによる実戦観察は別記。_"];
          // Verify every player-facing name has been localized before any Discord API call.
          const nonJapaneseNames=["Corrode","Abyss","Sunset","Haven","Bind","Lotus","Summit","Sova","Fade","Clove","Phoenix","Cypher","Skye","Omen","Vyse","Raze","Jett","Tejo","Reyna","unrated_normal","death_spikerush","skirmish_2v2","spikerush","competitive","deathmatch","escalation","unrated","swiftplay","hurm"];
          if(parts.some(post=>nonJapaneseNames.some(name=>new RegExp('\\b'+name+'\\b').test(post))))throw Error('Untranslated VALORANT map / agent / mode name');
          const token=process.env.DISCORD_BOT_TOKEN;
          const channelId='1571645754903371899';
