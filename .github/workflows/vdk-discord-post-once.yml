name: VDK rescue Discord one-off verified post
on:
  push:
    branches: [feat/vdk-factual-coaching-report]
    paths: ['.github/workflows/vdk-discord-post-once.yml']
permissions:
  contents: read
jobs:
  post:
    if: github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Publish full recorded coaching report to rescue channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const parts=["🆘 **【プラチナ2降格記念】今回はVDKを救いたい。**\n**第1回・ガチ戦績審査／Dolly#SDGs**\n笑って終わる降格号外はもういらない。KESO PLAYに保存された全44コンペ試合から、良い点・弱点・復帰のための対策を徹底洗い出しした。\n\n🔎 **監視コンペ44戦：17勝26敗1分／勝率39.5%**\n実際の勝率は**39.5%**（引分除外）。KD **0.84**、547K/651D/263A、平均ACS **180.9**、試合別HS率平均 **28.9%**。\n直近20戦：9勝11敗／KD0.8／ACS165.3／HS29.5%\n直近10戦：4勝6敗／KD0.78／ACS162.7／HS30.8%\n⚠️ 敗北26戦中、7ラウンド差以上の大差負けが**12戦**。\n\n**結論：HS率だけ上げても救えない。エージェントの勝ち筋、負け展開の貢献、大差負けの立て直しを最優先で検証するべきだ。**\n11/15 06:25 JSTにカロード/フェイドで9-13敗戦→プラ3からプラ2へ降格。**16K14D9A・ACS208・HS42.4%**なので、最終戦を単純な撃ち負けと片付けるのは誤り。\n\n🧵 続きに全12エージェント・全7マップ・最優先の改善指示・全44戦の付録を掲載。\n-# VDK-RESCUE-DOLLY-20261116-44GAMES-VERIFIED","🎭 **① エージェント別の全実績（コンペ）**\n・ソーヴァ：10戦 4勝5敗1分／勝率44.4%／KD0.77／ACS157.2\n・フェイド：9戦 1勝8敗／勝率11.1%／KD0.83／ACS176.3\n・クローヴ：9戦 6勝3敗／勝率66.7%／KD0.9／ACS215.4\n・フェニックス：4戦 2勝2敗／勝率50%／KD1.09／ACS207.5\n・サイファー：4戦 1勝3敗／勝率25%／KD0.94／ACS194.5\n・スカイ：2戦 0勝2敗／勝率0%／KD0.52／ACS136\n・オーメン：1戦 1勝0敗／勝率100%／KD0.91／ACS188\n・ヴァイス：1戦 1勝0敗／勝率100%／KD1.85／ACS297\n・レイズ：1戦 0勝1敗／勝率0%／KD0.74／ACS192\n・ジェット：1戦 0勝1敗／勝率0%／KD0.4／ACS105\n・テホ：1戦 1勝0敗／勝率100%／KD0.42／ACS96\n・レイナ：1戦 0勝1敗／勝率0%／KD0.4／ACS105\n\n⚠️ 1〜4試合の勝率は極端になりやすい。9〜10試合ある主要キャラの比較を先に使う。\n🔴 **フェイド：9戦1勝8敗（11.1%）**　🟢 **クローヴ：9戦6勝3敗（66.7%）**\nクローヴは平均アシスト9.0、フェイドは6.1。役割差や味方・相手の違いはあるが、クローヴの方が結果につながっている事実は重い。","🗺️ **② マップ別の全実績（コンペ）**\n・カロード：12戦 5勝7敗／勝率41.7%／KD1.04／ACS213.3\n・アビス：7戦 2勝4敗1分／勝率33.3%／KD0.69／ACS143.3\n・サンセット：7戦 4勝3敗／勝率57.1%／KD0.86／ACS190.3\n・ヘイヴン：5戦 1勝4敗／勝率20%／KD0.77／ACS170.6\n・バインド：5戦 0勝5敗／勝率0%／KD0.69／ACS176.2\n・ロータス：4戦 2勝2敗／勝率50%／KD0.76／ACS165.3\n・サミット：4戦 3勝1敗／勝率75%／KD0.8／ACS168\n\n🔬 **マップ×エージェントの深掘り**\n・カロード × フェイド：**0勝5敗**／68K/80D／平均ACS174\n・カロード × クローヴ：**3勝1敗**／平均ACS257\n・ヘイヴン × ソーヴァ：**0勝4敗**／KD0.60\nカロード自体のKDは1.04。単純に「このマップでは撃てない」とは言えない。**キャラと運用の組合せ**を優先して映像比較だ。\nバインドは0勝5敗、アビスはKD0.69。攻撃/守備のどちらに原因があるかは現データでは不明。","✅ **③ 救える根拠：実際に良い点**\n① HS率は全44戦平均28.9%、直近10戦平均30.8%。少なくともHS率が直近で低下しているわけではない。\n② 勝利した17戦ではKD**1.12**・平均ACS**201.9**。勝つときに戦闘出力を上げられる。\n③ Clove9戦6勝3敗、平均ACS215.4・平均9アシスト/試合。一定の再現性の手掛かりがある。\n④ カロードではKD1.04・ACS213.3。火力が出る条件を作れる。\n⑤ サンセットは4勝3敗。KD0.86でも勝ち越せるため、K/Dが1未満＝全て悪いわけではない。\n⑥ 降格した最終戦もKD1超・HS42.4%。**負けを本人の射撃精度だけで説明するのは不適切。**\n\n🚨 **④ 数字からはっきり見える課題**\nA. 敗戦時KD**0.7**・平均ACS**166.8**。勝利時のKD1.12/ACS201.9との落差が大きい。\nB. 平均デスが勝ち12回→負け16.5回へ増加。負け展開の生存とトレードを要検証。\nC. HS率は勝利時29.1% vs 敗北時28.8%。ほぼ差がない。**HS率を唯一の課題にするのは遠回り。**\nD. 大差負け12件/26敗。対策失敗後の適応ができているか、各試合の序盤を見直す。\nE. 44戦中15戦でACS150未満。戦術理解と実行が不安定な可能性があるが、具体的原因はVOD待ち。","⏱️ **⑤ 降格に至った直近セッション**\n11/14 23:28〜11/15 06:25 JSTの9コンペは**3勝6敗**、使用エージェントは**6種類**。\n・11/15 01:18 ヘイヴン/ソーヴァ：4-13敗、**3K16D5A・ACS76・HS44.4%**\n・11/15 04:13 カロード/フェイド：1-13敗、**3K14D1A・ACS85**\n・11/15 05:43 ロータス/スカイ：1-13敗、**8K14D2A・HS43.8%**\n・11/15 06:25 カロード/フェイド：9-13敗、16K14D9A・HS42.4%でプラ2降格。\n\nHS44%でもACS76になり得る。つまり「当てられるか」よりも、適切な位置で撃てているか、撃つ機会を作れているかを検証する価値がある。\n9戦6キャラを回すこと自体が失敗の証拠ではない。ただし負けているときほど、キャラを固定して課題を再現・検証した方が改善速度は上がりやすい。\n睡眠・疲労・メンタルを原因だと決めつけない。","🛠️ **⑥ 復帰への指示・優先度S（最重要）**\n**S1｜次の10〜15コンペはクローヴを主軸に固定。** サブ1体まで。フェイドは映像で敗因の切り分けが済むまで優先度を下げる。1試合ごとのK/Dより10戦の勝率・ACS・アシストを測る。\n**S2｜カロードでのFade0勝5敗をすべてVODレビュー。** それぞれ最初の3デスについて「索敵位置／味方の立ち位置／ピーク開始／トレード可能距離」を記録。Clove3勝1敗と比べる。\n**S3｜Bind0勝5敗の対策作り。** 攻守それぞれ固定セットアップ2つ＋崩されたときの代替1つ。なぜ最初の人数不利になったかを毎ラウンド分類する。\n**S4｜ヘイヴン×Sova0勝4敗、アビスの低KDを検証。** 索敵を入れた後に誰がアクションしたかを追う。索敵自体の回数ではなく、その情報がエリア取得・キル・撤退に結び付いたかを測る。\n**S5｜大差負けの立て直しを習慣化。** 0-3または2-6の時点で、敵の定番パターンと自分たちが落としている射線を短く共有。次のラウンドで必ず変更点を1つ設ける。","🎯 **⑦ 復帰への指示・優先度A/B**\n**A6｜トレード不能のデスを減らす。** 特に5v3・4v2・設置後は、味方と同じ時間に撃ち合える場所を優先。不要な単独再ピークを記録する。\n**A7｜各試合、最初の5デスを仕分ける。** 「単独ピーク／複数射線／索敵不足／スキル同期不足／エイム／時間管理」。最も多い1原因を練習テーマにする。\n**A8｜HS率だけに逃げない。** 直近10戦HS30.8%でもKD0.78。クロスヘア、停止タイミング、ピーク幅、相手の位置、撃ち合いの必要性を録画で確認する。\n**B9｜大敗2回で一度レビュー。** 7R差以上の敗北が2試合出たら再キュー前に3ラウンドだけ見返し、修正する行動を1つ決める。疲労を断定せず判断精度を守るためのルール。\n**B10｜次の15戦を検証期間に。** 暫定目標は勝率50%以上、KD0.95以上、平均ACS185以上、7R差以上の大敗比率減少。15戦は偶然に左右されるため30戦でも再評価する。\n\n🎥 **VOD最優先3本**：①カロード/Fade1-13、②ヘイヴン/Sova4-13、③ロータス/Skye1-13。\n各場面で「敵と味方の位置→利用可能スキル→自分が選んだ行動→代替行動」を照合する。","🔍 **⑧ 今回のデータで判定できないこと**\nKAST、ADR、FK/FD、トレード率、攻守別勝率、経済・ULT・スキルの有効性、VC、ピーク・ストッピング・クロスヘアの挙動、相手のランク。\n**これらを数値の印象だけで「悪い」と断定するのはコーチングではない。** 本当の欠点を確定するにはVODが必要。\nまた、KESO PLAYが記録するACSと、2026年秋導入のRiot公式Performance Scoreは別指標なので、混同しない。\n\n🏁 **救済委員会の判決**\nVDKに必要なのは単なるエイム練習100本ではない。**クローヴでできている勝ち方を固定し、カロード×フェイド・バインド・ヘイヴン×ソーヴァの負け筋を録画で解き、大差負けからの切替を習慣にすることだ。**\n人格を評価するのではなく、何をしたら勝率が上がるかを追跡する。プラチナ3への復帰は、ここから検証できる。","📊 **⑨ 競技以外の全モード（別集計。ランク評価には混ぜない）**\n・スパイクラッシュ：121戦／70勝51敗\n・コンペティティブ：44戦／17勝26敗\n・デスマッチ：12戦\n・チームデスマッチ：9戦／2勝7敗\n・エスカレーション：8戦／1勝7敗\n・アンレート：4戦／2勝2敗\n・スイフトプレイ：4戦／2勝2敗\n・スカーミッシュ（2対2）：3戦／1勝2敗\n・アンレート（通常）：2戦／0勝2敗\n・デススパイクラッシュ：1戦／1勝0敗\n\n📋 **⑩ 監視済みコンペ全44試合の付録**\n表記：JST日時｜○勝×敗△引分｜マップ｜キャラ｜K/D/A｜ACS｜HS率｜ラウンド","11-15 06:25 × カロード フェイド 16/14/9 ACS208 HS42.4% 9-13\n11-15 05:43 × ロータス スカイ 8/14/2 ACS156 HS43.8% 1-13\n11-15 05:15 ○ アビス オーメン 21/23/7 ACS188 HS39.6% 17-15\n11-15 04:13 × カロード フェイド 3/14/1 ACS85 HS21.1% 1-13\n11-15 03:44 ○ サンセット ソーヴァ 19/16/9 ACS240 HS30.2% 13-8\n11-15 02:35 × サンセット フェニックス 13/24/2 ACS114 HS23.1% 16-18\n11-15 01:18 × ヘイヴン ソーヴァ 3/16/5 ACS76 HS44.4% 4-13\n11-15 00:15 × バインド スカイ 8/17/6 ACS116 HS23.1% 8-13\n11-14 23:28 ○ カロード ヴァイス 24/13/3 ACS297 HS27.3% 13-9\n11-13 03:09 ○ サミット ソーヴァ 10/10/5 ACS147 HS13.3% 13-5\n11-13 02:32 × バインド フェイド 10/16/4 ACS145 HS26.9% 7-13\n11-13 01:55 ○ カロード フェニックス 11/10/4 ACS164 HS40% 13-6\n11-13 01:20 ○ サンセット ソーヴァ 9/15/3 ACS131 HS32.1% 13-9\n11-12 03:37 ○ アビス ソーヴァ 3/7/5 ACS84 HS30% 10-3\n11-12 03:12 ○ サミット クローヴ 12/16/8 ACS177 HS30.8% 13-8\n11-12 02:34 × カロード フェイド 20/17/8 ACS225 HS27.1% 10-13\n11-12 01:51 × サンセット レイズ 14/19/3 ACS192 HS15.5% 11-13\n11-12 01:07 × サミット フェイド 6/14/5 ACS154 HS26.9% 2-13\n11-12 00:33 ○ サンセット フェニックス 21/7/5 ACS304 HS29.8% 13-5\n11-11 23:57 × カロード フェイド 8/17/5 ACS103 HS22.7% 6-13\n11-09 02:29 × アビス ジェット 6/15/1 ACS105 HS27.8% 3-13\n11-09 02:02 ○ ヘイヴン サイファー 13/4/8 ACS261 HS26.3% 13-1\n11-09 01:34 × ロータス フェイド 17/16/9 ACS224 HS15.6% 8-13\n11-09 00:57 ○ ロータス テホ 5/12/7 ACS96 HS10.3% 13-5\n11-09 00:22 ○ カロード クローヴ 11/17/7 ACS143 HS17.1% 13-8\n11-08 23:44 × ヘイヴン ソーヴァ 15/14/6 ACS202 HS44.8% 9-13\n11-08 23:01 × カロード サイファー 16/16/3 ACS200 HS28.6% 9-13\n11-08 22:24 × アビス サイファー 7/14/4 ACS143 HS13.8% 2-13\n11-08 21:56 × バインド クローヴ 15/23/11 ACS198 HS22.8% 11-13\n11-08 21:14 × アビス ソーヴァ 12/16/5 ACS186 HS33.3% 6-13\n11-08 20:40 ○ サンセット クローヴ 16/17/10 ACS206 HS35.6% 13-9\n11-07 01:11 × ヘイヴン ソーヴァ 7/15/6 ACS156 HS50% 3-13\n11-05 23:29 ○ カロード クローヴ 15/11/5 ACS221 HS40% 13-4\n11-01 00:48 ○ カロード クローヴ 20/11/13 ACS395 HS35.3% 13-2","11-01 00:17 × バインド サイファー 10/15/2 ACS174 HS25.7% 4-13\n10-31 18:07 × ヘイヴン ソーヴァ 11/15/5 ACS158 HS28% 6-13\n10-31 17:32 × バインド フェニックス 17/16/5 ACS248 HS31.1% 9-13\n10-31 16:46 ○ サミット フェイド 9/6/3 ACS194 HS30.4% 11-1\n10-29 00:39 ○ ロータス クローヴ 9/9/12 ACS185 HS27.3% 13-3\n10-29 00:07 × カロード クローヴ 21/20/10 ACS269 HS32.1% 9-13\n10-27 00:43 × サンセット クローヴ 10/20/5 ACS145 HS17.1% 9-13\n10-26 23:13 × アビス レイナ 6/15/4 ACS105 HS23.8% 6-13\n10-25 04:48 × カロード フェイド 21/18/11 ACS249 HS37.3% 12-14\n10-25 04:02 △ アビス ソーヴァ 19/17/12 ACS192 HS29.6% 15-15","📚 **集計の出典と注意点**\n出典：KESO PLAYの試合通知データ（本番D1）を2026/11/16 08:10 JSTに読み取り専用で取得したもの。\n監視開始は2026/10/25ごろで、過去の全キャリアを網羅したものではない。44件はこの期間に保存されたコンペ全件。\nHS率28.9%は**試合別HS率の単純平均**であり、全弾を重み付けしたHS率ではない。\n勝敗やK/Dは観測事実。戦術上の因果関係や本当の降格理由は録画とチーム状況を確認してから確定する。\n検証ログ：https://github.com/altepop/keso-gamble/actions/runs/43773371053"];
          // Verify every player-facing name has been localized before any Discord API call.
          const nonJapaneseNames=["Corrode","Abyss","Sunset","Haven","Bind","Lotus","Summit","Sova","Fade","Clove","Phoenix","Cypher","Skye","Omen","Vyse","Raze","Jett","Tejo","Reyna","unrated_normal","death_spikerush","skirmish_2v2","spikerush","competitive","deathmatch","escalation","unrated","swiftplay","hurm"];
          if(parts.some(post=>nonJapaneseNames.some(name=>new RegExp('\\b'+name+'\\b').test(post))))throw Error('Untranslated VALORANT map / agent / mode name');
          const token=process.env.DISCORD_BOT_TOKEN;
          const channelId='1571645754903371899';
          const marker='VDK-RESCUE-DOLLY-20261116-44GAMES-VERIFIED';
          if(!token)throw Error('Bot secret unavailable');
          async function send(path,method='GET',body){
            for(let i=0;i<4;i++){
              const res=await fetch('https://discord.com/api/v10'+path,{
                method,headers:{Authorization:'Bot '+token,...(body?{'Content-Type':'application/json'}:{})},
                body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});
              if(res.status===429){const rate=await res.json();await new Promise(done=>setTimeout(done,Math.min(12000,(rate.retry_after||1)*1000)));continue;}
              if(!res.ok)throw Error('Discord API HTTP '+res.status+' '+(await res.text()).slice(0,120));
              return res.json();
            }
            throw Error('Discord rate limit');
          }
          const ch=await send('/channels/'+channelId);
          if(![0,5].includes(ch.type))throw Error('Target is not a text channel. Type='+ch.type);
          console.log('CHANNEL_VERIFIED '+ch.name);
          try{
            const recent=await send('/channels/'+channelId+'/messages?limit=60');
            const exists=recent.find(x=>x.author?.bot&&String(x.content).includes(marker));
            if(exists){console.log('ALREADY_POSTED '+exists.id);process.exit(0);}
          }catch(e){console.log('HISTORY_CHECK_UNAVAILABLE');}
          if(parts.some(p=>p.length>1900))throw Error('Message too long');
          const first=await send('/channels/'+channelId+'/messages','POST',{content:parts[0],allowed_mentions:{parse:[]}});
          let destination=channelId,thread='';
          try{
            const result=await send('/channels/'+channelId+'/messages/'+first.id+'/threads','POST',{
              name:'VDK救済委員会｜プラチナ2降格・実戦44試合ガチレビュー',auto_archive_duration:1440});
            thread=result.id;destination=result.id;
          }catch(e){console.log('THREAD_CREATION_UNAVAILABLE, fallback channel messages');}
          for(const content of parts.slice(1)){
            await send('/channels/'+destination+'/messages','POST',{content,allowed_mentions:{parse:[]}});
          }
          console.log('VDK_REPORT_POSTED '+JSON.stringify({parts:parts.length,mainId:first.id,threadId:thread,
            url:'https://discord.com/channels/'+ch.guild_id+'/'+channelId+'/'+first.id}));
          NODE
