# Temporary branch-local cache-sync workflow, removed once hash check succeeds.
name: Duel realtime budgeted cache hash validation
on:
  push:
    branches:
      - feat/duel-realtime-sse-gateway-20261119
    paths:
      - .github/workflows/duel-realtime-release-hash-check.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build browser release URLs and check client SSE test
        run: |
          npm run build:activity
          npm run check:activity
          node --test tests/kp-client.test.js
      - name: Commit only browser import hash changes
        run: |
          git add js index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): sync buffered SSE fallback import versions'
          git push origin HEAD:refs/heads/feat/duel-realtime-sse-gateway-20261119
