name: Hit & Blow one-shot cache build
on:
  push:
    branches:
      - feat/duel-hitblow-tactile-ux-20261119
    paths:
      - .github/workflows/hitblow-cache-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/duel-hitblow-tactile-ux-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check private hand and input invariants
        run: node --test tests/duel-hitblow-quality.test.js
      - name: Generate and verify version-pinned Activity imports
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit safe Activity cache graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html duel-demo.html js/
          if ! git diff --cached --quiet; then
            git commit -m 'build(hitblow): synchronize Activity cache graph for tactile game UI'
            git push origin HEAD:feat/duel-hitblow-tactile-ux-20261119
          fi
