name: One-time Ishihara voice receipt diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ishihara-voice-diagnosis-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read only Ishihara matching account voice ledger and equipment
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!/^[a-f0-9]{32}$/i.test(account??''))throw Error('Cloudflare read credentials unavailable');
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token};
          const settingResponse=await fetch(root+'/workers/scripts/valorant-results/settings',{headers,signal:AbortSignal.timeout(25000)});
          if(!settingResponse.ok)throw Error('Cannot inspect existing Worker binding, HTTP '+settingResponse.status);
          const settings=await settingResponse.json();
          const db=settings.result?.bindings?.find(b=>b.type==='d1'&&b.name==='DB')?.id;
          if(!settings.success||!/^[a-f0-9-]{36}$/i.test(db??''))throw Error('Production D1 unavailable');
          const now=Date.now(),hour=now-3600000,six=now-6*3600000,day=now-86400000;
          // Names and account IDs are never printed; only the explicitly requested member's aggregate KP and equipped relic identifiers.
          const target="SELECT guild,user FROM kp_accounts WHERE lower(riot) LIKE 'h1d3g1g4s#%' GROUP BY guild,user";
          const sqls={
            account:`WITH t AS (${target}) SELECT COUNT(*) AS linkedAccounts FROM t`,
            loadout:`WITH t AS (${target}) SELECT w.balance AS spendable,
              json_extract(s.data,'$.relics.equipped') AS equipped,
              json_extract(s.data,'$.relics.loadoutChangedAt') AS changedAt,
              (SELECT COUNT(*) FROM kp_debts d WHERE d.guild=t.guild AND d.user=t.user AND d.amount>0) AS hasDebt,
              json_extract(s.data,'$.relics.items."normal.voice.riddle.three".count') AS threeCount,
              json_extract(s.data,'$.relics.items."normal.voice.riddle.five".count') AS fiveCount,
              json_extract(s.data,'$.relics.items."normal.voice.riddle.fifteen".count') AS fifteenCount,
              json_extract(s.data,'$.relics.items."normal.voice.riddle.crown".count') AS crownCount,
              json_extract(s.data,'$.relics.items."normal.voice.alarm".count') AS alarmCount
              FROM t JOIN kp_state s ON s.guild=t.guild AND s.user=t.user
              JOIN kp_wallets w ON w.guild=t.guild AND w.user=t.user LIMIT 2`,
            slots:`WITH t AS (${target}), v AS (
              SELECT e.user,e.guild,e.at,e.id,e.slot FROM kp_voice_events e WHERE e.at>=${day}
              UNION ALL SELECT e.user,e.guild,e.at,e.id,e.slot FROM kp_voice_events_ext e WHERE e.at>=${day}
            ) SELECT COUNT(*) AS slots24h,
              COALESCE(SUM(CASE WHEN v.at>=${six} THEN 1 ELSE 0 END),0) AS slots6h,
              COALESCE(SUM(CASE WHEN v.at>=${hour} THEN 1 ELSE 0 END),0) AS slots1h,
              MAX(v.at) AS latestVoiceAt,
              COALESCE(SUM(CASE WHEN v.at>=${six} AND v.slot%4=0 THEN 1 ELSE 0 END),0) AS triggerSlots6h,
              COALESCE(SUM(CASE WHEN b.id IS NULL THEN 1 ELSE 0 END),0) AS missingBase,
              COALESCE(SUM(CASE WHEN a.id IS NULL THEN 1 ELSE 0 END),0) AS missingPlus10
              FROM t JOIN v ON t.user=v.user AND t.guild=v.guild
              LEFT JOIN kp_ledger b ON b.id=v.id
              LEFT JOIN kp_ledger a ON a.id='bonus:'||v.id`,
            relic:`WITH t AS (${target}) SELECT COUNT(*) AS relicCount24h,
              COALESCE(SUM(CASE WHEN l.at>=${six} THEN 1 ELSE 0 END),0) AS relicCount6h,
              COALESCE(SUM(CASE WHEN l.at>=${hour} THEN 1 ELSE 0 END),0) AS relicCount1h,
              COALESCE(SUM(CASE WHEN l.at>=${six} THEN l.delta ELSE 0 END),0) AS relicKP6h,
              COALESCE(SUM(CASE WHEN l.at>=${hour} THEN l.delta ELSE 0 END),0) AS relicKP1h,
              MAX(l.delta) AS largestRelic,MAX(l.at) AS lastRelicAt
              FROM t JOIN kp_ledger l ON l.guild=t.guild AND l.user=t.user
              WHERE l.id>='relic:voice:' AND l.id<'relic:voice;' AND l.at>=${day}`,
            money:`WITH t AS (${target}) SELECT
              COALESCE(SUM(CASE WHEN l.at>=${six} AND l.delta>0 THEN l.delta ELSE 0 END),0) AS totalIn6h,
              COALESCE(SUM(CASE WHEN l.at>=${six} AND l.delta<0 THEN -l.delta ELSE 0 END),0) AS totalOut6h,
              COALESCE(SUM(CASE WHEN l.at>=${hour} AND l.delta>0 THEN l.delta ELSE 0 END),0) AS totalIn1h,
              COALESCE(SUM(CASE WHEN l.at>=${hour} AND l.delta<0 THEN -l.delta ELSE 0 END),0) AS totalOut1h
              FROM t JOIN kp_ledger l ON l.guild=t.guild AND l.user=t.user AND l.at>=${six}`
          };
          async function read(label,sql){
            const r=await fetch(root+'/d1/database/'+db+'/query',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(25000)});
            const data=await r.json().catch(()=>({}));
            if(!r.ok||!data.success||!data.result?.[0]?.success)throw Error('D1 SELECT '+label+' unavailable '+r.status+' '+JSON.stringify((data.errors??[]).map(x=>({code:x.code,message:String(x.message??'').slice(0,150)}))));
            return data.result[0].results??[];
          }
          const matches=await read('account',sqls.account);
          console.log('diagnosis account '+JSON.stringify(matches[0]??{}));
          if(matches[0]?.linkedAccounts!==1){console.log('diagnosis end account-not-unique; no unrelated wallet details inspected');process.exit(0);}
          for(const [label,sql] of Object.entries(sqls)){
            if(label==='account')continue;
            console.log('diagnosis '+label+' '+JSON.stringify(await read(label,sql)));
          }
          NODE
