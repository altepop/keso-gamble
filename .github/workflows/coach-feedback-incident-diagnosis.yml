name: Incident feedback diagnostic (read only)
on:
  push:
    branches: ['audit/coach-feedback-stop-20261124']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Inspect new competitive receipts and replay diagnostics (D1 SELECT only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(a??'')||!t)throw Error('missing_credentials');
          const base='https://api.cloudflare.com/client/v4/accounts/'+a;
          const headers={Authorization:'Bearer '+t,'Content-Type':'application/json'};
          const settings=await fetch(base+'/workers/scripts/valorant-results/settings',{headers,redirect:'error'});
          if(!settings.ok)throw Error('settings');
          const cfg=await settings.json(),db=cfg.result?.bindings?.filter(x=>x.type==='d1'&&x.name==='DB');
          if(!cfg.success||db?.length!==1)throw Error('db_binding');
          let reads=0,queries=0;
          async function select(sql,params=[]){
            if(!/^SELECT\s/i.test(sql.trim())||sql.includes(';'))throw Error('not_select');
            const r=await fetch(base+'/d1/database/'+db[0].id+'/query',{method:'POST',headers,redirect:'error',
              body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error('d1_http_'+r.status);
            const v=await r.json(),q=v.result?.[0];
            if(!v.success||!q?.success||!Array.isArray(q.results))throw Error('d1_query');
            reads+=q.meta?.rows_read??0;queries++;
            return q.results;
          }
          const cutoff=Date.parse('2026-11-24T02:33:00+09:00'),now=Date.now();
          const rows=await select([
           "SELECT n.riot_id,n.match_id,n.ended_at,n.outcome,n.sent,n.mode,r.map,r.recorded_at AS roster_recorded,",
           "e.recorded_at AS events_recorded,CASE WHEN e.rounds_json IS NOT NULL THEN 1 ELSE 0 END AS rounds_saved,",
           "CASE WHEN e.kills_json IS NOT NULL THEN 1 ELSE 0 END AS kills_saved,",
           "a.subject_id,p.owner_user,c.joined,c.version,np.enabled,np.consent_version,",
           "s.value AS receipt,d.value AS replay_result",
           "FROM notifications n LEFT JOIN valorant_match_rosters r ON r.match_id=n.match_id",
           "LEFT JOIN valorant_match_round_events e ON e.match_id=n.match_id",
           "LEFT JOIN tracked_players t ON lower(t.riot_id)=lower(n.riot_id)",
           "LEFT JOIN coach_profile_accounts a ON a.puuid=t.puuid",
           "LEFT JOIN coach_profiles p ON p.guild=a.guild AND p.subject_id=a.subject_id",
           "LEFT JOIN coach_team_consents c ON c.guild=p.guild AND c.subject_id=p.subject_id AND c.owner_user=p.owner_user AND c.team_id='coach-roster-v1'",
           "LEFT JOIN coach_team_notice_preferences np ON np.guild=c.guild AND np.subject_id=c.subject_id AND np.owner_user=c.owner_user AND np.team_id=c.team_id",
           "LEFT JOIN monitor_state s ON s.key='coach_personal_feedback:v1:'||a.subject_id||':'||n.match_id",
           "LEFT JOIN monitor_state d ON d.key='coach_feedback_replay_result:v1:'||n.match_id",
           "WHERE n.mode='competitive' AND (n.ended_at>=? OR r.recorded_at>=?)",
           "ORDER BY n.ended_at DESC LIMIT 100"
          ].join(' '),[cutoff,cutoff]);
          const orphan=await select("SELECT r.match_id,r.ended_at,r.recorded_at,r.map FROM valorant_match_rosters r WHERE r.recorded_at>=? AND NOT EXISTS(SELECT 1 FROM notifications n WHERE n.match_id=r.match_id AND n.mode='competitive') ORDER BY r.recorded_at DESC LIMIT 50",[cutoff]);
          const health=await select("SELECT feature,last_ok,last_error,failures,error FROM kp_health WHERE feature IN ('coach_personal_feedback_replay','valorant')");
          const pending=await select([
           "SELECT n.match_id,n.riot_id,n.ended_at FROM notifications n",
           "JOIN tracked_players t ON lower(t.riot_id)=lower(n.riot_id)",
           "JOIN coach_profile_accounts a ON a.puuid=t.puuid",
           "WHERE n.mode='competitive' AND n.ended_at BETWEEN ? AND ?",
           "AND NOT EXISTS(SELECT 1 FROM monitor_state s WHERE s.key='coach_personal_feedback:v1:'||a.subject_id||':'||n.match_id)",
           "ORDER BY n.ended_at DESC LIMIT 24"
          ].join(' '),[now-86400000,now]);
          const time=x=>Number.isFinite(Number(x))&&Number(x)>0?new Date(Number(x)).toISOString():null;
          const parse=x=>{try{return x?JSON.parse(x):null}catch{return null}};
          const name=riot=>/^dolly#sdgs$/i.test(riot)?'VDK':/^h1d3g1g4s#1037$/i.test(riot)?'石原':/^abema#ttv$/i.test(riot)?'Abema':String(riot||'unknown').replace(/#.*$/,'');
          const data=rows.map(r=>{
            const receipt=parse(r.receipt),diagnostic=parse(r.replay_result);
            return {member:name(r.riot_id),matchId:r.match_id,map:r.map??null,endedAt:time(r.ended_at),
             rosterRecordedAt:time(r.roster_recorded),eventsRecordedAt:time(r.events_recorded),
             outcome:r.outcome,noticeSent:r.sent===1,noticePostedAt:null,noticeTimestampReason:'notifications.sent has no timestamp column',
             roundsSaved:r.rounds_saved===1,killsSaved:r.kills_saved===1,
             identityLinked:!!r.subject_id,consentJoined:r.joined===1,noticeEnabled:r.enabled===1,
             noticeConsentCurrent:r.consent_version===r.version,
             receipt:receipt?.state??'none',postedAt:receipt?.state==='posted'&&receipt?.messageId&&/^\d{17,22}$/.test(receipt.messageId)?time(Number((BigInt(receipt.messageId)>>22n)+1420070400000n)):null,
             replayStatus:diagnostic?.status??null,replayAttemptAt:time(diagnostic?.at),
             inReplayTop24:pending.some(x=>x.match_id===r.match_id),
             secondsSinceEnd:Math.round((now-Number(r.ended_at))/1000)};
          });
          console.log('COACH_NEW_MATCHES_READONLY '+JSON.stringify({at:new Date().toISOString(),cutoff:new Date(cutoff).toISOString(),rows:data,orphanRosters:orphan.map(r=>({...r,ended_at:time(r.ended_at),recorded_at:time(r.recorded_at)})),
           replayHealth:health.map(h=>({...h,last_ok:time(h.last_ok),last_error:time(h.last_error)})),
           pendingTop24:pending.map((x,i)=>({position:i+1,member:name(x.riot_id),matchId:x.match_id,endedAt:time(x.ended_at)})),
           pendingCountTop24:pending.length,queries,rowsRead:reads,mutations:0,discordPosts:0,henrikCalls:0}));
          NODE
