name: Relics V8 final hash refresh
on:
  push:
    branches:
      - feat/relics-v8-sound-compact-custom-presets
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/relics-v8-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): final V8 iOS sound unlock cache"
            git push origin HEAD:feat/relics-v8-sound-compact-custom-presets
          fi
