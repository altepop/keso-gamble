name: VDK special race read-only status
# Repeat a read-only status check after the production D1 SQL hotfix.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vdk-special-race-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live crown reservation and Discord announcement receipt status
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT;
          if(!token||!account)throw Error('Cloudflare read-only diagnosis unavailable: deployment credentials missing');
          const worker='valorant-results',base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token};
          async function getJson(url,options={}){
            const response=await fetch(url,{...options,headers:{...headers,...options.headers},signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Cloudflare read failed with HTTP '+response.status);
            const body=await response.json();
            if(body.success!==true)throw Error('Cloudflare read failed (API reported error)');
            return body.result;
          }
          const settings=await getJson(base+'/workers/scripts/'+worker+'/settings');
          const db=settings.bindings?.find(b=>b.type==='d1'&&b.name==='DB')?.id;
          const hasWebhook=!!settings.bindings?.find(b=>b.name==='KP_EARNINGS_WEBHOOK_URL');
          if(!/^[a-f0-9-]{36}$/i.test(db??''))throw Error('Production D1 binding unavailable');
          const schedules=await getJson(base+'/workers/scripts/'+worker+'/schedules');
          const crons=Array.isArray(schedules)?schedules:schedules?.schedules??[];
          const sql="SELECT c.race, p.sent FROM kp_crowns c LEFT JOIN kp_posts p ON p.id='race-crown:' || c.race WHERE c.source LIKE 'special:vdk-four-races:20261115:%' ORDER BY c.race";
          const data=await getJson(base+'/d1/database/'+db+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const rows=Array.isArray(data)?data[0]?.results??[]:[];
          const clock=v=>new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
          const statuses=rows.map(x=>({time:clock(Number(x.race)),notice:x.sent===null?'NOT_QUEUED':Number(x.sent)===1?'SENT':'PENDING'}));
          const healthSql="SELECT feature,last_ok,last_error,error,failures FROM kp_health WHERE feature IN ('crown_schedule','earnings_post','horse_race','stock_market') ORDER BY feature";
          const healthResult=await getJson(base+'/d1/database/'+db+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:healthSql})});
          const healthRows=(Array.isArray(healthResult)?healthResult[0]?.results??[]:[]).map(h=>({feature:h.feature,lastOk:h.last_ok?clock(Number(h.last_ok)):null,lastError:h.last_error?clock(Number(h.last_error)):null,error:h.error,failures:h.failures}));
          console.log('VDK_EVENT_DIAGNOSIS '+JSON.stringify({reservedRaces:rows.length,notices:statuses,webhookConfigured:hasWebhook,minuteCronConfigured:crons.some(x=>x.cron==='* * * * *'),health:healthRows}));
          const lines=['# VDK special race reservation and notification check','','Production D1 was queried read-only. No data was changed.','','- Reserved races: '+rows.length+'/4','- Earnings webhook binding exists: '+hasWebhook,'- Every-minute cron exists: '+crons.some(x=>x.cron==='* * * * *'),''];
          for(const s of statuses)lines.push('- '+s.time+' JST: '+s.notice);
          lines.push('','## Cron health');
          for(const h of healthRows)lines.push('- '+h.feature+': '+(h.failures>0?'FAILED':'OK')+' last_ok='+String(h.lastOk??'-')+' last_error='+String(h.lastError??'-')+(h.failures>0?' error='+String(h.error??'unknown'):''));
          if(!rows.length)lines.push('','No VDK 4-race reservation rows were found at this check.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
