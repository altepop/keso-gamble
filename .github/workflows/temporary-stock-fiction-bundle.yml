name: Temporary build KESO fictional market activity
on:
  push:
    branches: [feat/stock-operator-fictional-headlines-20261031]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stock-operator-fictional-headlines-20261031
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Build browser bundle and verify short tests
        run: |
          npm run build:activity
          npm run check:activity
          npm test
      - name: Save cache-safe imports for Discord's iOS webview
        run: |
          if git diff --quiet -- js css index.html; then
            echo "No version changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          git commit -m "build: version all fictional market news modules for Discord"
          git push origin HEAD:refs/heads/feat/stock-operator-fictional-headlines-20261031
