name: Steam relic cap one-time Activity cache refresh
on:
  push:
    branches:
      - fix/steam-daily-cap-locks-exclusive-relics
    paths:
      - 'js/relics-view.js'
      - 'index.html'
      - '.github/workflows/steam-relic-cap-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Refresh browser versions without purging user data
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): refresh Steam relic 5k cap UI cache"
            git push origin HEAD:fix/steam-daily-cap-locks-exclusive-relics
          fi
