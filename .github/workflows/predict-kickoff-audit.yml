name: Temporary secure VALORANT match kickoff audit
on:
  push:
    paths:
      - .github/workflows/predict-kickoff-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && github.repository == 'altepop/keso-gamble'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CFTOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CFACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HENRIK_KEY: ${{ secrets.HENRIK_API_KEY }}
      WORKER_NAME: ${{ secrets.VALORANT_RESULTS_WORKER }}
    steps:
      - name: Inspect target match without writing D1 or printing user data
        run: |
          set -euo pipefail
          cat > /tmp/predict_pub.pem <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA/DcYQHcUvsm9tWpR8L+y
          9D7+A8AcoW0BP5Wz8gjWQ3zs7Z93wXh1GwRPQnOu/AKd5tAaCkbIW8c9ZQYn6QEz
          G2sre7D6WF7Hc3Dx+t18APw0WsKfuBf20u97uYiCBTS3PZO3ldEtpAQgsA8YZgPW
          mgZgnZCe0UKYQ2glODYMsOmjMGwQE9Th1S9BjeIEDZMPGh1m142bAdMFw8A3lXIG
          lDyX54HAgVa0H9oEgBl8xenGZOhyQp9M4Dyfcs8ad8OmeqrSLRbnhDMOA00WeFgo
          zQHtxzUznqRS2kMr8ALXiyZNnY6lpNMVyWleWYAek3hiZFzzRDvPahIRiVWVT64m
          O/ElSUgJSQI5vgKf3Id70dZZMh4Ol09KZYIZpDexIZ7Wz3mLiFfrVYZfwEfY/vll
          mW3ki/spzU85X5SL0MJu5xi8CQbIS0kIKEaCTpGB1e7JLz9f8CIir7GBhiVmDrcm
          /6frSIqZJ1Gk/zYmQ1qbiYGNhE020mdP5QP2f80kk0PnkmR/yFM7YfDGgcbwsbEV
          4N6ECH4KqdryJvhvoed8RKTPD3RIVlfAEA7Ncl1U4WhYlRKkpPnCOvbfJPB/kNeZ
          trC9292yGEcVEig9we1ehlLnkGZCV9cqv+a759f714w0hp4GAPHUAB1HTa7RyY1b
          EEH8cyvnrThL/ihxNTc0dGECAwEAAQ==
          -----END PUBLIC KEY-----
          PUB
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          from zoneinfo import ZoneInfo
          account=os.environ['CFACCOUNT']; token=os.environ['CFTOKEN']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def get(path,body=None):
            headers={'Authorization':'Bearer '+token}
            if body is not None: headers['Content-Type']='application/json'
            request=urllib.request.Request(base+path,headers=headers,data=json.dumps(body).encode() if body is not None else None)
            with urllib.request.urlopen(request,timeout=25) as response:result=json.load(response)
            if not result.get('success'):raise RuntimeError('cloudflare_request_failed')
            return result['result']
          settings=get('/workers/scripts/valorant-results/settings')
          db=[b['id'] for b in settings.get('bindings',[]) if b.get('type')=='d1' and b.get('name')=='DB']
          if len(db)!=1:raise RuntimeError('d1_binding_missing')
          def select(sql,params):
            ans=get('/d1/database/'+db[0]+'/query',{'sql':sql,'params':params})
            return ans[0].get('results',[]) if ans else []
          start=1794410700000
          end=1794411000000
          # For incident Nov 11 2026 23:25 to 23:30 JST, compute timestamps directly.
          start=int(datetime.datetime(2026,11,11,23,25,tzinfo=ZoneInfo('Asia/Tokyo')).timestamp()*1000)
          end=int(datetime.datetime(2026,11,11,23,30,tzinfo=ZoneInfo('Asia/Tokyo')).timestamp()*1000)
          events=select('SELECT id,created_at,status,outcome FROM vp_events WHERE created_at BETWEEN ? AND ? ORDER BY created_at LIMIT 3',[start,end])
          print('INCIDENT_EVENT_COUNT='+str(len(events)))
          if len(events)!=1:raise RuntimeError('unexpected_incident_event_count')
          e=events[0]
          matches=select("""SELECT n.ended_at,n.outcome,
           CAST(json_extract(s.value,'$.kickoff') AS INTEGER) AS kickoff,
           json_extract(s.value,'$.outcome') AS verified_outcome
           FROM notifications n JOIN vp_events e ON e.riot=n.riot_id AND e.mode=n.mode
           JOIN monitor_state s ON s.key='vp:incident:20261111:kickoff:'||n.match_id
           WHERE e.id=? AND n.ended_at>e.created_at AND n.ended_at<e.created_at+7200000
           ORDER BY n.ended_at,n.match_id LIMIT 2""",[e['id']])
          print('INCIDENT_VERIFIED_MATCHES='+str(len(matches)))
          if len(matches)!=2:raise RuntimeError('verified_kickoff_records_not_available')
          jst=ZoneInfo('Asia/Tokyo')
          fmt=lambda t:datetime.datetime.fromtimestamp(t/1000,jst).strftime('%Y-%m-%d %H:%M:%S')
          print('INCIDENT_CARD_CREATED_JST='+fmt(e['created_at']))
          for i,m in enumerate(matches):
            if m['outcome']!=m['verified_outcome']:raise RuntimeError('match_verification_failed')
            print('INCIDENT_MATCH_'+str(i+1)+'_RESULT='+m['outcome'])
            print('INCIDENT_MATCH_'+str(i+1)+'_KICKOFF_JST='+fmt(m['kickoff']))
            print('INCIDENT_MATCH_'+str(i+1)+'_ENDED_JST='+fmt(m['ended_at']))
            print('INCIDENT_MATCH_'+str(i+1)+'_ALREADY_STARTED_AT_CARD='+str(m['kickoff']<e['created_at']).lower())
          first=matches[0]
          tickets=select('SELECT side,stake,odds,purchased_at,status,payout FROM vp_tickets WHERE event_id=? ORDER BY purchased_at LIMIT 5',[e['id']])
          print('INCIDENT_TICKET_COUNT='+str(len(tickets)))
          for t in tickets:
            # Public output is limited to announced wager sides and temporal validity, no IDs/amounts.
            print('INCIDENT_'+t['side'].upper()+'_BET_VALID_AT_FIRST_KICKOFF='+str(t['purchased_at']<=first['kickoff']).lower())
            print('INCIDENT_'+t['side'].upper()+'_PREVIOUS_STATUS='+t['status'])
            print('INCIDENT_'+t['side'].upper()+'_PREVIOUS_PAYOUT_NONZERO='+str(t['payout']>0).lower())
          # Verify that the completed compensation is reflected atomically in the actual KP ledger.
          for attempt in range(12):
            corrected=select("SELECT value FROM monitor_state WHERE key='vp:incident:20261111:corrected'")
            if corrected:break
            time.sleep(10)
          print('INCIDENT_CORRECTION_MARKER='+str(bool(corrected)).lower())
          state=select("SELECT status,match_id,outcome FROM vp_events WHERE id=?",[e['id']])
          ledgers=select("""SELECT t.side,t.status,t.payout,t.stake,
            (SELECT l.delta FROM kp_ledger l WHERE l.id='vp:incident:20261111:reverse-win') AS win_adjustment,
            (SELECT l.delta FROM kp_ledger l WHERE l.id='vp:incident:20261111:refund-loss') AS loss_adjustment
            FROM vp_tickets t WHERE t.event_id=? ORDER BY t.side""",[e['id']])
          if state and ledgers:
            expected=state[0]['match_id']=='edab9334-5520-4d35-9ded-a92e3fe0b412' and state[0]['outcome']=='loss'
            expected=expected and len(ledgers)==2 and all(t['status']=='refunded' and t['payout']==t['stake'] for t in ledgers)
            expected=expected and all(t['win_adjustment']==-17600 and t['loss_adjustment']==5000 for t in ledgers)
            print('INCIDENT_CORRECTION_LEDGER_VERIFIED='+str(expected).lower())
          notices=select("SELECT sent FROM kp_posts WHERE id=? LIMIT 1",['vp:correction:'+e['id']])
          print('INCIDENT_CORRECTION_POST_SENT='+str(bool(notices and notices[0]['sent']==1)).lower())
          health=select("SELECT error,failures FROM kp_health WHERE feature='prediction_kickoff_audit' LIMIT 1")
          if health and health[0].get('error'):
            print('INCIDENT_JOB_LAST_ERROR='+str(health[0]['error'])[:90])
          print('INCIDENT_VERDICT_READ_ONLY=1')
          PY
