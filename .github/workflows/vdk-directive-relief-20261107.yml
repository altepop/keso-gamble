name: VDK Death Unrated directive relief (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vdk-directive-relief-20261107.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vdk-death-relief-20261107
  cancel-in-progress: false
jobs:
  relief:
    if: github.repository == 'altepop/keso-gamble' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test that unrelated directives cannot be changed
        run: node --test scripts/vdk-directive-relief-20261107.test.mjs
      - name: Complete only VDK's currently active solo Death Unrated directive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/vdk-directive-relief-20261107.mjs
