name: Temporary public Mahjong client inspection
on:
  pull_request:
    paths:
      - '.github/workflows/mahjong-public-client-once.yml'
permissions:
  contents: read
jobs:
  public-source:
    if: github.actor == 'altepop' && github.event.pull_request.number == 393 && github.event.pull_request.head.repo.full_name == 'altepop/keso-gamble' && github.head_ref == 'fix/mahjong-audit-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix services/valorant-results ci --ignore-scripts
      - name: Inspect declared public code as text, without login or execution
        working-directory: services/valorant-results
        run: |
          node --input-type=module <<'JS'
          import {parse} from 'acorn';
          const base='https://game.mahjongsoul.com/';
          async function read(url,limit){
            const r=await fetch(url,{signal:AbortSignal.timeout(30000),redirect:'error'});
            if(!r.ok)throw Error('public_http_'+r.status);
            const chunks=[];let size=0;
            for await(const c of r.body){size+=c.length;if(size>limit)throw Error('public_size_limit');chunks.push(c);}
            return Buffer.concat(chunks).toString('utf8');
          }
          try{
            const version=JSON.parse(await read(base+'version.json',65536));
            if(typeof version.code!=='string'||!/^v[0-9.]+w?\/code\.js$/.test(version.code))throw Error('public_code_path_unverified');
            const source=await read(new URL(version.code,base),20000000);
            console.log('Declared public code:',version.code,'bytes:',Buffer.byteLength(source));
            const ast=parse(source,{ecmaVersion:'latest'}),nodes=[],todo=[ast];
            while(todo.length){const n=todo.pop();if(!n||typeof n!=='object')continue;if(n.type)nodes.push(n);for(const [k,v] of Object.entries(n)){if(k==='value'||k==='regex')continue;if(Array.isArray(v))todo.push(...v);else if(v&&typeof v==='object')todo.push(v);}}
            const tables=new Map(),aliases=[];
            const literalTables=nodes.filter(n=>n.type==='ArrayExpression'&&n.elements.some(e=>e?.type==='Literal'&&e.value==='fetchGameRecordListV2'));
            console.log('Method table shapes:',JSON.stringify(literalTables.map(n=>({start:n.start,entries:n.elements.length,indices:['fetchGameRecordListV2','fetchNextGameRecordList','fetchGameRecord'].map(value=>n.elements.findIndex(e=>e?.value===value))}))));
            for(const n of nodes){if(n.type!=='AssignmentExpression'||n.operator!=='='||n.left.type!=='Identifier')continue;let rhs=n.right;while(rhs?.type==='AssignmentExpression')rhs=rhs.right;if(rhs?.type==='ArrayExpression'&&rhs.elements.length>10000)tables.set(n.left.name,rhs.elements);else if(rhs?.type==='Identifier')aliases.push([n.left.name,rhs.name]);}
            for(let round=0;round<12;round++)for(const [a,b] of aliases)if(!tables.has(a)&&tables.has(b))tables.set(a,tables.get(b));
            const edits=[];
            for(const n of nodes){if(n.type!=='MemberExpression'||!n.computed||n.object.type!=='Identifier'||n.property.type!=='Literal')continue;const item=tables.get(n.object.name)?.[n.property.value];if(item?.type==='Literal'&&['string','number','boolean'].includes(typeof item.value))edits.push({start:n.start,end:n.end,text:JSON.stringify(item.value),value:item.value});}
            console.log('Static literal tables:',tables.size,'references:',edits.length);
            for(const hit of [...source.matchAll(/\.ALL\s*=\s*\d+/g)].slice(0,5))console.log('Public ALL enum:',source.slice(Math.max(0,hit.index-100),hit.index+180));
            for(const hit of edits.filter(e=>e.value==='filterData'&&source.slice(e.end,e.end+2)==='={').slice(0,3)){
              const begin=hit.start,end=Math.min(source.length,hit.end+1500);let part=source.slice(begin,end);for(const e of edits.filter(e=>e.start>=begin&&e.end<=end).sort((a,b)=>b.start-a.start))part=part.slice(0,e.start-begin)+e.text+part.slice(e.end-begin);console.log('Public default filter:',part);
            }
            for(const method of ['fetchGameRecordListV2','fetchNextGameRecordList','fetchGameRecordList','fetchGameRecord']){
              const hits=edits.filter(e=>e.value===method).slice(0,3),excerpts=[];
              for(const hit of hits){const begin=Math.max(0,hit.start-1200),end=Math.min(source.length,hit.end+1800);let part=source.slice(begin,end);for(const e of edits.filter(e=>e.start>=begin&&e.end<=end).sort((a,b)=>b.start-a.start))part=part.slice(0,e.start-begin)+e.text+part.slice(e.end-begin);excerpts.push(part);}
              console.log(JSON.stringify({method,matches:hits.length,excerpts}));
            }
          }catch(e){console.error(/^public_[a-z0-9_]+$/.test(e.message)?e.message:'public_inspection_failed');process.exitCode=1;}
          JS
