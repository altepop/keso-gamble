# Temporary branch-only cache synchronization. Remove after the generated versions commit.
name: Duel feature branch cache synchronization
on:
  push:
    branches:
      - feat/duel-roundtrip-rematch-20261118
    paths:
      - .github/workflows/duel-activity-cache-build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate content-addressed Activity versions
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit generated browser import/cache versions on the feature branch only
        run: |
          git add js index.html
          if git diff --cached --quiet; then
            echo "Activity versions already consistent"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): sync duel feature browser cache versions'
          git push origin HEAD:refs/heads/feat/duel-roundtrip-rematch-20261118
