name: Relics V9 one-time Activity sound cache refresh
on:
  push:
    branches:
      - feat/relics-v9-cinematic-tiered-sound
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/relics-v9-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Commit versioned JS + CSS references to prevent stale Discord cache
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): refresh V9 cinematic audio release"
            git push origin HEAD:feat/relics-v9-cinematic-tiered-sound
          fi
