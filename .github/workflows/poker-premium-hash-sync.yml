name: Poker premium one-shot cache sync v2
on:
  push:
    branches: [feat/poker-premium-hand-reveal-20261119]
    paths: [.github/workflows/poker-premium-hash-sync.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test poker privacy, real rules and verified reveal
        run: node --test tests/duel-poker-quality.test.js
      - name: Build browser import revisions
        run: |
          npm run build:activity
          npm run check:activity
      - name: Commit generated import hashes
        run: |
          git add js index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(activity): synchronize poker view import versions'
          git push origin HEAD:refs/heads/feat/poker-premium-hand-reveal-20261119
