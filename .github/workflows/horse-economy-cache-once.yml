name: One-time horse economy browser cache build
on:
  push:
    branches:
      - fix/horse-box-roi-repricing-20261114
    paths:
      - .github/workflows/horse-economy-cache-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horse-box-roi-repricing-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate all browser module URL versions
        run: npm run build:activity
      - name: Commit generated version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate browser module versions for horse economy"
            git push origin HEAD:fix/horse-box-roi-repricing-20261114
          fi
