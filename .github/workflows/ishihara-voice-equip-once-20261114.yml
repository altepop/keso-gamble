name: One-time Ishihara voice relic equipment correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ishihara-voice-equip-once-20261114.yml']
permissions:
  contents: read
jobs:
  equip:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guarded owner-requested replacement of exactly one owned relic
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!/^[a-f0-9]{32}$/i.test(account??''))throw Error('Cloudflare credentials missing');
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={Authorization:'Bearer '+token};
          const settingResp=await fetch(api+'/workers/scripts/valorant-results/settings',{headers,signal:AbortSignal.timeout(25000)});
          if(!settingResp.ok)throw Error('Worker metadata unavailable: '+settingResp.status);
          const settings=await settingResp.json();
          const db=settings.result?.bindings?.find(b=>b.type==='d1'&&b.name==='DB')?.id;
          if(!settings.success||!/^[a-f0-9-]{36}$/i.test(db??''))throw Error('Worker D1 binding unavailable');
          async function query(sql,params=[]){
            const resp=await fetch(api+'/d1/database/'+db+'/query',{method:'POST',headers:{...headers,'Content-Type':'application/json'},
              body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)});
            const body=await resp.json().catch(()=>({}));
            if(!resp.ok||!body.success||!body.result?.[0]?.success){
              console.error('D1 operation rejected: HTTP '+resp.status,JSON.stringify((body.errors??[]).map(e=>({code:e.code,message:String(e.message??'').slice(0,120)}))));
              throw Error('D1 operation failed; no success assumed');
            }
            return body.result[0];
          }
          const targetSql="SELECT s.guild,s.user,s.data,s.version FROM kp_state s JOIN kp_accounts a ON a.guild=s.guild AND a.user=s.user WHERE lower(a.riot) LIKE 'h1d3g1g4s#%' LIMIT 2";
          const found=(await query(targetSql)).results;
          assert.equal(found.length,1,'Exact target must be unique; no other user can be edited');
          const row=found[0],state=JSON.parse(row.data),relics=state.relics??{};
          const ids=relics.equipped??[];
          const three='normal.voice.riddle.three',five='normal.voice.riddle.five',fifteen='normal.voice.riddle.fifteen';
          const former='normal.voice.midnight',next='normal.voice.alarm';
          const desired=new Set([three,five,fifteen,next]);
          if(Array.isArray(ids)&&ids.length===4&&ids.every(id=>desired.has(id))){
            console.log('equip_ishihara result=already-complete, no changes');process.exit(0);
          }
          assert.ok(Array.isArray(ids)&&ids.length===4&&ids.includes(former)&&ids.filter(id=>new Set([three,five,fifteen]).has(id)).length===3,
            'Target equipped different relics after audit; refusing to overwrite');
          assert.ok(relics.items?.[next]?.origin==='normal'&&relics.items[next].count>0,
            'Target does not own the required normal relic; refusing to grant inventory');
          const old=ids.map(id=>relics.items?.[id]);
          assert.ok(old.every(x=>x&&typeof x.id==='string'),'Previous equipped items invalid');
          const changedAt=Date.now();
          // Mirror normal in-app equip semantics: previous set retained 24 hours,
          // no KP movement, never edit any other members, no cooldown bypass.
          const prev=(relics.recentLoadouts??[]).filter(x=>x&&x.until>changedAt);
          relics.recentLoadouts=[{items:structuredClone(old),until:changedAt+24*3600000},...prev].slice(0,8);
          relics.equipped=ids.map(id=>id===former?next:id);
          relics.loadoutChangedAt=changedAt;
          assert.equal(relics.equipped.filter(id=>id===next).length,1);
          const update=await query('UPDATE kp_state SET data=?,version=version+1 WHERE guild=? AND user=? AND version=? AND data=?',
            [JSON.stringify(state),row.guild,row.user,row.version,row.data]);
          assert.equal(update.meta?.changes,1,'State changed concurrently: safe abort; no overwrite');
          const confirmed=(await query(targetSql)).results;
          assert.equal(confirmed.length,1,'Account lookup changed during update');
          const current=JSON.parse(confirmed[0].data).relics;
          assert.deepEqual(current.equipped,relics.equipped,'Read-back mismatch');
          assert.equal(current.loadoutChangedAt,changedAt);
          console.log('equip_ishihara result=success previous_fourth=midnight next_fourth=alarm, other_three_unchanged=true, owner_inventory_unchanged=true, kp_unchanged=true, cooldown_started=true');
          NODE
