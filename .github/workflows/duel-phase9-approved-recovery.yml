name: DUEL Phase 9 approved recovery activation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duel-phase9-approved-recovery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: duel-p9-production-policy
  cancel-in-progress: false
jobs:
  activate_once:
    if: github.repository == 'altepop/keso-gamble' && github.ref == 'refs/heads/main' && github.actor == 'altepop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove this recovery workflow is newly added, not edited or retriggered
        run: |
          if git cat-file -e HEAD^:.github/workflows/duel-phase9-approved-recovery.yml 2>/dev/null; then
            echo 'Existing recovery workflow must never reactivate production'
            exit 1
          fi
          test -f .github/workflows/duel-phase9-approved-recovery.yml
      - name: Require same-main-SHA successful Pages and Worker deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node services/valorant-results/scripts/duel-phase9-release-gate.mjs
      - name: Run one approved Phase 9 reward activation and independently read it back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DUEL_RELEASE_ACTOR: altepop
          DUEL_RELEASE_OPERATION: activate
          DUEL_RELEASE_GUILD: '606131625084059674'
        run: node services/valorant-results/scripts/duel-phase9-release.mjs
