name: Temporary Mahjong read-only version comparison
on:
  pull_request:
    paths:
      - '.github/workflows/mahjong-live-version-probe.yml'
      - 'scripts/mahjong-live-version-probe.mjs'
      - 'services/valorant-results/scripts/mahjong-paipu.mjs'
permissions:
  contents: read
concurrency:
  group: mahjong-paipu
  cancel-in-progress: false
jobs:
  read-only-comparison:
    if: github.actor == 'altepop' && github.event.pull_request.head.repo.full_name == 'altepop/keso-gamble' && github.head_ref == 'fix/mahjong-audit-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm --prefix services/valorant-results ci --ignore-scripts
      - run: node services/valorant-results/scripts/prepare-local.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python3 -m venv /tmp/mahjong-calculator
          /tmp/mahjong-calculator/bin/pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r services/valorant-results/scripts/sanma-requirements.txt
          echo 'SANMA_PYTHON=/tmp/mahjong-calculator/bin/python' >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: services/valorant-results/.cache/c3-model
          key: equal-review-c3-5b30a83de3ab9523
      - run: node scripts/mahjong-live-version-probe.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOSTAR_UID: ${{ secrets.YOSTAR_UID }}
          YOSTAR_TOKEN: ${{ secrets.YOSTAR_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          C3_ASSETS_ROOT: ${{ github.workspace }}/services/valorant-results/.cache/c3-model
