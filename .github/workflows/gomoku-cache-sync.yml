name: Gomoku one-shot Activity cache sync
on:
  push:
    branches:
      - feat/gomoku-mobile-zoom-last-move-20261119
    paths:
      - .github/workflows/gomoku-cache-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gomoku-mobile-zoom-last-move-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Run Gomoku, lobby and existing duel safety tests
        run: |
          node --test tests/duel-gomoku-quality.test.js tests/duel-lobby.test.js
      - name: Regenerate content-addressed Activity imports
        run: |
          npm run build:activity
          npm run check:activity
      - name: Save correct browser cache graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html duel-demo.html js/
          if ! git diff --cached --quiet; then
            git commit -m 'build(gomoku): refresh mobile zoom and move-marker Activity cache'
            git push origin HEAD:feat/gomoku-mobile-zoom-last-move-20261119
          fi
