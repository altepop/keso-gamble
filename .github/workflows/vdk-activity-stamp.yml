# Temporary, branch-scoped formatter: keep the strict Activity cache-version gate intact.
name: VDK Activity cache stamp
on:
  push:
    branches: [feat/vdk-bankruptcy-ipo-20261120]
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate canonical content-derived cache version
        run: node scripts/build-activity.mjs
      - name: Commit only generated browser version updates
        run: |
          if git diff --quiet -- js index.html; then
            echo 'Activity version already matches source'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js index.html
          git commit -m "build(activity): refresh content-derived version for VDK event"
          git push origin "HEAD:refs/heads/feat/vdk-bankruptcy-ipo-20261120"
