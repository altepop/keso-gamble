name: Relics V5 Activity release preparation
on:
  push:
    branches:
      - feat/relics-v5-readable-bonuses-and-exotics
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/relics-v5-cache.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:activity
      - name: Commit stable browser cache hashes
        run: |
          if ! git diff --quiet -- index.html js css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html js css
            git commit -m "build(activity): refresh V5 browser module hashes"
            git push origin HEAD:feat/relics-v5-readable-bonuses-and-exotics
          fi
