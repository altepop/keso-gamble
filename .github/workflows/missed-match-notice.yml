name: Missed match record (owner)

# One-off, owner-approved: record a finished match the monitor missed so streaks and daily/ACT records count it.
# Inserts one already-sent notifications row (nothing is posted). Never changes KP, ledger or rewards.
on:
  workflow_dispatch:
    inputs:
      discord_id:
        description: Discord user ID of the member
        required: true
      mode:
        description: spikerush / competitive / unrated_normal / swiftplay / hurm / escalation / deathmatch / skirmish_2v2
        required: true
      outcome:
        description: win / loss / draw
        required: true
      ended_at:
        description: When the match ended (ISO 8601, e.g. 2026-11-04T21:36:22+09:00)
        required: true

permissions:
  contents: read

concurrency:
  group: missed-match-notice
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'altepop/keso-gamble' && github.actor == 'altepop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the correction
        run: node --test scripts/missed-match-notice.test.mjs
      - name: Record the missed match
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_ID: ${{ inputs.discord_id }}
          MODE: ${{ inputs.mode }}
          OUTCOME: ${{ inputs.outcome }}
          ENDED_AT: ${{ inputs.ended_at }}
        run: node scripts/missed-match-notice.mjs
