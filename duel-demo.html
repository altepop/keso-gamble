<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071229"><title>KESO PLAY | 決闘デモ</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./duel-preview/demo.css?v=cpu-20261107-v3">
</head><body>
<div class="demo-toolbar">
 <div class="demo-brand"><strong>KESO PLAY</strong><span id="demo-title">決闘デモ</span><a href="./index.html" rel="noopener" data-demo-return>アプリに戻る</a></div>
 <div class="demo-control-line" role="group" aria-label="練習の形式"><span class="demo-control-title">遊び方</span>
 <button type="button" data-demo-play="cpu" aria-pressed="false">CPUと練習</button>
 <button type="button" data-demo-play="two" aria-pressed="true">2人操作で確認</button></div>
 <div class="demo-control-line" id="demo-view-switch"><span class="demo-control-title">画面を見る人</span><button type="button" data-demo-view="a">プレイヤーA</button><button type="button" data-demo-view="b">プレイヤーB</button></div>
 <div class="demo-control-line"><span class="demo-control-title">ゲーム</span><select id="demo-mode" aria-label="デモのゲームを選ぶ">
 <option value="othello">オセロ</option><option value="gomoku">五目並べ</option><option value="connect4">四目並べ</option><option value="hitblow">Hit &amp; Blow</option><option value="bluffdice">ブラフダイス</option><option value="poker">5カードポーカー</option>
 </select><button type="button" id="demo-reset">最初からやり直す</button></div>
 <div class="demo-control-line" id="demo-cpu-settings" hidden><label for="demo-cpu-level">CPUの強さ</label><select id="demo-cpu-level" aria-label="CPUの強さ"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="strong">強め</option></select><span class="demo-cpu-help">CPUが自動で手を返す。何度でもやり直せる。</span></div>
 <p id="demo-cpu-explain" class="demo-cpu-explain" aria-live="polite"></p>
 <p class="demo-notice" id="demo-notice">本番KP・D1・Discordには接続しない。この画面だけで2人分の操作を確認できる。<strong>表示する人を切り替えると手札も切り替わる。</strong></p>
 <div id="demo-feedback" role="status" aria-live="polite"></div>
</div><main id="demo-app" aria-label="決闘デモ"></main>
<script>
document.querySelector('[data-demo-return]').addEventListener('click',function(event){
  // Inside the main Activity, close the practice subview instead of reloading Discord auth.
  // A directly opened demo keeps its regular link back to index.html.
  if(window.parent===window)return;
  event.preventDefault();
  window.parent.postMessage({type:'keso:close-cpu-practice'},window.location.origin);
});
</script>
<script type="module" src="./duel-preview/demo.js?v=connect4-fallback-20261107-v1"></script>
</body></html>
